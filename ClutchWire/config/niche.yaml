niche_id: "sports"
display_name: "ClutchWire"
channel_handle: "@theclutchwire"
description: "Sports content pipeline — live scores, highlights, clutch moments"

brand_voice:
  tone: "urgent, electric, insider, punchy"
  forbidden_words: ["allegedly", "reportedly", "perhaps", "might", "could be"]
  hook_style: "emotional_reaction"
  emoji_style: "strategic"

target_audience:
  primary: "Sports fans aged 18-34"
  secondary: "NBA, NFL, Premier League, UFC enthusiasts, highlights watchers"
  interests: ["NBA", "NFL", "Premier League", "UFC", "clutch moments", "sports highlights"]
  platforms_primary: ["instagram", "youtube", "tiktok"]
  platforms_secondary: ["x", "facebook", "threads"]

accent_color: "#FF2040"

feature_flags:
  use_live_publishing: true
  platforms_enabled:
    - youtube
    - instagram
    - facebook
    - x_twitter
    - threads
  tiktok:
    enabled: false
    audit_approved: false
    daily_post_limit: 12
    posting_windows_utc: ["06:00", "12:00", "16:00"]
  threads:
    enabled: true
    daily_post_limit: 4

video_sourcing:
  strategy: trending_youtube
  niche_category: sports
  max_age_hours: 48
  top_n_per_run: 15
  # Fix #5 of the autonomy roadmap (2026-06-13). Pre-fix sports
  # conversion was 884 stories → 50 published in 60d (5.7%, vs gaming
  # 43.4%). Sports has three ingestion stages (YouTube + ScoreBat +
  # Reddit) plus the shared content_pool, so the upstream supply was
  # ~4× any other niche. Raising min_view_velocity from 200 → 400
  # halves the YouTube candidates that pass the upstream filter while
  # keeping all the real-trending content. Combined with the Reddit
  # per_sub_limit cut in sources.yaml, this should bring sports'
  # 60-day story count from ~884 down to ~250 with same published
  # output (~50) → conversion 20%.
  min_view_velocity: 400
  use_google_trends: true
  allow_keyword_search: true
  video_gate: require
  fallback_to_text_render: false
  composite_quality_gate:
    velocity_threshold: 400
    # Bumped 0.25 → 0.32 — same rationale as min_view_velocity above.
    # The strong-signal items still clear (sports YouTube max view count
    # in 60d = 13,126 plays — way above any reasonable threshold) while
    # the long-tail wisecrack/edutainment clips that drove the 32-blueprint
    # reject pile (noted in sources.yaml content_filter comments) get
    # pre-culled at the composite stage instead of human-review.
    min_composite_score: 0.32

# P4 (2026-06-20): opt in to the shared pipeline backbone — the canonical
# stage ORDER + common stages live in genlab-core/config/pipeline_template.yaml.
# Only niche-specific strategy classes + extra ingestion fetchers are listed
# below under ``pipeline.inject``. The loader (``niche_loader``) splices them
# into the template's named inject points.
#
# To add a NEW shared stage to all 4 templatized niches, edit the template
# file ONCE — no per-niche.yaml edits required (the historical 5-edit
# AffiliateMatch problem this PR closes).
pipeline_template: backbone

pipeline:
  inject:
    # Niche-specific ingestion fetcher (in addition to FetchTrendingVideos
    # + FetchRedditClips which the template provides).
    #
    # 2026-07-14 niche-audit note: scorebat is disabled at
    # sources.yaml:176 (`enabled: false` — scorebat emits embed-page
    # URLs incompatible with yt-dlp). The stage runs but no-ops.
    # Left wired so re-enabling scorebat only requires flipping
    # sources.yaml, not touching niche.yaml. If scorebat is
    # permanently retired, delete this block + the sources.yaml
    # `scorebat:` section together.
    phase1_fetchers_extra:
      - class: genlab_core.pipeline.stages.fetch_scorebat.FetchScoreBatHighlights
        retries: 1
        retry_delay_seconds: 15

    # Niche-specific content research + scoring strategies. Each niche
    # supplies its own class — these are the points where channel
    # personality ("punchy sports voice") enters the pipeline.
    phase1_content_research:
      - class: cw_strategies.content_research.SportContentResearchStrategy
        retries: 1
        retry_delay_seconds: 30
    phase1_scoring:
      - class: cw_strategies.scoring.SportScoringStrategy

    # ClutchWire doesn't need a relevance gate (sports content is filtered
    # by the upstream Reddit subreddit list + ScoreBat keyword matching).
    # BB will populate this slot.
    phase1_relevance_gate: []

    # Niche-specific writing + hooks strategies.
    phase2_writing:
      - class: cw_strategies.writing.SportWritingStrategy
        retries: 1
        retry_delay_seconds: 60
    phase2_hooks:
      - class: cw_strategies.hooks.SportHookStrategy

    # Primary render — fail-fast on missing video (P6 broader adoption,
    # 2026-06-19). Layered post-render effects keep fail_mode=continue
    # in the template.
    phase4_visual_render:
      - class: cw_strategies.visual_render.SportVisualRenderStrategy
        fail_mode: abort

    # Per-platform adaptation strategy (caption shaping, hashtag policy).
    phase5_platform_adaptation:
      - class: cw_strategies.platform_adaptation.SportPlatformAdaptationStrategy

  max_items_per_run: 10
  min_score_threshold: 0.20
  dedup_window_days: 7  # Sports has 435 stories — tighter window to prevent starvation
  # Sports has multiple distinct clips per game ("Curry 3-pointer", "LeBron
  # dunk", "Mahomes TD pass" — all from the same game might use the team
  # name in the title). 3-day title window allows different moment-clips
  # from the same game/team without re-blueprinting the same actual video.
  title_dedup_days: 3
  # URL-dedup TTL — ScoreBat match URLs for popular fixtures recur
  # within 1-2 weeks (same Liverpool vs Crystal Palace match page gets
  # cited in multiple highlight clips over the week). Live diagnosed
  # 2026-06-23: PreDownloadDedup dropped 3 of 5 stories (Angers-PSG,
  # Getafe-Barcelona, Liverpool-Crystal Palace) as URL-already-published,
  # contributing to the 5-day publishing gap.
  #
  # 2026-06-28 — lowered from 7 → 3 days (matches gaming PR #627
  # trade-off). Sports' 7-day pattern shows 3 zero-blueprint days out
  # of 7 (06-22, 06-26, etc), same structural shape as gaming. Shorter
  # TTL lets popular fixtures re-feature every 3 days instead of weekly,
  # accepting slight feed repetition for steady cadence. Sports still
  # produces 1.86 blueprints/day on average so this is marginal lift
  # not a starvation fix — main effect is reducing variance.
  url_dedup_ttl_days: 3
