- id: A-0011
  phase: 1
  host: mac
  title: "Nested genlab-core/.git repo on Mac holds orphan HEAD; git commands from inside the dir silently target the phantom repo"
  category: correctness
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'ls -ld genlab-core/.git; git -C genlab-core rev-parse HEAD; git -C genlab-core rev-parse --show-toplevel'
      host: mac
      output: |
        drwxr-xr-x  14 anarchistsid  staff  448 21 Jul 16:12 genlab-core/.git
        ec9925c8d601af397793ca40db15de3ff9aa1ab5
        /Users/anarchistsid/GenLab/genlab-core
    - command: 'git cat-file -e ec9925c8d601af397793ca40db15de3ff9aa1ab5 && echo REACHABLE || echo ORPHAN'
      host: mac
      output: |
        ORPHAN
    - command: 'git log --all --oneline --grep="feat(migration): content_pool expires_at default 48h -> 96h"'
      host: mac
      output: |
        4e48cd29 feat(migration): content_pool expires_at default 48h -> 96h (fce3b7f2daf0)
        (parent has an equivalent commit at 4e48cd29 2026-07-21 16:13:22, one minute after nested repo's ec9925c 2026-07-21 16:12:20 — same subject, different SHAs)
    - command: 'du -sh genlab-core/.git; cat genlab-core/.git/HEAD'
      host: mac
      output: |
        12M	genlab-core/.git
        ref: refs/heads/main
    - command: 'cat .gitmodules 2>&1'
      host: mac
      output: |
        cat: .gitmodules: No such file or directory
  claim: >
    genlab-core/.git is a fully functional standalone git repository (12 MB, HEAD refs
    heads/main, HEAD commit ec9925c) inside the monorepo — but it is not registered as a
    git submodule (no .gitmodules) and its HEAD is orphan-history relative to the parent.
    Any git command run with the working directory inside genlab-core/ (or via git -C
    genlab-core) silently uses the nested repo, not the monorepo.
  blast_radius: >
    A developer who cd's into genlab-core and runs `git commit -m 'fix X'` writes to the
    nested repo, which has no remote configured (not verified this phase — but even if
    remote existed, it's a different remote than the monorepo). The commit sits in
    genlab-core/.git indefinitely, never pushed, invisible to monorepo `git log`. If the
    directory is later blown away or refreshed via `git clean`, the work is lost.
    Furthermore, the two "same subject" commits one minute apart (ec9925c in nested,
    4e48cd29 in parent) suggest this has already happened at least once — someone made
    a change, committed to the nested repo, then rewrote/redid it in the parent.
    The 12 MB of history in the nested .git could contain commits the parent lacks
    entirely; verifying that requires a full commit-set diff (deferred to Phase 9's
    disposition step, not Phase 1's inventory).
  effort: M
  proposed_action: investigate
  supersedes: []

- id: A-0012
