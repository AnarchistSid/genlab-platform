# Publishing configuration — CriticalRush gaming niche

rate_limits:
  instagram:
    requests_per_hour: 200
    burst: 10
  youtube:
    requests_per_hour: 100
    burst: 3
  x_twitter:
    requests_per_hour: 50
    burst: 2
  facebook:
    requests_per_hour: 200
    burst: 10
  tiktok:
    requests_per_hour: 6     # TikTok hard limit: 6 init requests/min
    burst: 1
  threads:
    requests_per_hour: 200   # 250 posts/24hr — keep headroom
    burst: 5

platforms:
  enabled:
    - instagram
    - youtube
    # - twitter          # Disabled Sprint 30
    - facebook
    # - threads          # Disabled 2026-06-05: 100% container-creation
    #                    # failures since tokens expired; single-digit
    #                    # engagement (avg 6) for gaming anyway.
  concurrent_publish: true
  publish_strategy: "best_effort"  # "best_effort" | "all_or_nothing"

instagram:
  schedule_slots:
    - "12:00"
  video_aspect_ratio: "9:16"
  max_caption_length: 2200
  max_hashtags: 5

youtube:
  video_aspect_ratio: "9:16"
  max_short_duration_seconds: 180
  category_id: 20              # Gaming category
  privacy_status: "public"

twitter:
  max_tweet_length: 275
  max_video_duration_seconds: 140
  include_source_link: true

facebook:
  max_post_length: 5000
  post_mode: "auto"

tiktok:
  video_aspect_ratio: "9:16"
  max_caption_length: 2200
  title_display_limit: 150   # First 150 chars visible before "more"
  max_hashtags: 5

threads:
  max_caption_length: 500
  reply_control: "everyone"


# ─────────────────────────────────────────────────────────────────────
# auto_publish — AUTO #2 enforcement scaffolding (2026-06-28)
# ─────────────────────────────────────────────────────────────────────
#
# Per the AUTO #2 rollout runbook (docs/runbooks/AUTO_2_ROLLOUT_2026-06-15.md)
# every niche needs this block before the enforcement worker can read
# its policy. Currently disabled (enabled: false + rollout_pct: 0.0)
# — the file exists so a single PR can flip THIS niche on without
# scrambling for the file shape when calibration data justifies it.
#
# DO NOT FLIP without (per runbook §9 readiness checklist):
#   1. ≥30 calibration samples × ≥90% agreement for THIS niche
#      (read /api/v1/auto-approval/calibration-stats?niche_id=<this>)
#   2. Operator-runbook pre-flight checks
#   3. PR-based change (NOT a hand-edit on prod) per 2026-06-14
#      deploy-pipeline-gap lesson
#
# Reference: BlackboxBrief/config/publishing.yaml has the full template
# (ai_creators is at rollout_pct: 0.1 in Week-1 ramp as of 2026-06-26).
#
# Kill switches (in order of severity, all reversible via PR):
#   - rollout_pct: 0.0  → blocks all approvals for THIS niche only
#   - enabled: false    → soft disable
#   - GENLAB_AUTO_APPROVE_DISABLED=1 in /opt/genlab/.env → global kill
#   - touch /opt/genlab/.runtime/auto_approve_kill_switch → file flag

# 2026-07-17: FLIPPED ON — auto-approver enforcement moved to gaming
# from ai_creators. Reason (session-2026-07-17 audit round 3,
# comprehensive learning-state query): gaming is empirically READY:
#
#   Calibration: 116 samples × 90.5% agreement (clears ≥30 × ≥90%)
#   Bandit stack: 590 observations (best-trained of any niche)
#   Top posteriors: style:gaming:question 19.5% (n=29),
#                   gameplay_clip 11.1% (n=191)
#   Ensemble votes: 84 in last 30d (only niche with active ensemble)
#   Time × platform winner: hour:6:facebook:gaming = 10.2%
#
# ai_creators was flipped OFF in same session (7.9% agreement, WORST
# of 5 niches — see BlackboxBrief/config/publishing.yaml).
#
# Auto-ramp (genlab-auto2-ramp.timer, daily 15:00 IST) will advance
# rollout_pct 0.10 → 0.20 → 0.30 → 0.40 → 0.50 automatically as
# calibration stays above 90% agreement (RAMP_INCREMENT=0.10 per
# fire, DEFAULT_MAX_ROLLOUT_PCT=0.50 caps auto-ramp — operator has
# to manually push past 0.50 to reach 1.0).
#
# min_confidence=0.80 matches ai_creators's calibrated value from
# PR #786. Gaming's confidence math is healthier — bandit contributes
# real signal (not just prior), and hook_classifier's uncertainty-band
# skip (session-2026-07-17 commit 5350d1c1) removes the sub-0.4
# noise drag. So the 0.80 floor should clear naturally on strong
# gaming blueprints (top arms deliver 3-4× baseline engagement).
auto_publish:
  enabled: true
  min_confidence: 0.80
  max_approvals_per_pass: 3
  rollout_pct: 0.10
