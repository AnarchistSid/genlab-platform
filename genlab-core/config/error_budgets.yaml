# Error Budgets and SLOs

version: "1.0"

# Daily intel run
daily_intel:
  success_rate: 0.98
  duration_p95: 2400        # seconds (40 min — realistic for full 23-step pipeline)
  qc_pass_rate: 0.90
  cost_daily: 5.00          # USD
  cache_hit_rate: 0.60      # SLO target (alert threshold is 0.40 in alerts section)
  express_target_rate: 0.95  # 95% of express runs under 45 min

# Weekly inspo update
weekly_inspo:
  success_rate: 0.95
  duration_p95: 300         # seconds (5 min)

# Quality gates
qc_gates:
  claim_coverage: 1.00
  constraint_compliance: 1.00
  risk_mitigation: 1.00

# Alerting thresholds
alerts:
  critical:
    - run_failed: true
    - weekly_cost_exceeded: 40.00
    - qc_pass_rate_below: 0.80   # 3 consecutive days
  warning:
    - source_down_days: 2
    - cache_hit_rate_below: 0.40
    - duration_exceeded: 3600     # 60 min
