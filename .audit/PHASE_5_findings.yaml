- id: A-0056
  phase: 5
  host: both
  title: "FB_APP_SECRET and META_APP_SECRET have identical hashes — same value under two names (credential duplication with confusable names)"
  category: security
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'awk -F= "!/^#/ && (\$1 == \"FB_APP_SECRET\" || \$1 == \"META_APP_SECRET\") { val=substr(\$0, index(\$0, \"=\")+1); cmd=\"printf %s \" val \" | shasum -a 256 | cut -c1-12\"; cmd | getline hash; printf \"%-20s hash=%s\n\", \$1, hash; close(cmd) }" /Users/anarchistsid/GenLab/.env'
      host: mac
      output: |
        FB_APP_SECRET        hash=67c264537735
        META_APP_SECRET      hash=67c264537735
  claim: >
    Both keys hold the same value (identical 12-char SHA-256 prefix 67c264537735).
    Neither actual value printed. The naming is confusable — FB_APP_SECRET vs
    META_APP_SECRET — leading a reader to think they refer to different apps when
    they refer to the same Meta app credential.
  blast_radius: >
    Class-of-bug: renamed-but-not-deleted. A caller reading FB_APP_SECRET vs
    META_APP_SECRET believes they have separate rotation paths; they don't. On rotation
    of one, forgetting to rotate the other leaves stale material. Fix: pick one canonical
    name (recommend META_APP_SECRET since CLAUDE.md rule "Always use graph.facebook.com"
    already normalizes Meta terminology); remove the other; grep code for all usages
    before deletion.
  effort: S
  proposed_action: consolidate
  supersedes: []

