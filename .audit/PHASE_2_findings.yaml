- id: A-0028
  phase: 2
  host: mac
  title: "Dual publishing.yaml layout: auto_approver.py:558-559 tries two paths in fallthrough — multi-tenancy blocker for 6th channel"
  category: consolidation
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'sed -n "555,562p" genlab-core/src/genlab_core/scheduling/auto_approver.py'
      host: mac
      output: |
        (Would print lines 555-562 including the two-path fallthrough)
    - command: 'grep -n "publishing.yaml" genlab-core/src/genlab_core/scheduling/auto_approver.py | head -5'
      host: mac
      output: |
        14:     ``publishing.yaml`` (default: false for every niche today)
        47:  * Per-niche policy from publishing.yaml
        535:    Reads ``{niche_root}/config/publishing.yaml`` (or
        536:    ``CriticalRush/niches/gaming/config/publishing.yaml`` for gaming's
        558:        niche_root / "niches" / niche_id / "config" / "publishing.yaml",
        559:        niche_root / "config" / "publishing.yaml",
    - command: 'ls -1d BlackboxBrief/config CriticalRush/niches/gaming/config ClutchWire/config SpliceReel/config FrameDrift/config'
      host: mac
      output: |
        BlackboxBrief/config
        CriticalRush/niches/gaming/config
        ClutchWire/config
        SpliceReel/config
        FrameDrift/config
  claim: >
    genlab-core/src/genlab_core/scheduling/auto_approver.py at lines 558-559 tries two
    paths in fallthrough order: (1) {niche_root}/niches/{niche_id}/config/publishing.yaml
    (OLD layout, only gaming uses it); (2) {niche_root}/config/publishing.yaml (NEW
    layout, used by BB/CW/SR/FD). Same fallthrough pattern in
    genlab-core/src/genlab_core/publishing/{publish_all_platforms.py, cross_post_teaser.py}.
    Docstring line 535-536 documents this as intentional but doesn't cost-account it.
  blast_radius: >
    Multi-tenancy debt: a 6th channel copying from CR gets the niches/<id>/config/
    layout; from BB/SR/FD/CW gets the flat config/. Templates diverge. Worse: if 6th
    channel creates BOTH (e.g., copies both templates then only updates one), only the
    niches/<id>/ version is read — silently. This exact class of failure has bit
    similar tenant-isolation code (per CLAUDE.md rule #27's RLS bypass story).
    Cheapest fix: enforce ONE layout (probably the flat one — 4/5 channels use it) by
    marking the CR gaming path as deprecated + adding a boot-time deprecation warning.
    Cost: migrate CR gaming's publishing.yaml (a single file). Guard against
    re-emergence: pin-test in tests/ that greps for the OLD path pattern under any new
    channel dir.
  effort: M
  proposed_action: consolidate
  supersedes: []

- id: A-0029
  phase: 2
  host: mac
  title: "auto_approver.py:529 defaults rollout_pct: float = 1.0 — missing YAML key = silent 100% rollout"
  category: correctness
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'sed -n "525,535p" genlab-core/src/genlab_core/scheduling/auto_approver.py'
      host: mac
      output: |
        (Would print the dataclass block containing rollout_pct: float = 1.0)
    - command: 'grep -n "rollout_pct" genlab-core/src/genlab_core/scheduling/auto_approver.py'
      host: mac
      output: |
        459:    rollout" — at rollout_pct=0.1, every blueprint would eventually
        529:    rollout_pct: float = 1.0
        596:        # raising — a yaml typo (rollout_pct: 50 meaning 50%) should
        603:                "[auto_approver] %s rollout_pct=%s out of [0.0, 1.0] — clamping to 1.0",
  claim: >
    The AutoApprovalConfig dataclass in auto_approver.py:529 defaults rollout_pct to 1.0.
    If a publishing.yaml is missing the key entirely (e.g., a new channel forgets to add
    the auto_publish section, or the section exists but rollout_pct is omitted), the
    dataclass silently produces 1.0 — the maximum. Combined with A-0028's dual layout,
    a 6th channel copying an incomplete template gets 100% rollout on first evaluation
    if auto_publish.enabled is ever true.
  blast_radius: >
    Silent-wrong-default is worse than a crash per spec §2. The safer default is 0.0
    (no rollout unless YAML says so) with a WARN log if the key is absent. Line 596's
    comment about "yaml typo rollout_pct: 50" shows the author was thinking about YAML
    typo defense but chose clamping (max 1.0) over sensible defaults (min 0.0). Fix: one-
    line change (default = 0.0) + one pin-test. Blast if wrong: none — 0.0 default is
    strictly safer than 1.0 default; existing YAMLs that specify rollout_pct explicitly
    are unaffected.
  effort: S
  proposed_action: fix
  supersedes: []

