namespace: anarchistsid
name: reel-spec-check
description: |
    Validate a rendered video against short-form platform specs before you
    publish it. Checks geometry (1080x1920), bt709 colour tags, h264/aac,
    duration window, and EBU R128 integrated loudness — then goes further and
    answers two things structural checks miss: is a narration track actually
    audible in the mix, and would a separate voice-over be truncated by the
    video length. Voice detection is a 1-3.4 kHz speech-band measurement, not
    ASR — two ffmpeg passes, CPU only, about a second.
metadata:
    tags:
        - video
        - audio
        - ffmpeg
        - qc
        - validation
        - loudness
        - lufs
        - ebu-r128
        - bt709
        - reels
        - shorts
        - utility
category: video
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
kernel: python-3.11
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 2048
