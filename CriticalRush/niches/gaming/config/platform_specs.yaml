# DEPRECATED: Per-platform encoding specs are now defined in genlab-core's
# PLATFORM_SPECS (genlab_core.media.ffmpeg.PLATFORM_SPECS) as RenderSpec
# Pydantic models with codec, CRF, preset, colorspace, fps, and audio settings.
# This file is retained for reference (content constraints like max_duration,
# caption limits, hashtag limits) but encoding params here are NOT consumed.
#
# Per-platform video specifications

platforms:
  youtube_shorts:
    display_name: "YouTube Shorts"
    aspect_ratio: "9:16"
    resolution:
      width: 1080
      height: 1920
    fps: 60
    max_duration_seconds: 180
    min_duration_seconds: 15
    codec:
      video: "h264"
      audio: "aac"
    container: "mp4"
    bitrate_kbps: 12000
    audio_sample_rate: 48000
    audio_channels: 2
    audio_bitrate_kbps: 320
    loudness_target_lufs: -14
    max_file_size_mb: 256
    title_max_length: 100
    description_max_length: 5000
    max_hashtags: 15

  instagram_reels:
    display_name: "Instagram Reels"
    aspect_ratio: "9:16"
    resolution:
      width: 1080
      height: 1920
    fps: 30                        # Instagram caps at 30fps
    max_duration_seconds: 90
    min_duration_seconds: 15
    codec:
      video: "h264"
      audio: "aac"
    container: "mp4"
    bitrate_kbps: 10000
    audio_sample_rate: 44100
    audio_channels: 2
    audio_bitrate_kbps: 256
    loudness_target_lufs: -14
    max_file_size_mb: 100
    caption_max_length: 2200
    max_hashtags: 30

  tiktok:
