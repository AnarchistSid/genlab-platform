[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genlab-core"
version = "0.1.0"
description = "Shared infrastructure for all Gen Lab content agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",  # comment-preserving YAML roundtrip for config_updater
    "structlog>=24.1",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "anthropic>=0.45",
    "openai>=1.0",
    "requests[socks]>=2.32",  # 2026-07-14 added [socks] extra — prod .env sets GENLAB_HTTP_SOCKS_PROXY=socks5h://127.0.0.1:9050 (Tor) for Reddit fetches; without PySocks (pulled by [socks]) every Reddit RSS + JSON call fails with "Missing dependencies for SOCKS support" and 12 subreddits per sports run silently return 0 candidates.
    "pytrends>=4.9",  # Google Trends wrapper — used by intel/{google_trends,trend_anticipation,anticipation_accuracy}. Silent ImportError absent this dep = 3 dormant intelligence features + validation window never becomes "ready".
    "feedparser>=6.0",
    # 2026-07-17: TTS free-tier fallbacks promoted from `[project.optional-
    # dependencies].tts` to main deps. Same class-of-bug as pytrends above:
    # `edge_tts` and `gtts` are the LAST-line providers in the 4-tier cascade
    # (ElevenLabs → OpenAI → Edge → gTTS). Absent from prod venv → cascade
    # returns `success=False` → GenerateAudio's `Non-fatal: TTS failures
    # leave blueprints without audio` comment kicked in → videos shipped
    # silent for weeks. Confirmed 2026-07-17 by smoke-test on prod: all 3
    # free-tier packages were `MISSING` and OpenAI TTS returned 429
    # `insufficient_quota` on the paid path. ElevenLabs stays as optional
    # extra — paid + heavy SDK, opt-in via `uv sync --extra tts-elevenlabs`.
    "edge-tts>=6.0",
    "gtts>=2.0",
    "python-slugify[unidecode]>=8.0",  # Override GPL text-unidecode with MIT unidecode
    "argon2-cffi>=23.1",  # PR #561 — password hashing for users table (auth path)
    "praw>=7.7",  # 2026-08-13 (task #113): Reddit OAuth client for reddit_oauth_client.py — 600 rpm quota vs anonymous RSS ~1-2 rpm from datacenter IP. Activation gated on GENLAB_REDDIT_OAUTH_ENABLED + REDDIT_CLIENT_ID/SECRET/USER_AGENT env vars; without them the module returns None on every call and existing RSS path stays authoritative.
]

[project.optional-dependencies]
tts = ["elevenlabs>=1.0", "openai>=1.0", "edge-tts>=6.0", "gtts>=2.0"]
tts-elevenlabs = ["elevenlabs>=1.0"]
tts-openai = ["openai>=1.0"]
tts-edge = ["edge-tts>=6.0"]
tts-gtts = ["gtts>=2.0"]
http = ["httpx>=0.27"]
publishing = ["httpx>=0.27"]
engagement = [
    # 2026-07-06 bump to 2.2.0: fixes upstream issue #850 "messages could get
    # stuck in Worker's in-memory prefetch queue for indefinite amount of
    # time" — surfaces as `IndexError: pop from empty list` in
    # `brokers/redis.py:342` at ~108 fires/24h on our prod. See task #537.
    "dramatiq[redis]>=2.2.0",
    "redis>=5.0",
    "detoxify>=0.5.1",
    # 2026-06-29: declare torch as a DIRECT dep so the workspace-root
    # `[tool.uv.sources]` torch->pytorch-cpu override actually applies.
    # detoxify pulls torch transitively; without a direct declaration uv
    # resolved torch via the default index and pulled +cu12 (~8 GB of NVIDIA
    # CUDA wheels). Both prod and CI run on CPU-only Xeon — the CPU wheel
    # is functionally identical for our use case (detoxify inference on
    # short comment strings) and ~200 MB instead of ~8 GB.
    "torch>=2.0.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    # Explicit pin (U-24 resolved 2026-06-19): starlette 1.x is API-compatible
    # with FastAPI 0.115+. The test-isolation prerequisite was fixed in
    # PR #349 (string-skipif + autouse pop). FastAPI's constraint is just
    # ``starlette>=0.46``; we pin to ``>=1.0,<2`` to take the 1.x major
    # release explicitly.
    "starlette>=1.0,<2",
]
bandit = ["numpy>=1.26"]
learning = ["numpy>=1.26", "xgboost>=2.0", "scipy>=1.11"]
scoring = ["scikit-learn>=1.4"]
smart-crop = ["opencv-python-headless>=4.8"]
whisper = ["faster-whisper>=1.0"]
cost = ["litellm>=1.0"]
dev = ["import-linter>=2.0", "hypothesis>=6.100.0", "litellm>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/genlab_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end pipeline smoke tests (run with: pytest -m integration)",
]
addopts = "-m 'not integration' -p no:faulthandler"

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    # 2026-06-18: belt-and-suspenders with the CI ``timeout-minutes:
    # 15`` job cap. ``pytest-timeout`` gives per-test SIGTERM after
    # 120s (set via ``--timeout=120`` in CI invocations) so a single
    # deadlocked test fails fast with a clean traceback instead of
    # GitHub Actions SIGKILL-ing the whole job and producing only
    # "Job cancelled — exceeded the timeout".
    "pytest-timeout>=2.3",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
