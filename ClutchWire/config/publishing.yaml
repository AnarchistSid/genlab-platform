# ClutchWire publishing configuration — all 6 platforms

niche_id: sports

platforms:
  instagram:
    enabled: true
    account_id: ""  # Set via CLUTCHWIRE_META_IG_USER_ID env var
    schedule_slots:
      - "12:00"
    content_types: [reels, carousels, stories]
    aspect_ratios:
      reels: "9:16"
      carousels: "1:1"
      stories: "9:16"
  youtube:
    enabled: true
    channel_id: "UC9QhmCY9PnWW5i4H8LgtJUg"
    content_types: [shorts]
    aspect_ratio: "9:16"
    title_format: question
    max_title_length: 40
  x:
    # Disabled 2026-06-05: no creds → 100% SKIPPED across all niches; data
    # shows X engagement is negligible (avg 12, max 57) regardless. Re-enable
    # once an X developer app is provisioned and OAuth credentials are set.
    enabled: false
    account_id: null  # TODO: Create X developer app for ClutchWire
    content_types: [video_tweet, image_tweet]
    aspect_ratio: "9:16"
    link_placement: first_reply   # CRITICAL: no links in main tweet
  facebook:
    enabled: true
    page_id: "931856753354344"
    content_types: [reels, video_posts]
    aspect_ratio: "9:16"
  tiktok:
    enabled: false
    account_id: null
    content_types: [video]
    aspect_ratio: "9:16"
    note: >-
      Pending TikTok developer app approval.
      Set enabled: true and add TIKTOK_ACCESS_TOKEN to .env when approved.
  threads:
    # Disabled 2026-06-05: Threads container creation has failed 100% on every
    # publish attempt since 5-28 (tokens expired/invalid, no auto-refresh).
    # Historical engagement was modest (sports avg 72 max 345; other niches
    # single-digit). Re-enable per-niche after Threads tokens are regenerated
    # via Meta Developer Console Token Generator.
    enabled: false
    account_id: null  # TODO: Generate Threads token for @theclutchwire
    content_types: [video_post, text_post]
    aspect_ratio: "1:1"
