- id: A-0054
  phase: 5
  host: vps
  title: "POSITIVE-DESIGN — genlab_app role has GRANTs on all 45 tables; A-0032 fix reduces to DATABASE_URL username swap + reconnect"
  category: correctness
  severity: S3
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT COUNT(DISTINCT table_name) FROM information_schema.table_privileges WHERE grantee = ''\''''genlab_app''\''''"'''
      host: vps
      output: |
        45
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT table_name, string_agg(privilege_type, ''\'''',''\'''') FROM information_schema.table_privileges WHERE grantee = ''\''''genlab_app''\'''' GROUP BY table_name LIMIT 5"'''
      host: vps
      output: |
        ab_tests|INSERT,UPDATE,DELETE,SELECT
        affiliate_clicks|INSERT,UPDATE,DELETE,SELECT
        affiliate_revenue|INSERT,UPDATE,DELETE,SELECT
        analytics|INSERT,UPDATE,DELETE,SELECT
        assets|INSERT,UPDATE,DELETE,SELECT
  claim: >
    genlab_app role has full CRUD (INSERT/UPDATE/DELETE/SELECT) grants on all 45 tables
    in the public schema. Combined with Phase 3 A-0032 (genlab_app has rolsuper=f,
    rolbypassrls=f, rolcanlogin=t), the RLS bypass fix reduces to changing the DATABASE_URL
    username from `genlab` to `genlab_app` and reconnecting consumers.
  blast_radius: >
    None if grants are complete (verified: 45 tables covered, all with the 4 CRUD ops).
    One risk: sequences (`SERIAL`/`nextval()`) and views may need separate GRANTs — Phase 9
    fix script should include `GRANT USAGE ON ALL SEQUENCES IN SCHEMA public TO genlab_app`
    and `GRANT SELECT ON ALL VIEWS ...` for completeness. Fix delivered as sketch to
    Phase 9 (see PHASE_5_security.md §5).
  effort: S
  proposed_action: fix
  supersedes: []

