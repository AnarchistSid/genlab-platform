[project]
name = "criticalrush"
version = "0.1.0"
description = "Unified niche content runner — gaming pipeline"
requires-python = ">=3.12"
dependencies = [
    "genlab-core[engagement]>=0.1.0",
    "xgboost>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32.0",
    "yt-dlp>=2025.3",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "tenacity>=8.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "Pillow>=12.1.1",
    "librosa>=0.10",
]

[project.optional-dependencies]
media = [
    "google-api-python-client>=2.100",
    "imagehash>=4.3",
    "faster-whisper>=1.0",
]

[tool.uv.sources]
genlab-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["niches", "core", "tools"]
