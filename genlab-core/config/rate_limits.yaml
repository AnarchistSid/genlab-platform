# Per-domain rate limits (seconds between requests)
# Overrides built-in defaults in execution/utils/rate_limiter.py

version: "1.0"

# Default delay for domains not listed below
default_delay_seconds: 1.0

# Domain-specific minimum delays (seconds between requests)
# Increase values for domains that return 429 errors
domain_delays:
  # VentureBeat is aggressive with 429s — need longer delays
  venturebeat.com: 3.0
  www.venturebeat.com: 3.0

  # Major tech news — moderate rate limiting
  techcrunch.com: 1.5
  www.techcrunch.com: 1.5
  arstechnica.com: 1.5
  www.arstechnica.com: 1.5
  theverge.com: 1.5
  www.theverge.com: 1.5
  wired.com: 1.5
  www.wired.com: 1.5

  # AI-specific sources — slightly more cautious
  marktechpost.com: 2.0
  www.marktechpost.com: 2.0
  the-decoder.com: 2.0

  # Reddit (UGC search + RSS feeds)
  www.reddit.com: 2.0
  reddit.com: 2.0
  i.redd.it: 1.0
  preview.redd.it: 1.0

  # Community / light rate limiting
  news.ycombinator.com: 1.0
  blog.google: 1.0
