# BlackboxBrief (ai_creators) publishing config.
#
# BlackboxBrief uses individual per-platform yamls (instagram_specs.yaml,
# media.yaml, etc.) rather than the consolidated platforms.* block the
# other 4 niches use. This file exists only to provide the
# `auto_publish` block that `genlab_core.scheduling.auto_approver.
# load_policy("ai_creators")` walks to find — without it, the function
# returns a disabled-default policy regardless of operator intent.
#
# AUTO #2 step S7 (2026-06-15) per the rollout runbook: the previous
# Round-3 audit found this file missing → flipping enforcement for
# ai_creators would no-op silently because load_policy couldn't find a
# place to read enabled=true. Creating the file now (with enabled:
# false matching current behavior) gives the operator a single concrete
# yaml line to edit when calibration data justifies the flip.
#
# To enable auto-approval for ai_creators (the AUTO #2 Day-8 flip step
# per the rollout runbook):
#
#   auto_publish:
#     enabled: true
#     min_confidence: 0.85
#     max_approvals_per_pass: 3
#     # W4.3 graduated rollout (default: 1.0 = full traffic). Strongly
#     # recommended to RAMP, not jump to 1.0 on first flip:
#     #   Week 1: rollout_pct: 0.1   → ~10% of qualifiers auto-approved
#     #   Week 2: rollout_pct: 0.25  → if Week-1 confusion-matrix holds
#     #   Week 3: rollout_pct: 0.50
#     #   Week 4: rollout_pct: 1.0   → full traffic
#     # rollout_pct: 0.1
#
# Do NOT flip without:
#   1. calibration_logger data showing ≥30 samples × ≥90% agreement
#      for ai_creators (read via /api/v1/auto-approval/calibration-stats)
#   2. operator-runbook § 6 pre-flight checks
#   3. PR-based change (NOT a hand-edit on prod) per the 2026-06-14
#      deploy-pipeline-gap lesson
#
# Soft kill knobs (in order of severity, all reversible via PR):
#   - rollout_pct: 0.0  → blocks all approvals for this niche only
#   - enabled: false    → disables auto-approve for this niche (worker
#                         still runs, calibration still logs)
#   - global kill switch (file at /opt/genlab/.runtime/auto_approve_kill_switch)
#                       → disables for ALL niches; operator panic button

auto_publish:
  # 2026-06-22 DRAFT PR — ready-to-flip state for ai_creators AUTO #2
  # enforcement. This PR is held in GitHub Draft state until the
  # calibration data justifies the flip (per the prerequisites
  # documented above). The Draft state is the safety knob: merging
  # the PR does the flip, so the PR cannot be merged accidentally.
  #
  # Prerequisites to mark Ready-for-Review (NOT to merge):
  #   1. /api/v1/auto-approval/calibration-stats?niche_id=ai_creators
  #      returns sample_count ≥ 25 (best: ≥30) AND agreement_rate ≥ 0.90
  #   2. gate_tuner has run at least once since 2026-06-22
  #      (/opt/genlab/.tmp/gate_overrides.json modified-time after deploy)
  #   3. Operator has reviewed last 5 ai_creators blueprints and the
  #      gate's verdict matched theirs on all 5 (sanity spot-check)
  #
  # The ramp ladder (rollout_pct values per week):
  #   Week 1 (this PR): 0.1   → ~10% of qualifying blueprints auto-approve
  #   Week 2 PR:        0.25  → 25% if confusion matrix still holds
  #   Week 3 PR:        0.5   → 50%
  #   Week 4 PR:        1.0   → full traffic
  # NEVER skip steps in this ladder. Each week's PR validates the prior.
  #
  # Kill switches if auto-approvals turn bad after merge:
  #   - rollout_pct: 0.0  → blocks all for this niche (revert PR)
  #   - enabled: false    → soft disable (revert PR)
  #   - GENLAB_AUTO_APPROVE_DISABLED=1 in /opt/genlab/.env → global kill
  #   - touch /opt/genlab/.runtime/auto_approve_kill_switch → file flag
  #
  # 2026-07-17 (afternoon): RE-ENABLED after brief 20-min swap-and-revert.
  # An earlier same-session attempt moved enforcement to gaming based on
  # a FLAWED analysis: the "calibration agreement" query used
  # `operator_action = 'approve'` (present tense) but the actual DB
  # value is `'approved'` (past tense) — comparison always FALSE, so
  # the "agreement %" was really just the gate's rejection rate per
  # niche.
  #
  # Correct confusion-matrix agreement (session-2026-07-17 recount):
  #   ai_creators: 92.1% (35 TP + 0 TN + 0 FP + 3 FN of 38)
  #   movies:      76.8%
  #   anime:       62.7%
  #   sports:      58.3%
  #   gaming:      53.4% (only 4 TP + 58 TN + 7 FP + 47 FN of 116;
  #                       gate over-rejects — operator would approve
  #                       47 blueprints the gate blocked)
  #
  # ai_creators is the best-aligned niche. Gate approves 92% of
  # ai_creators samples; operator approves 100% → high alignment,
  # near-zero false-positive risk. Enforcement re-anchored here.
  enabled: true
  min_confidence: 0.80
  max_approvals_per_pass: 3
  rollout_pct: 0.1
