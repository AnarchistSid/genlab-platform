# ANIME-PEAK-09 §1 — music registers for the edit lane.
#
# The register is chosen per fight and decides the prompt. Every prompt names
# the STRUCTURE explicitly (filtered intro -> hard drop), because the drop is
# what the edit is anchored on: without one the candidate is rejected, and a
# generator asked only for a genre returns a loop with no arc. The v2 beds
# were asked for "epic orchestral anime battle bed" and returned exactly that
# -- no build, no drop, and a sub share of 14-17% against a 25% bar.
version: 1

defaults:
  duration_s: 30
  candidates: 3
  # The packet's 6-10 s drop window assumes a reel whose impact lands 6-10 s
  # in. PEAK-08's character-scored windows put the impacts at 9.2-18.2 s, so
  # the drop is instead aimed at each reel's OWN wind-up and the residual is
  # absorbed by align_bed. This is the widest residual worth absorbing: past
  # it the bed either starts mid-build or leaves a long silent opening.
  max_align_residual_s: 5.0

registers:
  brazilian_phonk:
    tempo: 148
    prompt: >-
      Brazilian phonk montagem, {tempo} BPM, EXTREMELY heavy distorted 808 sub
      bass dominating the mix, deep low-end, minimal treble, cavalgada triplet
      cowbell pattern, low-pass-filtered {intro}-second intro building into a
      hard drop, aggressive, club-ready, no vocals
  old_phonk:
    tempo: 140
    prompt: >-
      old school Memphis phonk, {tempo} BPM, ENORMOUS distorted 808 sub bass
      dominating the mix, deep low-end, muffled and dark, minimal treble,
      detuned cowbell, low-pass-filtered {intro}-second intro opening into a
      hard drop, menacing, no vocals
  phonk_slowed:
    tempo: 132
    prompt: >-
      slowed phonk, {tempo} BPM, enormous deep 808 sub bass, sparse reverbed
      cowbell, dark and muffled, melancholic detuned melody, low-pass-filtered
      {intro}-second intro opening into a heavy drop, no vocals
  epic_hybrid:
    tempo: 150
    prompt: >-
      epic orchestral phonk hybrid, {tempo} BPM, ENORMOUS distorted 808 sub
      bass dominating the low end under taiko and brass, deep and muffled,
      triplet cowbell, low-pass-filtered {intro}-second build into a hard
      orchestral drop, cinematic and aggressive, no vocals

fights:
  zoro_vs_king: brazilian_phonk
  luffy_vs_kaido: brazilian_phonk
  deku_vs_overhaul: old_phonk
  tanjiro_vs_akaza: epic_hybrid
