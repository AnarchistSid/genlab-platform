# ClutchWire scoring weights
# Sports content scores on recency, community signals, magnitude, and novelty

clip_scoring:
  weights:
    recency: 0.35
    community_signal: 0.30
    magnitude: 0.25
    novelty: 0.10

  recency:
    half_life_hours: 2.0

  magnitude_multipliers:
    championship_game: 3.0
    playoff_game: 2.0
    rivalry_game: 1.8
    regular_season: 1.0
    preseason: 0.4

  live_event_bonus: 1.5

  upset_multiplier: 1.4
  record_multiplier: 1.3

dedup:
  jaccard_threshold: 0.75
  tfidf_threshold: 0.70

thresholds:
  # Tightened 2026-06-08 per content-mix rebalance: sports was producing
  # 5-26 blueprints/day vs 1-4 for every other niche. With a 1-reel/day
  # publish cap that was 80-95% funnel waste — blueprints stuck in
  # DRAFTED forever, repeatedly re-scored each pipeline run.
  #
  # New target: 3-5 blueprints/day in line with anime/movies. The bandit
  # still has 3-5 candidates to pick from, leaving room for exploration.
  # Old values commented out for one cycle in case we need to roll back:
  #     min_clip_score: 0.20        # → 0.30
  #     min_compilation_score: 0.35 # → 0.45 (proportional bump)
  #     top_clips_per_run: 20       # → 5 (the dominant cap)
  min_clip_score: 0.30
  min_compilation_score: 0.45
  top_clips_per_run: 5
