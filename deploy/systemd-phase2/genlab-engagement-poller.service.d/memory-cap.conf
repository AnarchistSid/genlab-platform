# 2026-07-17: hard memory cap for OOM safety on 4 GB Hetzner VPS.
#
# Observed steady-state RSS: ~59 MB (async pollers for YouTube +
# Twitter + Threads; requests + feedparser deps). Peak on burst
# comment volume estimated ~120 MB. Cap at 256 MB gives 2× headroom
# over peak + 4× over steady state.
#
# See genlab-dashboard.service.d/memory-cap.conf for full rationale.

[Service]
MemoryMax=256M
