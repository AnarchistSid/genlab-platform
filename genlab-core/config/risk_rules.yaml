# Risk Classification Rules (Phase 2)

version: "1.0"

# Automatic risk triggers
high_risk_keywords:
  - "medical advice"
  - "legal advice"
  - "financial advice"
  - "investment"
  - "health claim"
  - "cure"
  - "guaranteed"
  - "deepfake"
  - "synthetic media"
  - "election"
  - "disinformation"
  - "terrorism"
  - "bioweapon"
  - "weapon"
  - "violence"

critical_risk_keywords:
  - "child"
  - "minor"
  - "suicide"
  - "self-harm"

# Claim type risk levels
claim_risk_defaults:
  fact: "low"
  estimate: "medium"
  prediction: "medium"
  opinion: "low"
  rumor: "high"

# Mitigation templates
mitigations:
  rumor: "Reports suggest [claim], though this remains unconfirmed."
  prediction: "Experts predict [claim], though outcomes may vary."
  estimate: "Estimated at [claim], based on available data."

# QC gate thresholds
allow_high_risk: false
allow_critical_risk: false
require_mitigation: true
