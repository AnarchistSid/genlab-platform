    style_suffix: "High-contrast cinematic style, deep saturated colors, dramatic shadows, entertainment industry aesthetic. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

  safety:
