name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x" # U-18: pin uv consistently across workflows
      - run: uv sync --frozen
      # ruff isn't declared as a workspace dependency, so `uv run ruff`
      # resolves nothing. `uvx` runs the tool in an ephemeral environment
      # without polluting any package's deps — the right pattern for
      # repo-level lint tooling. Pinned version so CI matches local
      # results bit-for-bit; bump deliberately when ready to absorb new
      # rule additions.
      - run: uvx ruff@0.15.14 check .
      - run: uvx ruff@0.15.14 format --check .
      # R-69: enforce the import-layer contract in CI (.importlinter). It needs
      # genlab_core importable, so run it in the package env with import-linter
      # added ad-hoc (not a runtime dep). Catches upward cross-layer imports.
      - run: uv run --package genlab-core --with import-linter lint-imports --config genlab-core/.importlinter

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: genlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x" # U-18: pin uv consistently across workflows
      # U-18: pin Python 3.13 to match test.yml. Without this the runner default
      # (not 3.13) flipped conftest's _SKIP_DETOXIFY guard, so Detoxify-heavy
      # tests behaved differently here than in test.yml — config drift.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # smart_crop integration tests probe fixtures with ffprobe; without
      # FFmpeg they skip (guarded), but install it so they actually run —
      # this is the only job that exercises that coverage (test.yml's
      # test-core deselects integration tests via -k).
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      # Cache + pre-warm the HuggingFace hub so the Detoxify toxicity gate's
      # bert-base-uncased download doesn't hit huggingface.co per run. Without
      # this, ``transformers.from_pretrained`` does a HEAD-with-etag-check on
      # every model load — huggingface.co rate-limits the shared GHA runner
      # IPs and 429s hit 3 times in the session-#2 merge sweep. The
      # ``HF_HUB_OFFLINE=1`` env on the pytest step makes the cached model
      # load skip the network entirely (no etag HEAD).
      - name: Cache HuggingFace hub (Detoxify model weights)
        id: hf-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-cache-v1-${{ runner.os }}-detoxify-original
      - name: Pre-warm HF cache on miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          uv run --package genlab-core python -c "
          from detoxify import Detoxify
          Detoxify('original')  # downloads bert-base-uncased + detoxify weights
          "
      - run: uv run --package genlab-core pytest genlab-core/tests/ -x -q --ignore=genlab-core/tests/storage/ --ignore=genlab-core/tests/integration/
        env:
          GENLAB_USE_POSTGRES: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  # R-48/R-64: the primary store (PostgreSQL via Alembic) had ZERO CI coverage —
  # the `test` job runs with GENLAB_USE_POSTGRES=false and --ignore=tests/storage,
  # and the storage tests skip unless POSTGRES_PASSWORD is set. So a broken
  # migration or a postgres.py regression would only surface on the live DB.
  # This job applies the full Alembic chain to a fresh DB (catching migration
  # errors before they reach prod) and then exercises postgres.py against the
  # migrated schema. It is the safety net that makes future schema migrations
  # CI-validatable.
  test-storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (superset of postgres:16) so the migration chain's
        # product_embeddings table (a `vector(1536)` column + ivfflat index) is
        # actually created and validated here, not skipped.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: genlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen
      # Validate the migration chain applies cleanly to an empty DB.
      - run: uv run --package genlab-core alembic -c genlab-core/alembic.ini upgrade head
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
      # Create a non-superuser app role so the RLS isolation tests are
      # meaningful — Postgres superusers (the docker image's POSTGRES_USER) and
      # table owners-without-FORCE bypass row-level security. The app connects
      # as a non-superuser in prod, so the tests must too.
      - name: Create non-superuser app role
        run: |
          uv run --package genlab-core python - <<'PY'
          import os, psycopg
          su = os.environ["POSTGRES_PASSWORD"]
          with psycopg.connect(f"postgresql://genlab:{su}@localhost:5432/genlab", autocommit=True) as conn:
              cur = conn.cursor()
              cur.execute("DROP ROLE IF EXISTS genlab_app")
              cur.execute("CREATE ROLE genlab_app LOGIN PASSWORD 'app_test_password'")
              cur.execute("GRANT USAGE ON SCHEMA public TO genlab_app")
              cur.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO genlab_app")
              cur.execute("GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO genlab_app")
          PY
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
      # Exercise postgres.py CRUD + RLS against the migrated schema, AS the
      # non-superuser role (so RLS actually filters).
      - run: uv run --package genlab-core pytest genlab-core/tests/storage/ -q
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          GENLAB_TEST_PG_USER: genlab_app
          GENLAB_TEST_PG_PASSWORD: app_test_password
          GENLAB_USE_POSTGRES: "true"
          DATABASE_URL: postgresql://genlab_app:app_test_password@localhost:5432/genlab

  # R-04: surface the 40 integration smoke tests that were silently
  # deselected by ``addopts = "-m 'not integration'"`` in
  # ``genlab-core/pyproject.toml``. The suite is hermetic — fixtures live
  # under ``tests/integration/fixtures/`` (mock_anthropic_response.json,
  # mock_youtube_trending.json, etc), no real network. 38/40 pass on main
  # today; the 2 known failures depend on PR #128 (R-19) landing first
  # (it adds ``virality_score`` to blueprints — the missing field these
  # tests assert on). Deselected here with a clear pointer; remove the
  # deselects in a follow-up the moment #128 merges.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen
      # ``uv run --package genlab-core`` changes CWD to ``genlab-core/`` —
      # pytest test IDs must be relative to that, not the workspace root.
      - run: |
          uv run --package genlab-core pytest \
            -m integration \
            --deselect 'tests/integration/test_pipeline_smoke.py::TestSharedStagesWithMockData::test_qc_gates_validates_blueprints' \
            --deselect 'tests/integration/test_pipeline_smoke.py::TestSharedStagesWithMockData::test_virality_scoring_scores_blueprints' \
            genlab-core/tests/integration/ \
            --tb=short -q
        env:
          GENLAB_USE_POSTGRES: "false"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
