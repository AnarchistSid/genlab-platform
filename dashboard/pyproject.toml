[project]
name = "genlab-dashboard"
version = "0.1.0"
description = "Gen Lab Operations Dashboard — shared review server + React frontend"
requires-python = ">=3.12"
dependencies = [
    "genlab-core",
    "flask>=3.0",
    "flask-socketio>=5.3",
    "python-dotenv>=1.0",
    "gunicorn>=22.0,<26",  # U-07: gunicorn 26 removes the eventlet worker the review server uses
    "eventlet>=0.36",
    "apscheduler>=3.10,<4",
]

[tool.uv.sources]
genlab-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
