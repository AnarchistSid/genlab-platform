- id: A-0032
  phase: 3
  host: vps
  title: "genlab DB role has rolsuper=t AND rolbypassrls=t — 24 RLS policies silently no-op; empirical cross-niche read returned all 5 niches"
  category: security
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT current_user, rolsuper, rolbypassrls FROM pg_roles WHERE rolname = current_user"'''
      host: vps
      output: |
        genlab|t|t
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT rolname, rolsuper, rolbypassrls, rolcanlogin FROM pg_roles WHERE rolcanlogin"'''
      host: vps
      output: |
        genlab|t|t|t
        genlab_app|f|f|t
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT niche_id, COUNT(*) FROM blueprints GROUP BY niche_id ORDER BY niche_id"'''
      host: vps
      output: |
        ai_creators|352
        anime|373
        gaming|249
        movies|339
        sports|856
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM pg_policies WHERE schemaname = ''\''''public''\''''"'''
      host: vps
      output: |
        24
  claim: >
    The app-facing DB role `genlab` has rolsuper=t AND rolbypassrls=t. All 24 RLS
    policies (verified list includes niche_isolation on blueprints, analytics,
    publishing_analytics, stories, plus 20 more) are silently no-op when queried as
    genlab. Empirical proof: a `SELECT niche_id, COUNT(*) FROM blueprints GROUP BY
    niche_id` executed as genlab returned rows from all 5 niches (ai_creators, anime,
    gaming, movies, sports) with no `SET LOCAL app.niche_id` set in session.
    A separate `genlab_app` role exists with the correct attributes (rolsuper=f,
    rolbypassrls=f, rolcanlogin=t) — the fix has been created but the application
    still connects as `genlab`. The 2026-07-24 rule #27 fix (belt-and-suspenders
    `AND niche_id = %s` in WHERE clauses) is a mitigation at the code sites that
    apply it; the role attribute makes every non-mitigated query a full-tenant leak.
  blast_radius: >
    This is the SaaS conversion blocker. Every DB query the application currently
    makes returns data across all tenants; the "tenant isolation" concept exists in
    the DB schema (24 policies) but does not fire. For the current single-operator
    5-channel deploy this is not a data-loss event — the operator owns all niches.
    For any external tenant onboarding it is an immediate P0 leak. Fix path: (a) rotate
    application connection to `genlab_app` role, (b) GRANT the necessary tables to
    that role, (c) verify the SET LOCAL app.niche_id per-request pattern still works,
    (d) run the cross-niche query as `genlab_app` — should return 0 rows without SET
    LOCAL. Blast if wrong: application errors on missing GRANTs post-role-switch, which
    is a boot-time failure not a silent one. Coordinate with A-0011 disposition (nested
    .git repo Phase 9) so both hits at role/permission plumbing land together.
  effort: L
  proposed_action: fix
  supersedes: []

