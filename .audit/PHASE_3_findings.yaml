- id: A-0035
  phase: 3
  host: vps
  title: "pg_stat_statements extension not installed — cannot measure query cost; blocks Phase 3 §4"
  category: ops
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT calls, total_exec_time FROM pg_stat_statements LIMIT 1"'''
      host: vps
      output: |
        ERROR:  relation "pg_stat_statements" does not exist
  claim: >
    pg_stat_statements is the standard Postgres extension for capturing query
    cost / call counts / total_exec_time. It is not installed on this DB (or its
    view is not present in the current search_path). Cannot compute top-N by
    total_exec_time or top-N by calls this phase.
  blast_radius: >
    Every query performance question ("which query dominates? are there N+1s?")
    is unanswerable until the extension is loaded. Extension install is
    `CREATE EXTENSION pg_stat_statements` + `shared_preload_libraries` line in
    postgresql.conf + restart. Restart is a mutation — read-only scope; recommend
    Phase 4 executes it in a scheduled window. Cost: one restart, ~1-5s downtime.
    Ongoing collection overhead is negligible (~1% CPU).
  effort: S
  proposed_action: fix
  supersedes: []

- id: A-0036
  phase: 3
  host: vps
  title: "71 of 152 indexes have idx_scan=0 (46%). Mixed real waste + stat-reset artifacts"
  category: waste
  severity: S2
  confidence: medium
  tags: [STATIC_ONLY]
  evidence:
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FILTER (WHERE idx_scan = 0), COUNT(*) FROM pg_stat_user_indexes"'''
      host: vps
      output: |
        71|152
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT relname, indexrelname, pg_size_pretty(pg_relation_size(indexrelid)) FROM pg_stat_user_indexes WHERE idx_scan = 0 ORDER BY pg_relation_size(indexrelid) DESC LIMIT 8"'''
      host: vps
      output: |
        content_pool|idx_cp_status|592 kB
        product_embeddings|idx_product_emb|504 kB
        ensemble_votes|idx_ensemble_votes_component_time|200 kB
        pending_engagement|idx_pe_post_id|168 kB
        publishing_analytics|uq_publishing_analytics_bp_platform|144 kB
        assets|assets_asset_id_key|144 kB
        dashboard_events|dashboard_events_pkey|128 kB
        episodic_events|episodic_events_pkey|120 kB
  claim: >
    46% of indexes report zero scans. Genuine waste candidates include
    product_embeddings.idx_product_emb (504 kB on a 0-row table — see A-0038).
    STATIC_ONLY per §0.3 because primary keys (assets_pkey, dashboard_events_pkey,
    episodic_events_pkey, compliance_events_pkey) also show idx_scan=0 — PKs are
    constraint-required and always used implicitly for unique enforcement, so their
    zero-scan is likely a pg_stat_reset artifact or metric-reset event, not a real
    "unused" signal.
  blast_radius: >
    Do not mass-drop. Each candidate needs (a) runtime evidence over a longer window
    than the current stats snapshot (recommend enabling pg_stat_statements first —
    A-0035), (b) code-grep for the index by name confirming no advisor-hint or
    query-planner directive references it, (c) careful category split
    (PK/UNIQUE/FK-supporting vs standalone secondary). Storage saving is small (largest
    is 592 kB); write-amplification saving is the real prize on hot tables like
    content_pool and blueprints.
  effort: M
  proposed_action: investigate
  supersedes: []

