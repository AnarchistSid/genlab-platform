[project]
name = "framedrift"
version = "0.1.0"
description = "FrameDrift — Anime content automation agent for Gen Lab"
requires-python = ">=3.12"
dependencies = [
    "genlab-core",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
]

# U-10 (2026-06-18): ``pytrends`` upstream archived 2023-04-13. Moved
# from required deps to optional extras. The pipeline's Google Trends
# enrichment paths now graceful-skip when pytrends isn't installed
# (see fd_strategies/fetch_anime_news._fetch_google_trends + the
# stub_mode flag in config/sources.yaml). Operators who want the
# real-fetch path can ``uv pip install framedrift[trends]``.
#
# trendspyg (active fork, different API) is the eventual replacement;
# a future PR will add a TrendspygBackend behind the same internal
# interface and swap defaults.
[project.optional-dependencies]
trends = ["pytrends>=4.9"]

[tool.uv.sources]
genlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fd_strategies", "hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
