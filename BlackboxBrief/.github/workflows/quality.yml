name: Quality

on:
  push:
    paths:
      - "execution/**"
      - "tests/**"
      - "runbooks/**"
      - "config/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "execution/**"
      - "tests/**"
      - "runbooks/**"
      - "config/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/quality.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt
          pip install ruff==0.9.7
          pip check

      - name: Lint (runtime + tests)
        run: ruff check execution tests

      - name: Validate runbook shell syntax
        run: |
          for f in runbooks/*.sh; do
            bash -n "$f"
          done

      - name: Run tests
        run: pytest -q --tb=short --maxfail=3
