# ClutchWire publishing configuration — all 6 platforms

niche_id: sports

platforms:
  instagram:
    enabled: true
    account_id: ""  # Set via CLUTCHWIRE_META_IG_USER_ID env var
    schedule_slots:
      - "12:00"
    content_types: [reels, carousels, stories]
    aspect_ratios:
      reels: "9:16"
      carousels: "1:1"
      stories: "9:16"
  youtube:
    enabled: true
    channel_id: "UC9QhmCY9PnWW5i4H8LgtJUg"
    content_types: [shorts]
    aspect_ratio: "9:16"
    title_format: question
    max_title_length: 40
  x:
    # Disabled 2026-06-05: no creds → 100% SKIPPED across all niches; data
    # shows X engagement is negligible (avg 12, max 57) regardless. Re-enable
    # once an X developer app is provisioned and OAuth credentials are set.
    enabled: false
    account_id: null  # TODO: Create X developer app for ClutchWire
    content_types: [video_tweet, image_tweet]
    aspect_ratio: "9:16"
    link_placement: first_reply   # CRITICAL: no links in main tweet
  facebook:
    enabled: true
    page_id: "931856753354344"
    content_types: [reels, video_posts]
    aspect_ratio: "9:16"
  tiktok:
    enabled: false
    account_id: null
    content_types: [video]
    aspect_ratio: "9:16"
    note: >-
      Pending TikTok developer app approval.
      Set enabled: true and add TIKTOK_ACCESS_TOKEN to .env when approved.
  threads:
    # Re-enabled 2026-07-14: token cache at /opt/genlab/.threads_tokens.json
    # holds fresh sports token (exp 2026-08-15) and per-niche health check
    # confirms `threads/sports` healthy against id=34601794239468255. Sports
    # was the only niche with meaningful pre-disable engagement (avg 72,
    # max 345 vs single-digit for gaming/movies/anime) so it's the one
    # worth the try. Other 3 niches stay disabled — tokens work, but the
    # engagement history doesn't justify the daily cap slot.
    enabled: true
    account_id: null  # Resolved at runtime via resolve_threads_credentials
    content_types: [video_post, text_post]
    aspect_ratio: "1:1"


# ─────────────────────────────────────────────────────────────────────
# auto_publish — AUTO #2 enforcement scaffolding (2026-06-28)
# ─────────────────────────────────────────────────────────────────────
#
# Per the AUTO #2 rollout runbook (docs/runbooks/AUTO_2_ROLLOUT_2026-06-15.md)
# every niche needs this block before the enforcement worker can read
# its policy. Currently disabled (enabled: false + rollout_pct: 0.0)
# — the file exists so a single PR can flip THIS niche on without
# scrambling for the file shape when calibration data justifies it.
#
# DO NOT FLIP without (per runbook §9 readiness checklist):
#   1. ≥30 calibration samples × ≥90% agreement for THIS niche
#      (read /api/v1/auto-approval/calibration-stats?niche_id=<this>)
#   2. Operator-runbook pre-flight checks
#   3. PR-based change (NOT a hand-edit on prod) per 2026-06-14
#      deploy-pipeline-gap lesson
#
# Reference: BlackboxBrief/config/publishing.yaml has the full template
# (ai_creators is at rollout_pct: 0.1 in Week-1 ramp as of 2026-06-26).
#
# Kill switches (in order of severity, all reversible via PR):
#   - rollout_pct: 0.0  → blocks all approvals for THIS niche only
#   - enabled: false    → soft disable
#   - GENLAB_AUTO_APPROVE_DISABLED=1 in /opt/genlab/.env → global kill
#   - touch /opt/genlab/.runtime/auto_approve_kill_switch → file flag

auto_publish:
  enabled: false
  min_confidence: 0.85
  max_approvals_per_pass: 3
  rollout_pct: 0.0
