- id: A-0082
  phase: 8
  host: vps
  title: "Git-blind in-place config writers class fix — A-0012+A-0020+A-0023. Schema-in-git + state-out-of-git for auto_ramp_auto2.py + cuelinks_campaigns.yaml regenerator"
  category: consolidation
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: '(synthesis of A-0012 3× rollout_pct uncommitted, A-0020 cuelinks_campaigns regen, A-0023 auto_ramp_auto2.py identified writer)'
      host: vps
      output: |
        Two confirmed instances of components that write git-tracked YAML in place:
        (1) scripts/auto_ramp_auto2.py::write_rollout_pct  (weekly, +10% ramp)
        (2) genlab-cuelinks-campaign-refresh.timer -> regenerates cuelinks_campaigns.yaml weekly
        Both edit files that git tracks; git sees only endpoints, never ladder history.
  claim: >
    Class-of-bug: git-tracked file whose runtime truth is written by a non-git process.
    Two known instances; likely more (any AUTO-GENERATED-in-place regeneration inherits
    the pattern).
  blast_radius: >
    Ops confusion (git diff shows only jumps in ladder), rollback surprise (git checkout
    restores whatever git remembers, not the operator's intended live state), and
    debugging failure (running rollout_pct = 1.0 with no history of how it got there).
    Fix options ranked:
    (a) Split each file: schema/skeleton (in git) + generated state (gitignored). Reads
        merge at boot. Effort M per file, ~2 files = one week.
    (b) Commit-back bot opens a PR on regeneration. Preserves history in git properly.
    (c) Least effort: prominent "actual truth lives on VPS at /opt/genlab/<path>" header
        + operator `gen-status` command. Documents but doesn't solve the debugging problem.
    Recommendation: (a). Blast if wrong: reads must merge correctly — testable at CI time.
  effort: L
  proposed_action: consolidate
  supersedes: []

- id: A-0083
  phase: 8
  host: both
  title: "META-FINDING: line-exists-doesn't-fire (A-0026+A-0062+A-0072) — 3 independent instances = systemic gap in how the system verifies its own guardrails fire"
  category: correctness
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: '(synthesis of 3 confirmed instances)'
      host: both
      output: |
        A-0026: pg_backup.sh:29 `find -mtime +14 -delete` present; 20 files retained > 14 days
        A-0062: backup_visual_assets.sh:121 same predicate; 33-day-old files retained, 421 pruneable
        A-0072: .pre-commit-config.yaml gitleaks v8.24.3 present; 2026-07-22 commit added
                3× PGPASSWORD=genlab_*** anyway (hook not enforced / --no-verify used)
  claim: >
    Three independent "configured but not enforced" instances across two subsystems
    (backup pruning + secret scanning). The pattern isn't unique to a single file or
    author — it's a repeated shape in the codebase's guard mechanism. Each of the three
    would be caught by adding a "test the mechanism itself" pass separate from the
    guard's own operation.
  blast_radius: >
    The security/hygiene posture the codebase appears to establish is illusory anywhere
    the enforcement layer doesn't actually block. Class-fix (one, spanning all three):
    (i) For prunes: `find … -mtime +N | wc -l` sentinel alert that fires when count is
    non-zero after expected prune interval — completely decoupled from the prune script
    itself.
    (ii) For hooks: CI-side `pre-commit run --all-files` that fails PRs if any hook
    would trigger. Doesn't rely on developer's local `pre-commit install`.
    (iii) Forward: every new guard (auto-approver kill switch, disk-quota monitor,
    token expiry) ships with a paired "verify-fired" alert.
    Effort M (each half is one small script + one systemd timer or GH Actions job).
  effort: M
  proposed_action: fix
  supersedes: []

