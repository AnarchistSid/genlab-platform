# 2026-07-17: hard memory cap for OOM safety on 4 GB Hetzner VPS.
#
# Observed steady-state RSS: ~39 MB (disk_quota daemon polling
# .tmp/runs/ for cleanup decisions; single-threaded, no heavy
# dependencies). Cap at 128 MB gives 3.3× headroom.
#
# See genlab-dashboard.service.d/memory-cap.conf for full rationale.

[Service]
MemoryMax=128M
