- id: A-0060
  phase: 5
  host: mac
  title: "Dashboard: 173 routes, HTTP Basic Auth (single-shared-secret) + session cookie; no RBAC or tenant-aware access — matches A-0032 at UI layer"
  category: security
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'grep -rE "^\s*@(app|bp)\.(route|get|post|put|delete)" dashboard/server/ 2>/dev/null | wc -l'
      host: mac
      output: |
        173
    - command: 'grep -n "HTTP Basic Auth\|_AUTH_USER\|login_required\|require_auth" dashboard/server/review_server.py | head -5'
      host: mac
      output: |
        282:# ── Security: HTTP Basic Auth ──────────────────────────────
        290:    logger.info("HTTP Basic Auth enabled (user: %s)", _AUTH_USER)
        528:    """Verify auth via session cookie (preferred) or HTTP Basic Auth (fallback)."""
  claim: >
    173 route definitions in dashboard/server/. Authentication is HTTP Basic Auth with
    a single shared `_AUTH_USER`, with session cookie preferred and Basic Auth as
    fallback (per docstring line 528). No RBAC layer, no per-niche access control. Every
    dashboard user has full cross-niche access via the UI.
  blast_radius: >
    Matches A-0032 (RLS bypass at DB layer) but at the UI layer — even after fixing
    A-0032 (role switch to genlab_app), the dashboard doesn't wrap queries in
    `SET LOCAL app.niche_id`, so it will error on cross-niche queries. For the current
    single-operator deploy this is intended; for SaaS this is a 2-layer tenant-isolation
    gap. Fix path (Phase 9 sequencing): pair A-0032 with per-route niche_id resolution
    (from URL param or session) that sets the DB variable before query.
  effort: L
  proposed_action: investigate
  supersedes: []

