# SpliceReel scoring weights
# Movies have longer cultural moments — 48h decay, lifecycle multipliers, franchise boosts

scoring_dimensions:
  weights:
    timeliness: 0.25
    magnitude: 0.35
    engagement_potential: 0.25
    novelty: 0.15

  timeliness:
    decay_half_life_hours: 48.0

  magnitude:
    rt_score_excellent: 0.90
    rt_score_good: 0.75

film_lifecycle_multipliers:
  pre_release: 1.0
  opening_weekend: 1.6
  long_tail: 0.7
  unknown: 1.0   # Neutral — RSS items without lifecycle data shouldn't be penalized

franchise_multipliers:
  MCU: 1.5
  DC: 1.3
  Star_Wars: 1.4
  Fast_Furious: 1.2
  Disney_Animation: 1.3
  Pixar: 1.3
  Horror_Franchise: 1.2
  default: 1.0

# Per-niche virality_scoring patterns for the pipeline stage
# genlab_core.pipeline.stages.virality_scoring (2026-07-21 fix — see
# ClutchWire/config/scoring_weights.yaml for the class-of-bug context;
# same shape here for movies vocabulary).
virality_scoring:
  patterns:
    # Studios, franchises, characters, streaming services
    pop_culture_reference: "\\b(marvel|mcu|dc|dceu|star wars|disney|pixar|dreamworks|a24|blumhouse|netflix|hbo|amazon|apple tv|hulu|paramount|universal|warner|sony pictures|columbia|lucasfilm|marvel studios|dune|avatar|batman|superman|spider[-\\s]?man|iron man|thor|hulk|deadpool|wolverine|joker|godzilla|kong|barbie|oppenheimer|mission impossible|fast[-\\s]?furious|john wick|james bond|007|jurassic|indiana jones)\\b"
    # Movie-specific terms + moments
    named_tool: "\\b(trailer|teaser|first look|reboot|remake|prequel|sequel|spin[-\\s]?off|origin story|final trailer|red band|behind the scenes|box office|rotten tomatoes|rt|imdb|opening weekend|premiere|streaming|debut|breakout|blockbuster|sleeper hit|festival|sundance|cannes|tiff|oscars|academy award)\\b"

dedup:
  similarity_threshold: 0.70
  time_window_hours: 48

thresholds:
  min_score: 0.40
  top_items_per_run: 5
