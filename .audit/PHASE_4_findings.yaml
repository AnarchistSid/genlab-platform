- id: A-0050
  phase: 4
  host: vps
  title: "Journal rotation destroyed diagnostic evidence for 4 failed services — cannot reconstruct BB outage root cause; recommend retention increase or per-unit stderr logging"
  category: ops
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "journalctl -u genlab-pipeline-ai.service --since ''14 days ago'' --no-pager | wc -l"'
      host: vps
      output: |
        0
    - command: 'ssh genlab-prod "systemctl status genlab-pipeline-ai.service --no-pager -l | grep -E ''Notice|Warning''"'
      host: vps
      output: |
        Notice: journal has been rotated since unit was started, output may be incomplete.
    - command: 'ssh genlab-prod "cat /etc/systemd/journald.conf | grep -E ''SystemMaxUse|MaxRetentionSec''"'
      host: vps
      output: |
        (defaults presumably in effect — file may not override)
  claim: >
    `journalctl -u genlab-pipeline-ai.service --since '14 days ago'` returns 0 lines.
    systemd status prints "journal has been rotated since unit was started, output may be
    incomplete" on all 4 failed units. Root-cause tracebacks for A-0034 (BB outage) and
    A-0001 (strategist) are unavailable. This blocks OPERATOR_ACTIONS row #2's diagnosis.
  blast_radius: >
    Every time a pipeline fails silently under default journal retention, the operator has
    a ticking clock to diagnose before evidence rotates away. On a 4 GB VPS with high log
    churn, rotation happens fast. Two fixes: (a) `SystemMaxUse=` bump in journald.conf +
    daemon-reload; (b) per-unit `StandardError=append:/var/log/genlab/<unit>.log` for
    the ~10 pipeline-critical services (append-only, rotate via logrotate not journald).
    Option (b) is preferred — decouples critical-unit logs from journald pressure.
  effort: M
  proposed_action: fix
  supersedes: []
