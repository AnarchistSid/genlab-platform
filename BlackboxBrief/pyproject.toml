[project]
name = "blackbox-brief"
version = "0.1.0"
description = "Blackbox Brief — AI/Tech news content agent"
requires-python = ">=3.12"
dependencies = [
    "genlab-core>=0.1.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.23",
    "pydantic-settings>=2.0",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "nest-asyncio>=1.6",
    "scipy>=1.14",
    "Pillow>=12.1.1",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
    "flask>=3.1",
    "flask-socketio>=5.3",
    "tweepy>=4.14",
    "google-api-python-client>=2.192.0",
    "google-auth-oauthlib>=1.3.0",
]

[project.optional-dependencies]
server = ["gunicorn>=22.0,<26", "eventlet>=0.36"]  # U-07: gunicorn 26 removes the eventlet worker
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[tool.uv.sources]
genlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["execution", "bb_strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# _legacy/ holds quarantined tests for code that has been refactored
# away (execution.parse_extract, execution.youtube_client, etc.). They
# fail at import time because the modules no longer exist. Kept on
# disk for archaeological reference but excluded from collection.
norecursedirs = ["_legacy"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
ignore = ["E402", "E501"]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["execution"]
