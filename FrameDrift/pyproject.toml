[project]
name = "framedrift"
version = "0.1.0"
description = "FrameDrift — Anime content automation agent for Gen Lab"
requires-python = ">=3.12"
dependencies = [
    "genlab-core",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
    "pytrends>=4.9",
]

[tool.uv.sources]
genlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fd_strategies", "hooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
