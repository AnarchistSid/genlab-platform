    overrides enabled at runtime, 100% rollout of auto-approval on gaming, anime, and
    movies is happening without operator awareness — and per CLAUDE.md rule #22, gaming's
    operator-agreement was 53.4% back in July, well below AUTO #2's 90% gate. Also
