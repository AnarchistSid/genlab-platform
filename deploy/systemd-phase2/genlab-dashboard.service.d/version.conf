# Drop-in: loads deployed-version env vars so the dashboard's Settings
# → System "Dashboard Version" card and /api/v1/health endpoint report
# the actual git SHA + build time instead of the hardcoded "2.0.0"
# / "0.0.0-dev" defaults.
#
# Install: copy to /etc/systemd/system/genlab-dashboard.service.d/version.conf
# then run `systemctl daemon-reload && systemctl restart genlab-dashboard`.
# This is a ONE-TIME install action; the drop-in itself does not change
# between deploys (only the file it loads, /opt/genlab/.version.env,
# changes — written by scripts/deploy.sh on every deploy).
#
# Both EnvironmentFile= lines start with `-` so missing files are
# tolerated. Two paths are listed because:
#   1. /etc/genlab/version.env was the original (PR #592) target.
#      Some legacy installs may have a stale copy there.
#   2. /opt/genlab/.version.env is the new (PR #604) target.
#      The genlab user can write here (where it couldn't write to
#      root-owned /etc/genlab) so deploy.sh's Phase 6.5 always
#      succeeds.
# Systemd applies EnvironmentFile= entries in order, with later
# entries winning on conflict. Listing the new path SECOND ensures
# fresh deploys override stale /etc/genlab copies. After the next
# deploy, operators can `rm /etc/genlab/version.env` cleanly.
[Service]
EnvironmentFile=-/etc/genlab/version.env
EnvironmentFile=-/opt/genlab/.version.env
