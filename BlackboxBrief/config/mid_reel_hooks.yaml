# Mid-Reel Re-Engagement Hooks — short phrases to recapture attention
# mid-way through longer videos (>20s).
#
# Social Media Examiner study: mid-hooks at 10-15s improve average watch
# time by 34% and completion rate from 42% to 61%.
#
# Two routing paths (checked in priority order):
#   1. content_type  → category via content_type_map (explicit, human-friendly)
#   2. template_id   → category via template_category_map (automated pipeline)
#   3. hook_formula   → category via prefix inference (fallback)
#   4. universal      → default category (last resort)
#
# Within each matched set, highest engagement_weight wins (deterministic).
#
# Imported by: execution/render_text_overlays.py

patterns:
  # ═══════════════════════════════════════════════════════════
  # TEASER / SUSPENSE — best for tutorials, demos, how-to
  # ═══════════════════════════════════════════════════════════
  - id: MID_CRAZY_PART
    text: "But here's the crazy part..."
    categories: [teaser, tutorial]
    template_ids: [TPL_TUT1, TPL_REE2]
    engagement_weight: 0.93

  - id: MID_GETS_BETTER
    text: "Wait, it gets better..."
    categories: [teaser, tutorial]
    template_ids: [TPL_TUT1]
    engagement_weight: 0.91

  - id: MID_NOT_BEST_PART
    text: "And that's not even the best part..."
    categories: [teaser, curiosity]
    template_ids: []
    engagement_weight: 0.89

  - id: MID_REAL_STORY_V2
    text: "But the real story is..."
    categories: [teaser, news]
    template_ids: [TPL_REE1]
    engagement_weight: 0.87

  # ═══════════════════════════════════════════════════════════
  # STATISTICS / PROOF — best for big-numbers content
  # ═══════════════════════════════════════════════════════════
  - id: MID_NUMBERS_SHOCKING
    text: "The numbers are shocking..."
    categories: [statistics, news]
    template_ids: []
    engagement_weight: 0.90

  - id: MID_DATA_SHOWS
    text: "Here's what the data shows..."
