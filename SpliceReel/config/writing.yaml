# SpliceReel writing config — additive niche instructions for LLM content writer.
# VideoContentWriter already has niche voice profiles; this adds banned phrases
# and hook examples that are specific to SpliceReel.

niche_id: movies

banned_phrases:
  - "cinema is back and"
  - "the film world is buzzing"
  - "something big happened"
  - "fans can't believe"
  - "a masterpiece in the making"
  - "Hollywood will never be the same"
  - "movie lovers need to see this"

hook_examples:
  - "Nolan's next film just leaked footage"
  - "This scene broke the entire internet"
  - "Box office record shattered in 3 days"

tone_notes: >
  Write like a cinephile who gets genuinely excited about both
  blockbusters and indie gems. Reference specific directors, actors,
  scenes, and box office numbers. Never vague superlatives.
