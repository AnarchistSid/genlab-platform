name: CodeQL

# 2026-06-29: DISABLED on the self-hosted runner. CodeQL's evaluator
# enforces a hardcoded >=384 MiB heap minimum and trace-extraction
# adds ~200 MiB of JVM + tracer overhead. The runner's 900M MemoryMax
# cgroup cap (set so CI never compounds memory pressure on the prod
# publishing pipeline) cannot accommodate that even with --ram=512 or
# --ram=700. Symptom on first migration: "A fatal error occurred:
# Evaluator heap must be at least 384.00 MiB" on both python + js
# matrix legs; python additionally stalled at the trace-command step
# for >5min without progress before being cancelled.
#
# What we kept: workflow file + matrix shape so re-enabling is a
# single ``workflow_dispatch`` toggle once a future runner upgrade
# allows it. The if: condition on the analyze job skips both matrix
# legs in all event contexts; only an explicit ``gh workflow run
# codeql.yml`` (which still hits the runner) attempts execution.
#
# Re-enable plan: when the Hetzner VPS gets a memory bump or when
# CodeQL ships smaller-footprint evaluator binaries, delete the
# ``if: ${{ false }}`` line + drop this banner.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: [self-hosted, genlab-prod]
    # Hard cap so a future OOM hang cannot block subsequent jobs on
    # the single-concurrency runner.
    timeout-minutes: 25
    # Disabled: see banner. Remove this line to re-enable.
    if: ${{ false }}
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          ram: 700
      - uses: github/codeql-action/autobuild@v4.37.3
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          ram: 700
