# ClutchWire scoring weights
# Sports content scores on recency, community signals, magnitude, and novelty

clip_scoring:
  weights:
    recency: 0.35
    community_signal: 0.30
    magnitude: 0.25
    novelty: 0.10

  recency:
    half_life_hours: 2.0

  magnitude_multipliers:
    championship_game: 3.0
    playoff_game: 2.0
    rivalry_game: 1.8
    regular_season: 1.0
    preseason: 0.4

  live_event_bonus: 1.5

  upset_multiplier: 1.4
  record_multiplier: 1.3

dedup:
  jaccard_threshold: 0.75
  tfidf_threshold: 0.70

thresholds:
  min_clip_score: 0.20
  min_compilation_score: 0.35
  top_clips_per_run: 20
