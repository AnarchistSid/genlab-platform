name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 2026-06-29: cancel superseded runs so fix-push-wait cycles don't pile
# jobs on the single-concurrency self-hosted runner. Per-workflow + per-ref
# grouping means main and a PR branch don't cancel each other, but two
# consecutive pushes to the same branch keep only the latest in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # 2026-06-29 (Fix D): runs on the self-hosted runner on the prod VPS.
    # Bypasses the account-wide GitHub Actions budget lock at $0/month
    # cost. Resource caps (MemoryMax=1.5G, OOMScoreAdjust=+1000) on the
    # systemd unit prevent CI from impacting prod publishing.
    runs-on: [self-hosted, genlab-prod]
    # F-0032: fork PRs must NOT execute on the prod-host self-hosted
    # runner. Same-repo PRs still run (contributor promotion is the
    # attack vector; own-repo pushes are trusted).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x" # U-18: pin uv consistently across workflows
      - run: uv sync --frozen
      # ruff isn't declared as a workspace dependency, so `uv run ruff`
      # resolves nothing. `uvx` runs the tool in an ephemeral environment
      # without polluting any package's deps — the right pattern for
      # repo-level lint tooling. Pinned version so CI matches local
      # results bit-for-bit; bump deliberately when ready to absorb new
      # rule additions.
      - run: uvx ruff@0.15.14 check .
      - run: uvx ruff@0.15.14 format --check .
      # R-69: enforce the import-layer contract in CI (.importlinter). It needs
      # genlab_core importable, so run it in the package env with import-linter
      # added ad-hoc (not a runtime dep). Catches upward cross-layer imports.
      - run: uv run --package genlab-core --with import-linter lint-imports --config genlab-core/.importlinter

  test:
    runs-on: [self-hosted, genlab-prod]
    # F-0032: fork PRs must NOT execute on the prod-host self-hosted
    # runner. Same-repo PRs still run (contributor promotion is the
    # attack vector; own-repo pushes are trusted).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: genlab
        ports: ["15432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x" # U-18: pin uv consistently across workflows
      # U-18: pin Python 3.13 to match test.yml. Without this the runner default
      # (not 3.13) flipped conftest's _SKIP_DETOXIFY guard, so Detoxify-heavy
      # tests behaved differently here than in test.yml — config drift.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # smart_crop integration tests probe fixtures with ffprobe; without
      # FFmpeg they skip (guarded). 2026-06-29: self-hosted runner ships
      # FFmpeg pre-installed (used by prod publishing pipeline) and the
      # gh-runner user has no sudo, so the previous ``sudo apt-get install``
      # step is dropped — ``which ffmpeg`` resolves /usr/bin/ffmpeg.
      - name: Verify FFmpeg available (pre-installed on self-hosted runner)
        run: ffmpeg -version | head -1
      - run: uv sync --frozen
      # Cache + pre-warm the HuggingFace hub so the Detoxify toxicity gate's
      # bert-base-uncased download doesn't hit huggingface.co per run. Without
      # this, ``transformers.from_pretrained`` does a HEAD-with-etag-check on
      # every model load — huggingface.co rate-limits the shared GHA runner
      # IPs and 429s hit 3 times in the session-#2 merge sweep. The
      # ``HF_HUB_OFFLINE=1`` env on the pytest step makes the cached model
      # load skip the network entirely (no etag HEAD).
      # 2026-06-29: pin HF_HOME and TORCH_HOME to absolute paths under
      # runner.tool_cache so the self-hosted runner restores into a
      # stable location. ``~/.cache/huggingface`` resolved differently
      # on self-hosted vs hosted runners (the runner cd's into
      # actions-runner/ in some contexts, so the cache restored to
      # /home/gh-runner/actions-runner/.cache instead of
      # /home/gh-runner/.cache). The torch hub path is also included
      # because Detoxify pulls its classifier weights via torch.hub.
      - name: Cache HuggingFace + torch hubs (Detoxify model weights)
        id: hf-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.tool_cache }}/.hf-cache
            ${{ runner.tool_cache }}/.torch-cache
          key: hf-cache-v2-${{ runner.os }}-detoxify-original
      - name: Pre-warm HF cache on miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HOME: ${{ runner.tool_cache }}/.hf-cache
          TORCH_HOME: ${{ runner.tool_cache }}/.torch-cache
        run: |
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          uv run --package genlab-core python -c "
          from detoxify import Detoxify
          Detoxify('original')  # downloads bert-base-uncased + detoxify weights
          "
      # 2026-06-29: TMPDIR override needed on self-hosted runner. The default
      # /tmp/genlab_audio/ directory on the prod VPS is owned by the genlab
      # user (publishing pipeline writes there); gh-runner is not in the
      # genlab group, so tests that mkdir under /tmp/genlab_audio/ get
      # EACCES. Pinning TMPDIR to the runner's workspace tmp keeps tests
      # away from prod-owned paths.
      - run: |
          export TMPDIR="${RUNNER_TEMP:-$HOME/tmp_ci}"
          mkdir -p "$TMPDIR"
          # 2026-07-14: removed -x fail-fast — masked all failures after
          # the first when triaging batch regressions. Job cap + --timeout=120
          # already prevent hangs.
          uv run --package genlab-core pytest genlab-core/tests/ -q --ignore=genlab-core/tests/storage/ --ignore=genlab-core/tests/integration/
        env:
          GENLAB_USE_POSTGRES: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: ${{ runner.tool_cache }}/.hf-cache
          TORCH_HOME: ${{ runner.tool_cache }}/.torch-cache

  # R-48/R-64: the primary store (PostgreSQL via Alembic) had ZERO CI coverage —
  # the `test` job runs with GENLAB_USE_POSTGRES=false and --ignore=tests/storage,
  # and the storage tests skip unless POSTGRES_PASSWORD is set. So a broken
  # migration or a postgres.py regression would only surface on the live DB.
  # This job applies the full Alembic chain to a fresh DB (catching migration
  # errors before they reach prod) and then exercises postgres.py against the
  # migrated schema. It is the safety net that makes future schema migrations
  # CI-validatable.
  test-storage:
    runs-on: [self-hosted, genlab-prod]
    # F-0032: fork PRs must NOT execute on the prod-host self-hosted
    # runner. Same-repo PRs still run (contributor promotion is the
    # attack vector; own-repo pushes are trusted).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        # pgvector image (superset of postgres:16) so the migration chain's
        # product_embeddings table (a `vector(1536)` column + ivfflat index) is
        # actually created and validated here, not skipped.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: genlab
        ports: ["15432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen
      # Validate the migration chain applies cleanly to an empty DB.
      # 2026-06-29: pass DATABASE_URL pointing at the service container's
      # published host port (15432). alembic.ini's hardcoded :5432 would
      # otherwise hit prod's genlab-postgres (auth fails because the
      # password differs). env.py honors DATABASE_URL override added in
      # the same commit.
      - run: uv run --package genlab-core alembic -c genlab-core/alembic.ini upgrade head
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          DATABASE_URL: postgresql+psycopg://genlab:${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}@localhost:15432/genlab
      # Create a non-superuser app role so the RLS isolation tests are
      # meaningful — Postgres superusers (the docker image's POSTGRES_USER) and
      # table owners-without-FORCE bypass row-level security. The app connects
      # as a non-superuser in prod, so the tests must too.
      - name: Create non-superuser app role
        run: |
          uv run --package genlab-core python - <<'PY'
          import os, psycopg
          su = os.environ["POSTGRES_PASSWORD"]
          with psycopg.connect(f"postgresql://genlab:{su}@localhost:15432/genlab", autocommit=True) as conn:
              cur = conn.cursor()
              cur.execute("DROP ROLE IF EXISTS genlab_app")
              cur.execute("CREATE ROLE genlab_app LOGIN PASSWORD 'app_test_password'")
              cur.execute("GRANT USAGE ON SCHEMA public TO genlab_app")
              cur.execute("GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO genlab_app")
              cur.execute("GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO genlab_app")
          PY
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
      # Exercise postgres.py CRUD + RLS against the migrated schema, AS the
      # non-superuser role (so RLS actually filters).
      # 2026-06-29: GENLAB_TEST_PG_PORT must be explicit on the self-hosted
      # runner — conftest.py defaults to :5432 which collides with the prod
      # genlab-postgres container running on the same host.
      - run: uv run --package genlab-core pytest genlab-core/tests/storage/ -q
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          GENLAB_TEST_PG_USER: genlab_app
          GENLAB_TEST_PG_PASSWORD: app_test_password
          GENLAB_TEST_PG_PORT: "15432"
          GENLAB_USE_POSTGRES: "true"
          DATABASE_URL: postgresql://genlab_app:app_test_password@localhost:15432/genlab

  # R-04: surface the 40 integration smoke tests that were silently
  # deselected by ``addopts = "-m 'not integration'"`` in
  # ``genlab-core/pyproject.toml``. The suite is hermetic — fixtures live
  # under ``tests/integration/fixtures/`` (mock_anthropic_response.json,
  # mock_youtube_trending.json, etc), no real network. 38/40 pass on main
  # today; the 2 known failures depend on PR #128 (R-19) landing first
  # (it adds ``virality_score`` to blueprints — the missing field these
  # tests assert on). Deselected here with a clear pointer; remove the
  # deselects in a follow-up the moment #128 merges.
  integration:
    runs-on: [self-hosted, genlab-prod]
    # F-0032: fork PRs must NOT execute on the prod-host self-hosted
    # runner. Same-repo PRs still run (contributor promotion is the
    # attack vector; own-repo pushes are trusted).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: uv sync --frozen
      # ``uv run --package genlab-core`` changes CWD to ``genlab-core/`` —
      # pytest test IDs must be relative to that, not the workspace root.
      - run: |
          # 2026-07-14: removed 2 stale --deselect entries for
          # test_qc_gates_validates_blueprints + test_virality_scoring_
          # scores_blueprints. Comment claimed they depended on PR #128
          # (R-19 virality_score) landing; #128 landed months ago but
          # the tests remained deselected — real cause was the tests
          # were iterating the wrong context key (blueprints instead of
          # stories after the P1 producer-registry refactor). Tests
          # fixed in same commit as this deselect removal.
          uv run --package genlab-core pytest \
            -m integration \
            genlab-core/tests/integration/ \
            --tb=short -q
        env:
          GENLAB_USE_POSTGRES: "false"

  secret-scan:
    runs-on: [self-hosted, genlab-prod]
    # F-0032: fork PRs must NOT execute on the prod-host self-hosted
    # runner. Same-repo PRs still run (contributor promotion is the
    # attack vector; own-repo pushes are trusted).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 2026-06-29: run gitleaks directly instead of via gitleaks-action@v3.
      # The action uploads a SARIF artifact at the end of the run, and the
      # account-wide Actions artifact storage quota has been exhausted —
      # causing the upload step to fail the entire job even when no
      # secrets are detected. Pin the binary version (matches what the
      # action shipped on its last green run) and write findings to the
      # job log + GITHUB_STEP_SUMMARY instead of artifacts.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION="8.24.3"
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-$VERSION"
          mkdir -p "$INSTALL_DIR"
          if [ ! -x "$INSTALL_DIR/gitleaks" ]; then
            curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
              | tar -xz -C "$INSTALL_DIR"
          fi
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Run gitleaks
        run: |
          set -euo pipefail
          # On pushes: scan only the commit range pushed. On PRs: scan the
          # full PR diff (base..head). Fallback: full repo scan.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags --depth=200 origin "$BASE_SHA" || true
            gitleaks detect --redact -v --exit-code 2 \
              --log-opts="--no-merges $BASE_SHA..$HEAD_SHA"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            gitleaks detect --redact -v --exit-code 2 \
              --log-opts="--no-merges ${{ github.event.before }}..${{ github.sha }}"
          else
            gitleaks detect --redact -v --exit-code 2 --no-git || \
              gitleaks detect --redact -v --exit-code 2
          fi
