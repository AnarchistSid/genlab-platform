# MULTI-PLATFORM ADAPTATION PROMPTS
# Used by adapt_for_platforms.py to rewrite content per platform.
# Variables: {hook}, {caption}, {slide_titles}, {slides_json},
#            {source}, {story_url}, {story_title}, {max_tweets}
