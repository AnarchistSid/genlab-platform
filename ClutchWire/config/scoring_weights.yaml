# ClutchWire scoring weights
# Sports content scores on recency, community signals, magnitude, and novelty

clip_scoring:
  weights:
    recency: 0.35
    community_signal: 0.30
    magnitude: 0.25
    novelty: 0.10

  recency:
    half_life_hours: 2.0

  magnitude_multipliers:
    championship_game: 3.0
    playoff_game: 2.0
    rivalry_game: 1.8
    regular_season: 1.0
    preseason: 0.4

  live_event_bonus: 1.5

  upset_multiplier: 1.4
  record_multiplier: 1.3

# Per-niche virality_scoring patterns (2026-07-21 fix — the pipeline
# stage genlab_core.pipeline.stages.virality_scoring falls back to
# DEFAULT_PATTERNS which are 100% AI-industry vocabulary. Sports content
# matched zero patterns → virality_score=0.0 → blueprints failed the
# auto_approval_gate's >=0.05 virality floor. Same class-of-bug as the
# composite_score contract regression fixed 2026-07-21.
#
# Only pop_culture_reference and named_tool need overriding — the other
# 7 default patterns (hook_format_question, nostalgia_angle,
# dollar_amount, before_after, controversy_debate, tutorial_how_to,
# listicle_number) are genuinely niche-agnostic and work as-is.
virality_scoring:
  patterns:
    # Sports leagues, competitions, franchises + governing bodies
    pop_culture_reference: "\\b(nba|nfl|mlb|nhl|ufc|mma|wwe|zuffa|fifa|premier league|champions league|epl|la\\s*liga|serie a|bundesliga|f1|formula\\s*1|nascar|indycar|motogp|stanley cup|world series|super bowl|world cup|olympics|wimbledon|us open|the open|masters|ryder cup|q[123]|fp[123]|espn|bleacher|dazn)\\b"
    # Sport-specific moments, actions, gear, terms
    named_tool: "\\b(playoff|championship|semi(?:-|\\s)?final|final|game[-\\s]?winner|game[-\\s]?winning|walkoff|walk[-\\s]?off|buzzer[-\\s]?beater|hat[-\\s]?trick|touchdown|home\\s*run|homer|knockout|k\\.?o\\.|hail mary|clutch|overtime|extra time|penalty shootout|comeback|no[-\\s]?hitter|title|belt|cup|trophy|medal|ring|gym|fight|match|bout|round|shot|goal|score|win|victory|defeat|upset|record|training|workout|comeback|retirement|transfer|signing|draft|trade|shorts|onboard|pole|podium|lap)\\b"

dedup:
  jaccard_threshold: 0.75
  tfidf_threshold: 0.70

thresholds:
  # Tightened 2026-06-08 per content-mix rebalance: sports was producing
  # 5-26 blueprints/day vs 1-4 for every other niche. With a 1-reel/day
  # publish cap that was 80-95% funnel waste — blueprints stuck in
  # DRAFTED forever, repeatedly re-scored each pipeline run.
  #
  # New target: 3-5 blueprints/day in line with anime/movies. The bandit
  # still has 3-5 candidates to pick from, leaving room for exploration.
  # Old values commented out for one cycle in case we need to roll back:
  #     min_clip_score: 0.20        # → 0.30
  #     min_compilation_score: 0.35 # → 0.45 (proportional bump)
  #     top_clips_per_run: 20       # → 5 (the dominant cap)
  min_clip_score: 0.30
  min_compilation_score: 0.45
  top_clips_per_run: 5
