# CriticalRush writing configuration
# Passed to write_video_content() as extra_instructions

banned_phrases:
  - "something big happened"
  - "the community is going wild"
  - "players need to see this"
  - "this changes everything"
  - "fans are not ready"
  - "everyone is talking about"
  - "Save this for later!"
  - "Follow for daily gaming content"
  - "save this for later 🔖"
  - "follow for daily gaming content 🎮"

hook_examples:
  # 2026-06-17: rebalanced toward AAA + big-franchise content. The
  # previous 6 examples skewed indie/underdog ("never heard of",
  # "nobody asked for", "hasn't released yet"), which biased the LLM
  # toward writing about obscure games — and the published feed showed
  # exactly that pattern (MECCHA CHAMELEON, Pro Cycling Manager 26,
  # SpaceCraft instead of AAA trailers). Operator feedback: "no new
  # game trailers or anything interesting".
  #
  # The new mix: 4 AAA / franchise-tentpole examples, 2 underdog-but-
  # mainstream examples. Keeps the hook diversity (not all "trailer
  # dropped" homogeneity) while killing the indie bias.
  - "The GTA 6 trailer dropped early — every detail you missed"
  - "Call of Duty just changed multiplayer forever"
  - "Why everyone's switching from Fortnite to this"
  - "The Final Fantasy 17 reveal had ONE moment that broke Twitter"
  - "Marvel Rivals just got the buff that ends the meta"
  - "Why pros are jumping ship from Valorant to this"

tone_notes: >
  You sound like a Twitch streamer reacting live. High energy, niche slang
  (goated, no cap, W, L, clutch, broken). React to the moment FIRST,
  explain second. Never sound like a journalist or news anchor.
  Never use boring/formal language. Never start with "So" or "Well" or
  "Basically". Never use "BREAKING:" or "JUST IN:" or "announces".
  Each post MUST have a DIFFERENT CTA — never repeat "Save this for later"
  across posts. Rotate through question-format CTAs that invite engagement.
