        dashboard/server/api/links.py:1084: from genlab_core.monetization.link_tracker import log_click
        dashboard/server/api/links.py:1086: log_click(
    - command: 'rg -n ''affiliate.*link|affiliate_reply'' --type py -g ''!*/.venv/*'' genlab-core/src/genlab_core/publishing genlab-core/src/genlab_core/platforms | head -5'
      host: mac
      output: |
        genlab-core/src/genlab_core/platforms/threads.py:230:  # 2026-07-22 (Layer 2 monetization): post affiliate link as
        genlab-core/src/genlab_core/platforms/x_twitter.py:465:  # First-reply for affiliate link: X downranks tweets with external
        genlab-core/src/genlab_core/platforms/facebook.py:230:  # Post affiliate link as first comment
        genlab-core/src/genlab_core/publishing/affiliate_reply.py:1: """Post-publish affiliate link as first comment/reply.
        genlab-core/src/genlab_core/publishing/parallel_publish.py:294: # Post affiliate link as first reply/comment (non-blocking).
    - command: 'rg -c ''FROM affiliate_clicks'' dashboard/server/api/ 2>/dev/null'
      host: mac
      output: |
        dashboard/server/api/revenue.py:10
        dashboard/server/api/analytics.py:1
        dashboard/server/api/links.py:2
  claim: >
    Pre-Session-9 correction: A-0073 was wrong on its central claim. The full monetization
    module EXISTS: `link_tracker.py:log_click()` at line 144 calls
    `pg.create("affiliate_clicks", record)` via the backend abstraction (which my Phase
    6/7 greps missed by looking for `INSERT INTO`/`class AffiliateClick`). The invoker
    is `dashboard/server/api/links.py:1086` — the click-redirect endpoint that fires
    `log_click()` when a user follows an affiliate link through the dashboard. The
    emission path is real too: `platforms/{threads,x_twitter,facebook}.py` and
    `publishing/{affiliate_reply,parallel_publish}.py` all post affiliate links as
    first-comment/reply. Dashboard queries the table extensively (13 SELECT sites in
    revenue.py/analytics.py/links.py) for reporting. So the pipeline is wired end-to-end
    at the code level; the 0 rows is situation 2 (wired but no conversions).
  blast_radius: >
    Downgrades A-0073 from S1 to S2. The revenue-thesis question shifts from
    "not implemented" (feature-gap) to "implemented but no data" (either audience is
    genuinely not clicking, OR the emitted affiliate URLs bypass the dashboard's
    `/link/<id>` redirect and hit the network directly — in which case clicks land
    on Amazon/Cuelinks logs, not `affiliate_clicks`). Discriminator: inspect one
    posted affiliate URL from a recent publish — if it points to `dashboard.host/link/…`
    the redirect fires and 0 rows means 0 audience clicks; if it points to
    `amzn.to/...`, `cuelinks.com/...` directly, GenLab never sees the click. A-0071's
    operator-run network-dashboard cross-check is still the ground-truth check;
    A-0073's shape correction is that the code is present, not absent. Same
    methodology-error class as A-0078 (grep pattern didn't match how codebase writes).
  effort: M
  proposed_action: investigate
  supersedes: []

