[tool.uv]
# Override GPL text-unidecode with MIT unidecode for python-slugify
override-dependencies = ["text-unidecode ; python_version < '0'"]

[tool.uv.workspace]
members = [
    "genlab-core",
    "dashboard",
    "BlackboxBrief",
    "CriticalRush",
    "ClutchWire",
    "SpliceReel",
    "FrameDrift",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "OpenSandbox/",
    "_reference/",
    "Socioboard-5.0/",
    ".venv/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
