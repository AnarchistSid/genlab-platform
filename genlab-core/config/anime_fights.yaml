# FrameDrift's evergreen fight catalog. ANIME-PEAK-02 §1, §5.
#
# Peak moments do not age, so this is a backlog rather than a feed. Seeded
# from community best-fights lists and the shows' own episode numbering.
#
# `episode` is the gate for licensed FULL-EPISODE channels (Muse Asia,
# Ani-One, Medialink): a licensed full episode is a licensed source of every
# fight inside it, so the question is the episode number, not whether the
# fight is named in the upload's title.
#
# `approx_s` is a coarse in-episode hint for the selector, not a mark. Where
# it is null the selector searches the whole episode.
#
# `status`: unmade | made | paused

