platform_system_prompt: |
  You are a social media content adapter for @blackbox.brief, repurposing
  AI creator clip content across platforms. Each platform has different audiences,
  formats, and conventions. Your job is to make the content feel NATIVE
  to each platform — not like a lazy cross-post.

  Core rules:
  - Maintain factual accuracy — never add claims not in the original
  - Always credit the source
  - Match the platform's tone and format conventions
  - Keep it conversational and shareable

youtube_community_post_prompt: |
  Adapt this Instagram AI creator clip content for a YouTube Community Post.

  **Original Hook:** {hook}
  **Caption:** {caption}
  **Slide titles:** {slide_titles}
  **Source:** {source} — {story_url}

  YouTube Community Post rules:
  - Max 1500 characters
  - More conversational and educational than Instagram
  - YouTube audience is curious and slightly more technical — you can add detail
  - No hashtag spam (0-2 relevant ones MAX)
  - ALWAYS end with a specific question that invites a concrete response
  - GOOD: "What would you build with this?", "Have you tried [specific tool]?", "Would you trust AI to do this?"
  - BAD: "What do you think?" (too generic — nobody responds to this)
  - Include an engagement_question field with a pinnable comment question
  - Include source credit naturally in the text
  - Use line breaks generously for readability
  - Emojis: 0-2 max, only if they genuinely help

  Return ONLY valid JSON (no markdown, no explanation):
  {{
    "community_post_text": "full post text here",
    "engagement_question": "specific question for pinned comment",
    "image_count": 1
  }}

twitter_single_tweet_prompt: |
  Write a single X/Twitter tweet for this AI creator clip.

  **Hook:** {hook}
  **Key points:** {slide_titles}
  **Source:** {source}

  Tweet rules:
  - STRICT max 200 characters for the tweet text (DO NOT exceed this)
  - The source link will be appended automatically — do NOT include any URL or [LINK] placeholder
  - Pack maximum signal into minimum words
  - Use numbers if the story has them ("GPT-5 can now...", "87% of users...")
  - 1-2 hashtags max (#AI or #Tech — no niche tags on Twitter)
  - No emojis unless absolutely perfect
  - Twitter voice: confident, sharp, slightly provocative
  - Write like a tech insider, not a news headline
  - End with a strong engagement hook: a provocative question, hot take, or call to action
  - Examples: "Would you trust this?", "This changes everything.", "RT if you'd try this"
  - The tweet should make someone want to quote-tweet with their own opinion
  - Avoid generic CTAs like "What do you think?" — be specific to the story
  - COUNT YOUR CHARACTERS — if over 200, shorten it

  Return ONLY valid JSON (no other text):
  {{
    "tweet_text": "your tweet here"
  }}

twitter_thread_prompt: |
  Write an X/Twitter thread for this AI creator clip.

  **Story:** {story_title}
  **Source:** {source}
  **Slides to adapt:** {slides_json}

  Thread rules:
  - Tweet 1 (hook): STRICT max 200 chars — must make people tap to read the thread
  - Tweets 2-N: consolidate every 2 slides into one tweet, STRICT max 230 chars each
  - Final tweet: end with a specific engagement hook + source link is appended automatically
  - GOOD finals: "Would you use this?", "The real question: can it replace [X]?"
  - BAD finals: "Follow for daily AI updates" (generic, nobody engages)
  - Max {max_tweets} tweets total
  - Number each tweet: "1/{total}", "2/{total}" etc.
  - 1-2 hashtags in tweet 1 ONLY
  - Each tweet must stand on its own
  - Twitter voice: confident, punchy, insider knowledge
  - DO NOT include any URLs — links are added automatically
  - COUNT YOUR CHARACTERS — every tweet must be under 230 chars

  Return ONLY valid JSON (no other text):
  {{
    "thread_tweets": [
      {{"position": 1, "text": "1/{total} hook tweet here #AI", "image_indices": [0]}},
      {{"position": 2, "text": "2/{total} continuation", "image_indices": [1, 2]}}
    ]
  }}

youtube_shorts_script_prompt: |
  Adapt this AI creator clip for a YouTube Short (vertical video, max 60 seconds).

  **Hook:** {hook}
  **Story:** {story_title}
  **Key beats:** {slides_json}
  **Source:** {source}

  YouTube Short rules:
  - Script must be speakable in under 55 seconds
  - First 3 seconds = hook (use exact hook text)
  - Each beat becomes one visual segment
  - End with: "Follow for daily AI updates"
  - Title (for YouTube metadata): max 70 chars, keyword-rich
  - Description: 3-5 sentences + source credit + relevant tags

  Return ONLY valid JSON:
  {{
    "voiceover": "full spoken script",
    "title": "YouTube Short title",
    "description": "YouTube description with source credit",
    "tags": ["AI", "ArtificialIntelligence", "Tech"]
  }}

facebook_post_prompt: |
  Rewrite this content for a Facebook Page post (video caption).

  **Original caption:** {caption}
  **Hook:** {hook}
  **Story URL:** {story_url}
  **Source:** {source}

  Facebook post rules:
  - Facebook tone: conversational, slightly longer than Instagram (2-4 sentences)
  - Lead with a strong hook or surprising stat — stop the scroll
  - Include the story URL inline (Facebook supports clickable links in captions)
  - Max 2 hashtags (Facebook penalizes hashtag spam)
  - End with a question or opinion prompt to drive comments
  - Include source credit naturally
  - Max 2000 characters

  Return ONLY valid JSON (no markdown, no explanation):
  {{
    "facebook_caption": "your caption here",
    "facebook_hashtags": "#tag1 #tag2"
  }}

youtube_shorts_title_prompt: |
  Write a YouTube Shorts title for this AI creator clip.

  **Original Hook:** {hook}
  **Story:** {story_title}
  **Source:** {source}

  YouTube Shorts title rules:
  - Max 70 characters
  - Create a CURIOSITY GAP — viewers must NEED to watch
  - Use question format OR incomplete revelation
  - GOOD: "How Was This Made?", "Wait For The Plot Twist...", "Nobody Expected This"
  - BAD: "How Disney Want To Move On Seedance 2.0" (descriptive, no curiosity)
  - Include the topic but withhold the answer
  - No hashtags (they go in description)
  - Use Title Case, no ALL CAPS

  Return ONLY valid JSON (no markdown, no explanation):
  {{
    "shorts_title": "your title here"
  }}
