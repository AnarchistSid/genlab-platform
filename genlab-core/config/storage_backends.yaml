# Storage backend routing — which engine serves each table.
#
# Valid values: "sharepoint", "postgres".
# Default: "sharepoint" if a table is not listed here.
#
# Sprint 68: PostgreSQL is the production backend (GENLAB_USE_POSTGRES=true).
# When GENLAB_USE_POSTGRES=true is set in .env, BacklogClient overrides
# this config and routes ALL tables to PostgreSQL regardless of what's here.
# This YAML serves as the canonical routing config and documentation.

tables:
  Stories: postgres
  Blueprints: postgres
  Templates: postgres
  Assets: postgres
  Sources: postgres
  Publishing_Analytics: postgres
  Analytics: postgres
  AB_Tests: postgres
  Content_Memory: postgres
  PendingEngagement: postgres
  PendingFeedback: postgres
  BanditArms: postgres
  Audience_Snapshots: postgres
