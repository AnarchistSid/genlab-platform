# 2026-07-17: hard memory cap for OOM safety on 4 GB Hetzner VPS.
#
# Observed steady-state RSS: ~52 MB (dramatiq main + 1 worker).
# Peak includes detoxify torch model (~150 MB CPU inference weights)
# loaded lazily on first toxicity check. Cap at 384 MB gives 2.5×
# over steady + 1.5× over peak-with-model — enough headroom for
# concurrent toxicity checks on burst comment volume.
#
# See genlab-dashboard.service.d/memory-cap.conf for full rationale.

[Service]
MemoryMax=384M
