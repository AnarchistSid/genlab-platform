# Self-heal drop-in for the self-hosted GitHub Actions runner.
# 2026-07-13 audit follow-up: runner had been in oom-kill failed
# state for 2 days, causing every CI job to queue forever.
# Operators worked around by --admin-merging PRs without CI.
#
# The resource-caps drop-in (900M MemoryMax) is intentional to
# protect the publisher — see that file for rationale. The trade-off
# is that big jobs (CodeQL, test-core large pytest runs) hit OOM.
#
# This drop-in makes each OOM RECOVERABLE instead of terminal:
#   - The specific job that OOM'd stays failed (as before)
#   - But the RUNNER SERVICE restarts and picks up the next job
#   - 60s cooldown between restarts prevents thrashing on a truly
#     bad state
#   - Rate limit (5 in 10min) so a genuinely broken runner doesn't
#     loop forever — systemd stops trying + operator gets a proper
#     "failed" state to investigate

[Unit]
# StartLimit* directives belong in [Unit] per systemd contract.
StartLimitBurst=5
StartLimitIntervalSec=600

[Service]
Restart=on-failure
RestartSec=60s
