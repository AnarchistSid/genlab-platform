[project]
name = "splicereel"
version = "1.0.0"
description = "SpliceReel — Movies/Entertainment content automation agent for Gen Lab"
requires-python = ">=3.12"
dependencies = [
    "genlab-core",
    "httpx>=0.27",
    "feedparser>=6.0",
    "pyyaml>=6.0",
]

[tool.uv.sources]
genlab-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sr_strategies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
