# Rights loop — observed claims, from evidence, never from assumption.
#
# Source: YouTube Studio copyright read-out, 2026-09-26, over 9 private
# preflight uploads on FrameDrift. The Data API gave territories only; the
# claimant, asset and match type came from Studio. Both are recorded because
# the preflight uses the API and only Studio names the claimant.
#
# match_type: visual | audio_track | audiovisual | composition
# policy:     block | monetise | track | none

