[tool.uv]
# Override GPL text-unidecode with MIT unidecode for python-slugify
override-dependencies = ["text-unidecode ; python_version < '0'"]
# Accept pre-release versions when resolving — required for yt-dlp's nightly
# (2026.6.6.234447.dev0) which ships SABR + GVS-PO-Token workarounds ahead
# of the stable channel. Without this, ``uv run`` re-resolves on every call
# and silently downgrades to the latest stable (2026.3.17) that fails 100%
# of YouTube downloads as of 2026-06-08.
prerelease = "allow"

# 2026-06-29: pin torch to the CPU-only wheel index. detoxify (engagement
# toxicity gate) pulls torch as a transitive dep. The default index ships
# the +cu12 build which pulls ~8 GB of NVIDIA CUDA wheels (nccl, cublas,
# cudnn, cusparse, cusolver, cufft, etc.). Neither prod (Hetzner Xeon, no
# GPU) nor CI (self-hosted runner on same Xeon) has CUDA, so the wheels are
# wasted bandwidth + disk. The CPU wheel is ~200 MB. Functionally identical
# for our use case (detoxify inference on short comment strings).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv.workspace]
members = [
    "genlab-core",
    "dashboard",
    "BlackboxBrief",
    "CriticalRush",
    "ClutchWire",
    "SpliceReel",
    "FrameDrift",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "OpenSandbox/",
    "_reference/",
    "Socioboard-5.0/",
    ".venv/",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B008",  # do not perform function calls in default arguments
]

[tool.ruff.lint.per-file-ignores]
# Tests routinely do sys.path mutation before imports and use `assert`.
"**/tests/**" = ["S101", "E402"]
# Dashboard server adds BlackboxBrief root to sys.path via GENLAB_PROJECT_ROOT
# (see dashboard/CLAUDE.md) before importing execution.*. Same pattern in
# every API module.
"dashboard/server/**" = ["E402"]
# Scripts and migrations import after dotenv.load_dotenv() or sys.path
# adjustment — intentional pattern, not a code smell to flag every commit.
"scripts/**" = ["E402"]
"**/migrations/**" = ["E402"]
# The 4 production-code E402 sites in genlab-core/src have inline noqa
# annotations where the import-after-stub-decorator pattern is genuinely
# intentional (metric_collector defines stub `flow`/`task` decorators
# before importing the real flow modules); kept explicit per-line to
# document intent.
