      - name: "Diwali Deal: PS5 Console"
        keywords: [ps5, playstation, sony, gaming, console, diwali, deal, sale, festival]
        category: hardware
        networks:
          amazon: { url: "https://www.amazon.in/dp/B0CY5QW186?tag=${AMAZON_IN_AFFILIATE_TAG}", commission_pct: 4.0 }
