# FrameDrift writing config — additive niche instructions for LLM content writer.
# VideoContentWriter already has niche voice profiles; this adds banned phrases
# and hook examples that are specific to FrameDrift.

niche_id: anime

banned_phrases:
  - "the anime community is going wild"
  - "something big happened"
  - "fans can't believe"
  - "otaku need to see this"
  - "a new era of anime"
  - "the most anticipated anime"
  - "anime fans are shaking"

hook_examples:
  - "The anime nobody finished but everyone remembers the ending of"
  - "Why MAPPA animators are leaking burnout footage"
  - "An OVA from 2003 is outranking every show this season"
  - "The fight scene that took 14 months to animate"
  - "What this opening does that 100 other anime can't"
  - "How a 4-episode anime is dominating MAL this week"

tone_notes: >
  Write with passionate otaku energy. Reference specific anime titles,
  studios, characters, and episodes. Use anime culture references
  naturally — never forced. Emotional reactions are welcome.
