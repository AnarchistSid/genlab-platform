family: impact
status: built
sports: [ufc, boxing, kickboxing, mma, wrestling, hockey, rugby, nfl]
moment: contact
effects: [flame_aura, bolts, body_flash, debris, shockwave, drawing_flash, heat_shimmer]
palette:
  aura: [255, 62, 72]        # crimson, measured off the reference -- not amber
  bolt_core: [255, 118, 150] # PINK end to end: a white core has red-excess ~0 and
                             # is invisible to the statistic the gate is written in
  world_sat: 0.22
  ambient_red: 0.018
# Grade TARGETS, not multipliers. The multipliers are per source and are solved
# at render time against these numbers; WWE's 0.30 world_luma was solved for
# WWE's arena and lands nowhere on a brighter cage (UFC's ungraded corner luma
# is 81.7 against this reference's 32.9). "Match the reference's numbers" was
# always the rule -- these ARE the reference's numbers.
grade_targets:
  corner_luma: 32.93
  world_luma: 37.12
  subject_luma: 76.9
  subject_world_ratio: 2.07    # dim the world, light the subject
subject:
  second_person_is_noise: true
  min_person_px: 400
  # A METHOD, never a colour. The seed derivation finds *a* saturated garment;
  # the kit has to say WHOSE. Identity is decided once per window and held for
  # every annotation -- re-deriving per frame walked the aura onto the opponent
  # on 58 of 96 frames.
  selection:
    method: upright_on_last_frame     # the finisher is still standing
    upright_aspect: 1.2
    tie_break: motion_toward_other    # both upright -> the aggressor
    hold_across_annotations: true
drawing_flash:
  # Derived from THIS clip's contact frame at render time. No path may appear
  # here: a stored file is another clip's asset and would ship the wrong
  # fighter's likeness into every reel that uses this kit.
  source: derived_per_clip
  frame: contact
face_protected: true
beat: {bpm_range: [140, 170], events_on: [beat, half_beat], bolts_on: downbeat}
audio: {keep_commentary: true, bed_lufs: -15, commentary_lufs: -23}
source_preference:
  - close/cage-side broadcast cuts over wide hard-cam
  - rope-free chest on the hit frame
  - subject torso >= 180 px in source
rights:
  footage_allowed: true
  posture: official-channel RSS, in-frame attribution, stop rule on any claim
  hostile_holders: [ufc, wwe]
notes: >
  Proven end to end on WWE hard-cam, which is the WORST input for this kit:
  wide framing forced a 3.0x punch-in. UFC/boxing cage-side footage should need
  far less magnification and read better unchanged.

# ── Measured constants (RENDER-01 §1) ────────────────────────────────────────
# Every number here came from measuring a specific artifact. The comment names
# it, so a future change can re-measure rather than re-guess.
measured:
  full_bleed_floor_1080p: 1.7778   # 1920/1080: widest crop that still fills
                                   # 1080x1920. Bit three times before it was
                                   # named. It is a FUNCTION of source height --
                                   # 720p needs 2.667x -- so code derives it.
  torso_box_target: 0.465          # reference VFX edit; UFC official 0.474,
                                   # WWE hard-cam 0.172 (the rejected input)
  torso_floor: 0.30                # below this a clip is not an ACTION input
  aura_band_subject_frac: 0.251    # band width as a share of SUBJECT height,
                                   # from CONTENT-15. Cap by frame-width share:
                                   # this transferred fine at 1.78x and became
                                   # 40% of frame width at 2.50x.
  aura_band_frame_width_cap: 0.114 # reference's own band as a share of frame
  matte_feather_px: 18             # 34 hid a jagged birefnet edge; SAM2's edge
                                   # is clean, so 18 is enough
  matte_area_band: [0.12, 0.55]    # in CROP space. Above 0.55 the tracker has a
                                   # garment, not a person.
  subject_vote_frames: 10          # a rule that flips with a 33ms shift is not
                                   # a rule; majority over the last N frames
  subject_vote_min_margin: 0.80
  subject_body_area_floor: 0.04    # a silhouette smaller than this is residue
  flash_finish_tolerance_frames: 3
  drawing_pose_iou_gate: 0.60      # wrong-fighter floor measured at 0.291;
                                   # self-IoU 1.000, scale-invariant to 0.986
  drawing_max_tries: 3             # then NO drawing: a missing flash beats a
                                   # flash showing a different fight
  tail_live_frames: 12             # the segment ends on the footage
  aura_fade_frames: 6
  quiet_run_max_s: 0.80
  cuts_per_s_band: [0.33, 1.50]    # REEL scope only. A SEGMENT is one shot by
                                   # selection (zero cuts is a criterion).
  bpm_period_note: "150 BPM = exactly 12 frames at 30fps; ask the generator for
    a tempo whose period is a whole number of frames and the grid is integer"
