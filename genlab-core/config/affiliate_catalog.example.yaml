  ai_creators:
    # AI affiliate seed catalog (PR AB, 2026-06-29)
    #
    # Pre-PR-AB state: ai_creators had 10 catalog entries but 0% of
    # blueprints carried an affiliate_cta over 60 days, vs. 30% catalog
    # average (gaming 68%, anime 57%, movies 41%). Root causes:
    #   - 8 of 10 products either had ``enabled: false`` (no networks)
    #     or sat above the ₹3000 ``max_price_inr`` cap (RTX 4090 at
    #     ₹159,900, AI Course Bundle at ₹4,999, Portable Monitor at
    #     ₹12,999, Coding Keyboard at ₹8,999, AI Microphone at ₹5,999).
    #   - The 2 eligible-by-price products (Ring Light, Green Screen)
    #     had hardware-only keywords that almost never appeared in AI
    #     content captions.
    #   - Only Claude Pro Subscription matched on AI-tool keywords —
    #     a single product can't carry an entire niche's monetization.
    #
    # This seed expands the catalog with subscription-tier AI creator
    # tools that (a) fit the ≤₹3000 impulse-buy cap, (b) match keywords
    # already in BlackboxBrief/config/sources.yaml positive_keywords,
    # and (c) have real affiliate programs OR honest direct landing
    # pages.
    #
    # OPERATOR ACTION REQUIRED — for each product below where
    # ``enabled: false`` is set, the operator must:
    #
    #   1. Visit the affiliate signup URL listed in the product's
    #      ``# signup:`` comment.
    #   2. Replace the placeholder ``url:`` value with the real
    #      affiliate URL returned after signup.
    #   3. Flip ``enabled: false`` → ``enabled: true``.
    #   4. Restart the dashboard/pipeline services so the new catalog
    #      is reloaded (``scripts/deploy.sh`` already does this, or
    #      ``systemctl restart genlab-*``).
    #
    # Products that ship enabled use a ``direct:`` network at 0%
    # commission pointing to the canonical product landing page. These
    # generate honest CTAs that route users somewhere useful but earn
    # no commission until the operator joins the program (then swap
    # ``direct:`` for the real network).
    #
    # PR #638 reference: catalog-coverage data showing ai_creators at
    # 0% affiliate_cta populated over the 60-day window.
    products:
    # -- Tier B: direct-CTA-now, no commission until operator signs up --
    - name: Claude Pro Subscription
      enabled: true
      keywords:
