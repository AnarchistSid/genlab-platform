- id: A-0048
  phase: 4
  host: vps
  title: "BB rollout_pct: 1.0 LIVE while BB pipeline is dark — auto-approver ratchet at max on a channel that isn't publishing (throughput-throttle indistinguishable from upstream failure)"
  category: correctness
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'grep -A1 "rollout_pct" /opt/genlab/BlackboxBrief/config/publishing.yaml | tail -2'
      host: vps
      output: |
        rollout_pct: 1.0
    - command: 'ssh genlab-prod "journalctl -u genlab-auto-approver --since ''2026-07-29 17:00'' --no-pager | grep ai_creators | head -2"'
      host: vps
      output: |
        Jul 29 17:00:14 python[3266710]: [ai_creators] examined=2 approved=0 low_conf=2 rejected=0 idempotent=0 rollout_deferred=0 compliance_blocked=0 errors=0 dry_run=False disabled=False kill=False paused=False cap=False
  claim: >
    BB (ai_creators) has `rollout_pct: 1.0` in publishing.yaml — the auto_ramp_auto2.py
    writer (A-0023) walked it to full traffic. Combined with A-0034 (BB publishing pipeline
    32 attempts / 8 days / 0 PUBLISHED), the auto-approver ratchet is at maximum on a
    channel that isn't publishing. Auto-approver journal for ai_creators shows examined=2
    (blueprints exist to evaluate) but approved=0 low_conf=2 — the approver is running
    and rejecting on low confidence, so the ratchet position is not causing zero-approvals;
    the pipeline failure downstream is.
  blast_radius: >
    Class-of-bug: throughput at zero can mean throttled (rollout_pct 0.0) OR upstream failure
    (pipeline dark). From the ratchet's perspective these look identical. If operator ever
    re-tries the ratchet-advance decision they might interpret the zero throughput as
    "not enough traffic" and increase rollout further — masking the actual pipeline break.
    Fix at the observability layer: report `examined_by_pipeline` vs `examined_by_approver`
    distinctly in the ratchet dashboard.
  effort: M
  proposed_action: fix
  supersedes: []

