      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a silhouette of a person standing before a massive wall of abstract digital data streams in blue and red, surveillance aesthetic"
    style_suffix: "Dark moody tones, dramatic chiaroscuro lighting, editorial style, tension and gravitas. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

  tools:
    scene_templates:
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a sleek premium smartphone lying flat on a minimalist white marble surface, a colorful blurred AI interface glowing on screen, soft studio lighting from the side"
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a close-up of a modern laptop keyboard with ambient blue light reflecting off the keys, a person's fingers in motion, tech product photography style"
    style_suffix: "Clean tech product photography, studio lighting, minimal background, Apple-aesthetic simplicity. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

  robots:
    scene_templates:
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a humanoid robot arm in a pristine white factory, dramatic backlighting creating a rim glow, industrial automation setting"
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a sleek bipedal robot standing in a minimalist white studio, side-angle view, the robot's joints and sensors visible in detail"
