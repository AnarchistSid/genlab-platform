# 2026-07-17: hard memory cap for OOM safety on 4 GB Hetzner VPS.
#
# Observed steady-state RSS: ~75 MB (gunicorn + eventlet workers, no
# request-in-flight bloat). Real-workload peak on dashboard endpoints
# that read run_report.json + spawn contextvars per request stays
# below ~150 MB per audit. Cap at 256 MB gives 3.5× headroom over
# steady state and 1.7× over observed peak.
#
# Rationale for MemoryMax (hard OOM-kill) over MemoryHigh (soft
# throttle): systemd auto-restarts the service on OOM per its
# RestartSec policy; a runaway memory leak triggers a clean cycle
# instead of the whole VPS spiralling into swap thrash.
#
# See: [[deeper-cuts-audit-2026-07-16]] — "MemoryMax=infinity on ALL
# units on 4GB VPS (740MB free)". Steady-state process data from
# session-2026-07-17 audit round 2 confirmed no service exceeds
# 260 MB in current workload.

[Service]
MemoryMax=256M
