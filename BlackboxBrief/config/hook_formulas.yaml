# Hook Formulas — Proven engagement patterns for AI news content
#
# Each formula has:
#   - pattern: Template string with {placeholders}
#   - category: When to use (breaking, milestone, comparison, controversy, tutorial, prediction, reaction, curiosity)
#   - trigger_elements: What story elements activate this formula
#   - engagement_score: Baseline predicted engagement (0.0-1.0)
#   - max_words: Hard limit for Instagram readability
#   - examples: Real-world examples of this pattern working
#
# Placeholders:
#   {company}     — Company/org name (OpenAI, Google, Anthropic)
#   {product}     — Product name (GPT-5, Claude, Gemini)
#   {number}      — A specific number from the story (10x, 500M, 3B)
#   {metric}      — What the number measures (performance, users, parameters)
#   {claim}       — The core claim/announcement
#   {comparison}  — What it's being compared to (vs X, better than Y)
#   {topic}       — General topic noun phrase (2-4 words)
#   {short_title} — Shortened story title (≤6 words)

formulas:

  # ── BREAKING NEWS ────────────────────────────────────────
  - id: "BREAK_ANNOUNCE"
    pattern: "{company} Just Dropped {product}"
    category: "breaking"
    trigger_elements: ["company", "product"]
    engagement_score: 0.85
    max_words: 6
    examples:
      - "OpenAI Just Dropped GPT-5"
      - "Google Just Dropped Gemini 2.0"
      - "Anthropic Just Dropped Claude 4"

  - id: "BREAK_BOMBSHELL"
