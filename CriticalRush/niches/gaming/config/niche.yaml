niche_id: "gaming"
display_name: "CriticalRush"
channel_handle: "@criticalrush"
accent_color: "#f97316"
description: "Gaming content pipeline — game releases, esports, streaming culture"

brand_voice:
  tone: "energetic, community-insider, enthusiastic-analytical"
  forbidden_words: ["boring", "simply", "just", "easy", "basic"]
  hook_style: "community_reaction"

target_audience:
  primary: "PC and console gamers aged 18-34"
  secondary: "esports fans, game industry watchers, content creators"

feature_flags:
  # Short-video-maker Docker service. Enable after manual curl test.
  use_short_video_maker: false

  # 4-tier gaming clip sourcer (Steam → YouTube → Twitch → Pexels).
  # Enable after IGDB client is tested and TWITCH_CLIENT_ID is set.
  use_gaming_clip_sourcer: true

  # CrewAI multi-agent flows. Enable after crew files tested independently.
  use_crewai_flows: false

  # Live publishing to Instagram/YouTube/X/Facebook.
  # Enable only after all platform OAuth tokens are configured and tested.
  use_live_publishing: true
  platforms_enabled:
    - youtube
    - instagram
    - facebook
    - x_twitter
    - threads

  # TikTok-specific config
  tiktok:
    enabled: false
    audit_approved: false  # Set true once TikTok compliance audit passes — all posts SELF_ONLY until then
    daily_post_limit: 12   # Conservative — TikTok's actual limit is ~15, keep headroom
    posting_windows_utc: ["06:00", "12:00", "16:00"]

  # Threads-specific config
  threads:
    enabled: true
    daily_post_limit: 4

video_sourcing:
  strategy: trending_youtube
  niche_category: gaming
  max_age_hours: 48
  top_n_per_run: 15
  # 2026-06-28: raise from default 5 → 7. filter_gaming_stories.py:194 takes
  # the top N filtered stories before enrichment; with 5 as the cap, gaming
  # was hitting daily 'zero_blueprints' alerts when the top-3 trending all
  # happened to be already-published-this-week URLs (Overwatch + LoL hit
  # this on 2026-06-27). 7 gives push_to_backlog 2 extra survivors to
  # clear dedup. Default stays 5 in code so other niches unaffected.
  filter_top_n: 7
  # 2026-08-11 Option A game-name cooldown: reject any signal-only gaming
  # candidate (twitch_trending / steam_spike / rss — no video_id) whose
  # title matches a game published/scheduled within the last N days. Fixes
  # the LoL x10 / Fortnite x7 / Rust x3 repeat pattern surfaced in
  # class-of-bug-fetcher-schema-drift-from-downstream-contract.md. Only
  # applies to gaming because it's the only niche whose local fetchers
  # emit signal-only stories with game-name-as-title. Set to 0 to disable.
  # Video-bearing stories (real YT video_id) bypass this — they have
  # their own dedup key via video_id_dedup.
  game_name_cooldown_days: 7
  min_view_velocity: 200
  use_google_trends: true
  allow_keyword_search: true
  video_gate: require
  fallback_to_text_render: false
  composite_quality_gate:
    velocity_threshold: 600
    min_composite_score: 0.25

pipeline:
  stages:
    # Phase 0: Urgency classification
    - class: genlab_core.pipeline.stages.express_lane.ExpressLane

    # Phase 1: Ingestion
    - class: genlab_core.media.trending_video_fetcher.FetchTrendingVideos
      retries: 1
      retry_delay_seconds: 30
    - class: genlab_core.pipeline.stages.fetch_twitch_clips.FetchTwitchClips
      retries: 1
      retry_delay_seconds: 15
    - class: genlab_core.pipeline.stages.fetch_reddit_clips.FetchRedditClips
      retries: 1
      retry_delay_seconds: 15
    - class: genlab_core.pipeline.stages.fetch_steam_trailers.FetchSteamTrailers
      retries: 1
      retry_delay_seconds: 15
    - class: niches.gaming.stages.fetch_gaming_stories.FetchGamingStories
      retries: 1
      retry_delay_seconds: 30
    - class: niches.gaming.stages.filter_gaming_stories.FilterGamingStories
    # NOTE: PreDownloadDedup is deliberately EXCLUDED from gaming.
    # Gaming stories use recurring game/category URLs (Twitch "Just Chatting",
    # Steam "GTA V") that stay the same across daily fetches. URL-level dedup
    # would block ALL new clips for any game that was ever blueprinted.
    # Gaming relies on clip-level video_id dedup at PushToBacklog instead.
    #
    # 2026-06-28: PreflightDedup added BETWEEN filter and enrich. It mirrors
    # PushToBacklog's dedup logic (LIVE_OR_PENDING blocking + url_dedup_ttl_days
    # + title fuzzy match) so dedup-blocked candidates are dropped BEFORE the
    # ~280s enrich+render path runs on them. PushToBacklog stays as the final
    # authority — this is an optimisation, not a replacement. Opt-in per niche;
    # other niches keep current behaviour until calibrated.
    - class: genlab_core.pipeline.stages.preflight_dedup.PreflightDedup
    - class: niches.gaming.stages.enrich_with_igdb.EnrichWithIGDB
      retries: 1
      retry_delay_seconds: 15
    - class: niches.gaming.stages.extract_gaming_media.ExtractGamingMedia
      retries: 1
      retry_delay_seconds: 15
    - class: niches.gaming.stages.score_gaming_clips.ScoreGamingClips
    - class: genlab_core.pipeline.stages.video_gate.VideoGate
      # 2026-06-23 (PR #503): VideoGate's job is to MUTATE downstream
      # state (sets ``_skip_llm`` on clipless stories + drops them from
      # the active list). The 2026-06-23 outage was VideoGate crashing
      # on ``story_id=None`` mid-loop with fail_mode=continue — the
      # unset _skip_llm flag let clipless stories flow to render, which
      # burned 6 minutes producing 0 blueprints. Abort surfaces the
      # crash directly. Same reasoning is encoded in the shared
      # pipeline_template.yaml for the other 4 niches.
      fail_mode: abort

    # Phase 2: Content generation (migrated to shared path — Sprint 69)
    - class: niches.gaming.stages.gaming_writing.GamingWritingStrategy
      retries: 1
      retry_delay_seconds: 60
    - class: niches.gaming.stages.gaming_hooks.GamingHookStrategy
    - class: niches.gaming.stages.gaming_platform_adaptation.GamingPlatformAdaptationStrategy

    # Phase 2b: Monetization (Sprint 67 — was missing from gaming pipeline)
    - class: genlab_core.monetization.affiliate_matcher.AffiliateMatch

    # Phase 3: Quality gates
    - class: genlab_core.pipeline.stages.qc_gates.QCGates
      # 2026-06-23 (PR #503): same filter-stage abort reasoning as
      # VideoGate above — QC failures should surface, not silently let
      # unvalidated stories through to render. Matches the shared
      # pipeline_template.yaml for the other 4 niches.
      fail_mode: abort
    - class: genlab_core.pipeline.stages.virality_scoring.ViralityScoring

    # Phase 3b: Voice-over synthesis (PRE-render) — NARR-08 (2026-08-19).
    # Mirrors the backbone template hoist. ``RenderGamingVideo`` calls
    # ``apply_post_render_transformations`` (render_gaming_video.py:417),
    # whose Stage 1 audio_replacer is the only consumer of
    # ``media["audio_path"]`` — so the producer has to precede it here for
    # the same reason it does in pipeline_template.yaml. Gaming keeps its
    # own stage list, so the backbone edit does NOT reach it; without this
    # the hoist would silently apply to 4 niches of 5.
    #
    # Dependency check for THIS niche (not inherited from BB's): the reads
    # are stories / niche_config / content caption+hook / media durations.
    # GamingWritingStrategy (#13) and GamingHookStrategy (#14) both precede
    # this position, and nothing here is written by RenderGamingVideo or
    # RenderTextOverlays.
    #
    # NOTE: gaming cannot actually produce narration yet — its
    # ``blueprint_context`` at render_gaming_video.py:410 omits the four
    # NARR-01 keys that base_visual_render passes. Filed separately; this
    # edit fixes the ORDER so the wire works when it lands.
    - class: genlab_core.pipeline.stages.generate_audio.GenerateAudio

    # Phase 4: Rendering
    - class: niches.gaming.stages.render_gaming_video.RenderGamingVideo
      sandbox: true
      # P6 broader adoption (2026-06-19): primary render failure → abort.
      # Note: this requires SandboxAwareStageRunner to honor fail_mode
      # (added in the same PR as this YAML edit). Without that runner
      # change, fail_mode on a sandboxed stage would silently no-op.
      # Layered-effect stages keep fail_mode=continue.
      fail_mode: abort
    - class: genlab_core.pipeline.stages.render_text_overlays.RenderTextOverlays
      parallel_group: post_render
    # GenerateGamingAudio stays HERE, after the render, deliberately:
    # it reads ``media["rendered_path"]``
    # (generate_gaming_audio.py:113) and skips any story lacking one.
    # Hoisting it with the generic GenerateAudio would make it skip
    # every story silently — zero commentary, no error. It writes
    # ``commentary_audio_path``, a different key from the generic
    # stage's ``media["audio_path"]``, so the two never collide.
    - class: niches.gaming.stages.generate_gaming_audio.GenerateGamingAudio
      parallel_group: post_render
    - class: genlab_core.pipeline.stages.render_whisper_captions.RenderWhisperCaptions
      # Re-enabled 2026-06-05 after PR #55 wired the engine (the stage was
      # disabled while the two config-loading bugs blocked it; both fixed
      # now). Captions render WPM-timed and preserve source audio.
      enabled: true
    - class: genlab_core.pipeline.stages.validate_videos.ValidateVideos

    # Phase 5: Push to backlog (publishing handled by publisher-all LaunchAgent at 06:30 UTC)
    - class: genlab_core.pipeline.stages.push_to_backlog.PushToBacklog
      retries: 2
      retry_delay_seconds: 30
      # P6 adoption (2026-06-19): if PushToBacklog raises after retries
      # exhausted, abort — downstream FetchInsights/PerformanceLearner
      # have nothing to fetch if we couldn't persist the blueprint.
      fail_mode: abort
    # PublishGamingContent removed in Sprint 67 — gaming now uses the canonical
    # publisher-all LaunchAgent like all other niches, gaining:
    # - Dashboard approval gate
    # - Daily cap enforcement
    # - Affiliate CTA injection
    # - Consistent error handling and retry logic
    # Legacy bespoke publisher kept at niches/gaming/stages/publish_gaming_content.py

    # Phase 6: Analytics & Learning
    - class: genlab_core.pipeline.stages.fetch_insights.FetchInsights
    - class: genlab_core.pipeline.stages.performance_learner.PerformanceLearner
    - class: genlab_core.pipeline.stages.run_report.RunReport
  max_items_per_run: 10
  min_score_threshold: 0.20
  dedup_window_days: 7
  # URL-dedup TTL — gaming's `video_url` field stores Twitch directory
  # pages (`twitch.tv/directory/game/{game}`) and Steam store pages
  # (`store.steampowered.com/app/{id}`). These are immortal per game —
  # same URL every day for popular titles like Overwatch, GTA V, LoL.
  # Without TTL, every fresh trending fetch gets dedup-rejected against
  # prior-week published blueprints.
  #
  # 2026-06-28 — lowered from 7 → 3 days. Today's 04:00 UTC run
  # confirmed the structural ceiling: PreflightDedup (PR #623) correctly
  # blocked Overwatch + LoL + Sand:Raiders + MECCHA — but those WERE the
  # high-quality candidates with real Twitch/Steam gameplay clips
  # available. The 4 survivors (Stellar Blade™, Avatar Legends, CAPTAIN
  # TSUBASA, DF Direct Q+A) were pre-order trailers + discussion content
  # with no real gameplay → clip_sourcer correctly returned "no clip
  # found" → 0 blueprints. Cutting TTL to 3 lets the sticky-but-actually-
  # playable games republish every 3 days instead of weekly, accepting
  # slight feed repetition for steady cadence. Other niches
  # (anime/movies/ai_creators) have naturally-unique YouTube watch URLs
  # so they leave this unset (forever-dedup) — only gaming + sports use
  # this knob today.
  url_dedup_ttl_days: 3
