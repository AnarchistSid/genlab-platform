version: "3.9"

services:
  postgres:
    # pgvector image (superset of postgres:16) — required for the
    # product_embeddings table (vector(1536) + ivfflat) used by the affiliate
    # embedding matcher. Migration n4i5j6k7l8m9 skips that table when pgvector
    # is unavailable, so the engine still runs on a plain postgres, but prod
    # uses this image to enable it.
    image: pgvector/pgvector:pg16
    container_name: genlab-postgres
    environment:
      POSTGRES_USER: genlab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: genlab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genlab"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: genlab-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  pgdata:
