niche_id: "anime"
display_name: "FrameDrift"
channel_handle: "@theframedrift"
description: "Anime content pipeline — seasonal releases, manga adaptations, studio announcements, fan culture"

brand_voice:
  tone: "insider curator, warm, otaku-literate, community-driven"
  forbidden_words: ["cheap", "affordable", "buy now", "limited supply"]
  hook_style: "trend_observation"
  emoji_style: "selective"

target_audience:
  primary: "Anime fans 16-30, seasonal watchers + manga readers"
  secondary: "Anime-curious mainstream audience discovering new series"
  interests: ["anime", "manga", "seasonal anime", "studio announcements", "fan art", "cosplay"]
  platforms_primary: ["instagram", "youtube", "tiktok"]
  platforms_secondary: ["x", "threads", "facebook"]

accent_color: "#7B3FE4"

brand_sensitivity:
  protected_brands:
    - Studio Ghibli
    - MAPPA
    - ufotable
    - Toei Animation
    - Shueisha
    - Kadokawa
    - Aniplex
    - Bones
  pexels_query_rule: "Use generic descriptors only (anime, cosplay, manga)"

feature_flags:
  use_live_publishing: true
  platforms_enabled:
    - youtube
    - instagram
    - facebook
    - x_twitter
    - threads
  tiktok:
    enabled: false
    audit_approved: false
    daily_post_limit: 12
    posting_windows_utc: ["06:00", "12:00", "16:00"]
  threads:
    enabled: true
    daily_post_limit: 4

freshness:
  decay_half_life_hours: 24.0
  # 2026-06-15 audit T#63: bumped from 72h (3d) to 720h (30d). Viral
  # anime moments — fight scenes, voice-actor reveals, studio drops —
  # resurface for weeks via TikTok/IG/YT compilation channels; the 3d
  # gate was rejecting them at push_to_backlog. The declining_threshold
  # below (96h) still controls scoring decay separately, so older
  # stories will land lower in the queue without being hard-blocked.
  max_story_age_hours: 720  # 30 days
  trend_cycle_modes:
    emerging_window_hours: 24
    peak_window_hours: 72
    declining_threshold_hours: 96

video_sourcing:
  strategy: trending_youtube
  niche_category: anime
  # DECISIONS-0917 §2 — raise INTAKE, keep the bar. min_confidence stays 0.85.
  #
  # Measured 2026-09-17 on the 06:00 fire: 4 candidates fetched -> URL dedup
  # dropped 2 -> 2 stories -> 1 survived video validation -> 1 blueprint. The
  # funnel was never render-capped; it was starved at the top. top_n_per_run=15
  # was not binding, because the fetcher only ever returned 4.
  #
  # Both widened knobs are POOL knobs. The anime relevance gate
  # (sources.yaml relevance_threshold 0.35, the strictest niche because there is
  # no native YouTube category) is untouched -- rule #9 still holds, every
  # candidate must match anime keywords.
  #
  # 48 -> 96h: anime trends on a WEEKLY cycle, which this repo already knows --
  # see the dedup_window_days note below, "same shows trend across days as new
  # episodes drop". A 48h window throws away most of that cycle.
  # 100 -> 50 velocity: anime clips accrue views more slowly than gaming or
  # sports highlights; 100/h was borrowed from niches with native categories.
  max_age_hours: 96
  # 2026-09-21 — 15 -> 40. top_n_per_run truncates the candidate list
  # BEFORE the relevance gate runs, so the cap was being spent on rows the
  # next stage would reject. Measured on the live fetcher, same searches,
  # same keywords, same 301 quota units:
  #
  #   top_n   15   20   25   30   40   60
  #   kept     4    6   10   14   21   23    (pool exhausts at 42)
  #
  # The curve ACCELERATES, which is the tell: relevant candidates sit in
  # the tail. Ordering is by view velocity (the LLM niche-fit ranker was
  # down on the Anthropic credit error), and velocity floats Japanese-title
  # PVs to the front -- `TVアニメ『...』メインPV` scores 0.00 because every
  # positive keyword in sources.yaml is English or romaji. So the first 15
  # slots were being spent largely on rows the next stage would reject.
  #
  # 30 (-> 14 kept) rather than 40 (-> 21): gaming creates ~6 stories/day
  # and books 8 days, so 14 is ~2.3x the rate of a niche that is already
  # where anime needs to be. Enough to climb 1 -> 8 days in a few days
  # without a 21-blueprint burst, and every surplus candidate costs a hook
  # generation that may never publish -- belt is the only funded provider
  # right now. It is also self-limiting: as anime accumulates blueprints,
  # video_id dedup turns more of the pool into already-used and FRESH
  # falls without anyone touching this number.
  #
  # The DECISIONS-0917 note below says top_n=15 "was not binding, because
  # the fetcher only ever returned 4". That was true then and is not true
  # now -- the pool knobs widened there, plus the search-cache fix and
  # 3->6 keyword searches (871f39e3), took the pool to 42. The cap became
  # binding without anyone re-reading it.
  #
  # Why anime and not the other four: they all sit at 15, but theirs is 15
  # candidates ALREADY filtered by a native YouTube category (mostPopular
  # in cat 20/17/1/24), and their relevance bar is 0.20-0.25. Anime has no
  # native category, so its 15 are raw keyword hits facing the strictest
  # bar in the repo (0.35). Same cap, very different precision upstream.
  # This raises the POOL only -- rule #9 and the 0.35 threshold are
  # untouched, and no keyword was added to make more things "count".
  #
  # Costs no quota: `limit` truncates the returned list, it does not drive
  # search.list calls. Verified 301 units at both 15 and 60.
  top_n_per_run: 30
  min_view_velocity: 50
  use_google_trends: true
  allow_keyword_search: true
  video_gate: require
  fallback_to_text_render: false
  composite_quality_gate:
    velocity_threshold: 80
    min_composite_score: 0.15

# P4 (2026-06-20): opt in to the shared pipeline backbone.
pipeline_template: backbone

pipeline:
  inject:
    phase1_fetchers_extra:
      - class: genlab_core.pipeline.stages.fetch_anime_promos.FetchAnimePromos
        retries: 1
        retry_delay_seconds: 15

    phase1_content_research:
      - class: fd_strategies.content_research.AnimeContentResearchStrategy
        retries: 1
        retry_delay_seconds: 30
    phase1_scoring:
      - class: fd_strategies.scoring.AnimeScoringStrategy

    phase1_relevance_gate: []

    # Task #192 (2026-08-18): AI-backfill when the post-dedup pool is
    # dry. Flag-gated OFF by default — operator sets
    # GENLAB_ANIME_BACKFILL_NICHES=anime + GENLAB_ANIME_BACKFILL_MAX_PER_RUN=1
    # to enable. Currently OBSERVATION-only wire; the flag stays off
    # until the dedup fix (a7d1a8bf) is verified insufficient.
    phase1_post_dedup_backfill:
      - class: genlab_core.pipeline.stages.fetch_generated_backfill.FetchGeneratedBackfill
        retries: 0

    phase2_writing:
      - class: fd_strategies.writing.AnimeWritingStrategy
        retries: 1
        retry_delay_seconds: 60
    phase2_hooks:
      - class: fd_strategies.hooks.AnimeHookStrategy

    phase4_visual_render:
      - class: fd_strategies.visual_render.AnimeVisualRenderStrategy
        fail_mode: abort

    phase5_platform_adaptation:
      - class: fd_strategies.platform_adaptation.AnimePlatformAdaptationStrategy

  max_items_per_run: 10
  min_score_threshold: 0.20
  dedup_window_days: 7
  # Anime trending content cycles weekly (same shows trend across days
  # as new episodes drop). A 7-day title-similarity dedup window blocks
  # nearly every fetched candidate because the SHOW NAME repeats even
  # when the clip is genuinely different. 2-day window allows new
  # episodes/scenes of an ongoing show; URL/video_id dedup still
  # prevents true duplicates. See [[session-2026-06-12-deep-dive-findings]]
  # § B.9 — anime 0-blueprint days 2026-06-13 traced back here.
  title_dedup_days: 2
  # 2026-07-14 (video/dedup audit F3): default 3-day TTL matching
  # gaming/sports/movies. Prior state: absent → PreDownloadDedup
  # blocked URLs forever. Anime episode clips are the most seasonal —
  # a beloved episode moment can legitimately re-blueprint 3 days
  # apart when new remix compilations trend.
  url_dedup_ttl_days: 3

# ── capability budget (Part 32 §1) ──────────────────────────────────────────
# The ceiling on generated-asset spend for ONE reel. The storyboard's plan
# gate sums the registry's MEASURED cost for every call it intends to make
# and rejects the plan (`plan_over_budget:<sum> > <cap>`) before the first
# call, so nothing is spent discovering the plan was too expensive.
#
# Only possible because the costs are billed figures. The catalog could not
# back a cap: topaz/astra quotes "$0.0714/credit" (not a unit) and
# pixverse/extend quotes a range spanning 4.6x. A range does not sum.
#
# Measured 2026-09-21, a anime STILL reel: 1 tts + 7 still + 1 card +
# 1 music = $0.06604. The cap is ~4x that, so a reel can grow a few stills
# or a second card before it has to justify itself.
capabilities:
  max_generation_cost_usd: 0.25
