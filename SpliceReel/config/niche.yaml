niche_id: "movies"
display_name: "SpliceReel"
channel_handle: "@splicereel"
description: "Movies content pipeline — trailers, box office, cinema craft, film discourse"

brand_voice:
  tone: "cinephile, warm, curious, slightly reverent"
  forbidden_words: ["spoiler alert", "must-see", "epic", "amazing"]
  hook_style: "craft_observation"
  emoji_style: "minimal"

target_audience:
  primary: "Film enthusiasts aged 20-40"
  secondary: "Cinema craft fans, trailer watchers, streaming viewers"
  interests: ["films", "cinema craft", "trailers", "director interviews", "box office", "streaming"]
  platforms_primary: ["youtube", "instagram", "tiktok"]
  platforms_secondary: ["x", "facebook", "threads"]

accent_color: "#C9A84C"

feature_flags:
  use_live_publishing: true
  platforms_enabled:
    - youtube
    - instagram
    - facebook
    - x_twitter
    - threads
  tiktok:
    enabled: false
    audit_approved: false
    daily_post_limit: 12
    posting_windows_utc: ["06:00", "12:00", "16:00"]
  threads:
    enabled: true
    daily_post_limit: 4

freshness:
  decay_half_life_hours: 48.0
  # 2026-06-15 audit T#63: bumped from 96h (4d) to 1440h (60d).
  # Movies pipeline produced 0 blueprints/day for an unknown duration
  # because trailers from TMDB are routinely 30-60 days old (a film's
  # marketing cycle is longer than the news cycle). Per the existing
  # film_lifecycle_modes here: pre_release_days=30 means trailers can
  # surface ~30 days before release; long_tail_days=21 means viral
  # post-release clips resurface 21+ days after.
  max_story_age_hours: 1440  # 60 days
  film_lifecycle_modes:
    pre_release_days: 30
    opening_weekend_hours: 72
    long_tail_days: 21

video_sourcing:
  strategy: trending_youtube
  niche_category: movies
  max_age_hours: 48
  top_n_per_run: 15
  min_view_velocity: 200
  use_google_trends: true
  allow_keyword_search: true
  video_gate: require
  fallback_to_text_render: false
  composite_quality_gate:
    velocity_threshold: 400
    min_composite_score: 0.25

# P4 (2026-06-20): opt in to the shared pipeline backbone.
pipeline_template: backbone

pipeline:
  inject:
    phase1_fetchers_extra:
      - class: genlab_core.pipeline.stages.fetch_tmdb_trailers.FetchTMDBTrailers
        retries: 1
        retry_delay_seconds: 15

    phase1_content_research:
      - class: sr_strategies.content_research.MovieContentResearchStrategy
        retries: 1
        retry_delay_seconds: 30
    phase1_scoring:
      - class: sr_strategies.scoring.MovieScoringStrategy

    phase1_relevance_gate: []

    phase2_writing:
      - class: sr_strategies.writing.MovieWritingStrategy
        retries: 1
        retry_delay_seconds: 60
    phase2_hooks:
      - class: sr_strategies.hooks.MovieHookStrategy

    phase4_visual_render:
      - class: sr_strategies.visual_render.MovieVisualRenderStrategy
        fail_mode: abort

    phase5_platform_adaptation:
      - class: sr_strategies.platform_adaptation.MoviePlatformAdaptationStrategy

  max_items_per_run: 10
  min_score_threshold: 0.20
  dedup_window_days: 7  # consistent with other channels — prevent dedup saturation
  # Movies are theatrically released so the same trailer/clip TENDS to be
  # unique per movie — but franchise sequels share names ("Avengers 5",
  # "Dune Part 2", "Mission Impossible 8") and weekly box-office winners
  # cycle for a few days. 3-day title-similarity window allows different
  # clips/angles for the same movie without re-blueprinting the same
  # actual video (URL/video_id dedup handles that). See
  # [[session-2026-06-12-deep-dive-findings]] § B.9.
  title_dedup_days: 3
  # 2026-07-14 (video/dedup audit F3): default 3-day TTL matching
  # gaming (PR #627) + sports (line 152 in ClutchWire). Prior state:
  # absent → PreDownloadDedup blocked URLs forever. New trailer
  # drops for the same title within a week can now legitimately
  # re-blueprint (2-3 unique moments per movie's press tour).
  url_dedup_ttl_days: 3
