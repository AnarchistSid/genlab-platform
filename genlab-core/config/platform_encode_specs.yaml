# Platform encoding overrides — business-tunable layer on top of PLATFORM_SPECS.
#
# ⚠️  CURRENTLY INACTIVE (audit M-2, 2026-06-09). The loader
# ``video_compositor.load_platform_encode_overrides()`` is called only by
# tests; production reads PLATFORM_SPECS from ``ffmpeg.py`` directly. To
# activate this file, wire ``load_platform_encode_overrides()`` into the
# ``ffmpeg.py`` module load (apply YAML on top of PLATFORM_SPECS) — then
# ``standards.py`` will pick up the overrides automatically because it
# derives from PLATFORM_SPECS.
#
# Each key maps to a platform name. Only fields listed here override the
# built-in defaults in genlab_core.media.ffmpeg.PLATFORM_SPECS. Omitted
# fields inherit from the code defaults.
#
# Load with: load_platform_encode_overrides(Path("config/platform_encode_specs.yaml"))
#
# CRF guide:
#   Lower CRF = higher quality, larger file
#   Higher CRF = lower quality, smaller file
#   Platform minimums enforced in code (_MIN_REENCODE_CRF = 12)
#
# Presets (slower = better compression at same quality):
#   ultrafast, superfast, veryfast, faster, fast, medium, slow, slower, veryslow

youtube:
  codec: libx265
  crf: 18
  preset: slow

instagram:
  codec: libx264
  crf: 15
  preset: slow

tiktok:
  codec: libx264
  crf: 15
  preset: slow
  maxrate: "12M"
  bufsize: "24M"

facebook:
  codec: libx264
  crf: 17
  preset: medium

threads:
  codec: libx264
  crf: 15
  preset: slow

# ── Platform-optimized video durations ──────────────────────────────
# Completion rate is the #1 algorithm signal. Shorter = higher completion.
# The transcode step trims from the END (never the first 3s hook).
platform_durations:
  youtube:
    target_seconds: 25       # Sweet spot for Shorts completion rate
    max_seconds: 35
  instagram:
    target_seconds: 60       # IG now favors longer Reels (2025+)
    max_seconds: 90
  facebook:
    target_seconds: 45
    max_seconds: 60
  x_twitter:
    target_seconds: 30
    max_seconds: 45
  threads:
    target_seconds: 30
    max_seconds: 45
  tiktok:
    target_seconds: 25
    max_seconds: 34
