      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a close-up of a person's hands holding a premium smartphone, a blurred financial dashboard with abstract colored bars visible on screen, shallow depth of field"
    style_suffix: "Rich warm tones, shallow depth of field, magazine editorial photography, luxury business atmosphere. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

  creative:
    scene_templates:
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a digital artist's dual-monitor setup in a dim studio, vibrant AI-generated abstract artwork glowing on the screens, creative tools scattered on the desk"
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a close-up of a canvas showing AI-generated art blending into paint strokes, a stylus resting beside a glowing tablet, soft studio lighting"
    style_suffix: "Vibrant saturated colors, artistic mood, cinematic lighting with neon accent colors. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

  human_impact:
