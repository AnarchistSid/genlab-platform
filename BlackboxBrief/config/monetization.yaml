# Monetization configuration — affiliate links + newsletter CTAs
# Injected deterministically AFTER LLM content generation (no prompt pollution).
#
# Flow:
#   1. match_affiliate() checks blueprint story text + themes against triggers
#   2. If match found: inject affiliate link per platform (adapt_for_platforms.py)
#   3. write_post_content.py adds organic tool mention hint to LLM prompt
#
# Revenue model: affiliate commissions on AI tool signups + newsletter growth.
# All links use UTM tracking: ?utm_source=blackbox_brief&utm_medium={platform}&utm_campaign=ai_tools

# QB-FIX-01 F1 (2026-08-06): disabled pending disclosure-position rebuild.
# When true, push_to_backlog copies affiliate_* fields to the blueprint and
# calls cta_engine.inject_cta(). When false, both are skipped. Default off.
# NARR/MONETIZATION (2026-08-20): re-enabled, then DEFERRED for ai_creators only.
#
# The 2026-08-06 disable (4dd2ebb6) was "pending disclosure-position rebuild";
# that rebuild shipped as e790334c (2026-08-12, FTC disclosure at caption head
# — first 100 chars) and is enforced by
# tests/monetization/test_cta_disclosure_head_position.py. That blocking
# condition IS satisfied, and the other four niches went live on it today.
#
# ai_creators is held back for a different reason: BB is the narration canary
# and the subject of the #219 retention watch. Injecting affiliate CTAs into
# BB captions now would put a second treatment into the same window as the
# narrated launch, and #219 could not attribute retention movement to
# narration alone.
#
# DEFERRED: deferred until #218 closes + 7 days of narration-only #219
# baseline; re-enable condition: dated, per today's expiry-marker rule —
# practice what we just adopted.
#
# RE-ENABLE ON OR AFTER: 2026-08-29 (assumes #218 closes on the 2026-08-22
#   fire; if #218 slips, this date slips with it — the condition is
#   "#218 closed AND 7 clear days of narration-only baseline", not the
#   calendar date alone).
# COST OF WAITING: ~zero. BB's last affiliate-linked blueprint was 2026-05-19.
cta_injection_enabled: false

