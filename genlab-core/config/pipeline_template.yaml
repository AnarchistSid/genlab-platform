# P4 — Shared pipeline backbone (2026-06-20)
#
# This template defines the canonical stage ORDER and the common stages
# that 4 of 5 Gen Lab niches share (BlackboxBrief / ClutchWire /
# SpliceReel / FrameDrift). The 5th niche (CriticalRush gaming) keeps
# its own niche.yaml because its pipeline diverges substantially
# (custom fetchers + custom strategies under niches.gaming.stages.*).
#
# How niches use this
# ===================
# A niche.yaml opts in by setting ``pipeline_template: backbone`` at
# the top level. The niche then declares its niche-specific strategy
# class paths under ``pipeline.inject:`` — one entry per named inject
# point below. The loader (``niche_loader.merge_pipeline_template``)
# expands every ``inject:`` directive in this template with the
# niche's declared classes, producing the final ``pipeline.stages``
# list that ``pipeline_runner._load_stages`` consumes unchanged.
#
# Adding a shared stage (e.g. a new QC gate) becomes a one-line edit
# here instead of 4 simultaneous niche.yaml edits — the v1 motivation
# for this template (see PENDING-AS-OF-2026-06-19-truly-final.md
# Tier 1, P4).
#
# Backward compatibility
# ======================
# Niches without ``pipeline_template:`` set keep their existing
# ``pipeline.stages`` list verbatim — the loader short-circuits when
# the template directive is absent. Gaming stays on this path.
#
# Inject points (named insertion slots — niche fills each)
# ========================================================
# - phase1_fetchers_extra      — niche-specific ingestion fetchers
#                                (e.g. ScoreBat, TMDB, AnimePromos).
#                                Empty list when the niche has none.
# - phase1_content_research    — niche's ContentResearchStrategy class
# - phase1_scoring             — niche's ScoringStrategy class
# - phase1_relevance_gate      — optional extra filter stage (BB uses
#                                RelevanceGate; others leave empty)
# - phase1_post_dedup_backfill — optional stage inserted AFTER
#                                PreDownloadDedup and BEFORE
#                                DownloadTopVideos. Used by the anime
#                                canary to generate an AI backfill
#                                clip when the fetch pool comes up dry
#                                (task #192, 2026-08-18). Empty for
#                                niches that don't need backfill.
# - phase2_writing             — niche's WritingStrategy class
# - phase2_hooks               — niche's HookStrategy class
# - phase4_visual_render       — niche's VisualRenderStrategy class
# - phase5_platform_adaptation — niche's PlatformAdaptationStrategy class

pipeline:
  stages:
    # ── Phase 0: Urgency classification ──────────────────────────
    - class: genlab_core.pipeline.stages.express_lane.ExpressLane

    # ── Phase 1: Ingestion ────────────────────────────────────────
    - class: genlab_core.media.trending_video_fetcher.FetchTrendingVideos
      retries: 1
      retry_delay_seconds: 30

    # Niche-specific extra fetchers (ScoreBat / TMDB / AnimePromos /
    # whatever — empty when the niche only uses the trending fetcher
    # + Reddit). The inject list is spliced in at this position.
    - inject: phase1_fetchers_extra

    - class: genlab_core.pipeline.stages.fetch_reddit_clips.FetchRedditClips
      retries: 1
      retry_delay_seconds: 15

    # Niche-specific content research + scoring (always 1 class each).
    - inject: phase1_content_research
    - inject: phase1_scoring

    # BB-only: gate stories on relevance to ai_creators topics before
    # downloading. Other niches' relevance is enforced by their
    # ScoringStrategy and Reddit subreddit lists, so they leave this
    # inject empty.
    - inject: phase1_relevance_gate

    # Common dedup + download + verify-video before spending render time.
    #
    # PreDownloadDedup + VideoGate both abort on exception (2026-06-23,
    # P6 follow-up). Their entire job is to MUTATE downstream state via
    # setting flags (PreDownloadDedup drops dedup-rejected stories from
    # the active list; VideoGate sets ``story["_skip_llm"] = True`` for
    # stories without valid clips, AND drops _skip_llm stories from
    # ``context["stories"]``). If they raise mid-loop with the default
    # ``fail_mode: continue``, the unset flag silently fails open —
    # downstream stages then process corrupted state (rendering for
    # clipless stories, hook generation for unmarked ones, etc.) and
    # the pipeline produces 0 blueprints with no per-stage crash signal.
    # Exactly the 2026-06-23 outage shape PR #499 fixed reactively.
    #
    # Abort means: the run report's status becomes "failed" and the
    # operator sees the original traceback in the journal — not a
    # confusing 0-blueprints SLO violation 6 minutes later.
    - class: genlab_core.pipeline.stages.pre_download_dedup.PreDownloadDedup
      fail_mode: abort

    # Optional AI-backfill step: when the post-dedup story pool is
    # empty (or below the niche's threshold), generate a synthetic clip
    # via pruna/p-video and inject it. Currently used only by anime
    # (task #192). Niches without a backfill strategy leave this inject
    # empty — the stage does not run.
    - inject: phase1_post_dedup_backfill

    - class: genlab_core.media.download_top_videos.DownloadTopVideos
      retries: 1
      retry_delay_seconds: 30
    - class: genlab_core.pipeline.stages.video_gate.VideoGate
      fail_mode: abort

    # ── Phase 2: Content generation ───────────────────────────────
    - inject: phase2_writing
    - inject: phase2_hooks

    # ── Phase 4b: Affiliate matching ──────────────────────────────
    # (Numbered "4b" historically because it precedes QC but is
    # logically a Phase 4 concern. Keeping the historical naming.)
    - class: genlab_core.monetization.affiliate_matcher.AffiliateMatch

    # ── Phase 3: Quality gates ────────────────────────────────────
    # QCGates filters out _skip_llm + missing-required-field stories.
    # Same "filter-stage-aborts-on-exception" reasoning as VideoGate
    # above — a mid-loop crash would let unvalidated stories through
    # to render. Abort surfaces the real exception.
    - class: genlab_core.pipeline.stages.qc_gates.QCGates
      fail_mode: abort
    - class: genlab_core.pipeline.stages.virality_scoring.ViralityScoring

    # ── Phase 3b: Voice-over synthesis (PRE-render) ───────────────
    # NARR-05 (2026-08-19): GenerateAudio MUST run BEFORE
    # phase4_visual_render. The visual render calls
    # ``apply_post_render_transformations`` which reads
    # ``media["audio_path"]`` as ``narration_audio_path`` and builds
    # the NARR-01 3-input mix (source + music bed + VO). While this
    # stage sat in the ``post_render`` group it produced the VO four
    # stages AFTER its only consumer, so
    # ``transformation_orchestrator`` always saw ``None`` and silently
    # fell back to the legacy 2-input mix — every BB reel published
    # without narration despite ``[GenerateAudio] 1 generated`` in the
    # run report.
    #
    # Placed after QCGates + ViralityScoring deliberately: QCGates
    # drops ``_skip_llm`` / incomplete stories, so no TTS spend is
    # wasted on stories that never reach the renderer.
    #
    # Dependency evidence (2026-08-19): GenerateAudio's entire
    # read-set resolves at or before stage 11 — narration_script +
    # caption from the writer (base_writing.py:238,526), hook from
    # the hook strategy, clip duration from download_top_videos.py:720.
    # It reads nothing written by phase4_visual_render or
    # RenderTextOverlays. Pinned by
    # tests/pipeline/test_narration_stage_order.py.
    - class: genlab_core.pipeline.stages.generate_audio.GenerateAudio

    # ── Phase 4: Rendering ────────────────────────────────────────
    # Primary render — niches that want fail-fast on a missing video
    # should set ``fail_mode: abort`` on their visual_render inject
    # entry (per-niche operator judgment, P6 broader adoption).
    - inject: phase4_visual_render

    # Layered post-render effects — these keep fail_mode=continue
    # (a missing overlay is acceptable, missing primary video is not).
    - class: genlab_core.pipeline.stages.render_text_overlays.RenderTextOverlays
      parallel_group: post_render
    - class: genlab_core.pipeline.stages.render_whisper_captions.RenderWhisperCaptions
      # Re-enabled 2026-06-05 after PR #55 wired the engine. Niches
      # can override the per-stage ``enabled`` flag in their inject if
      # they need to disable captions specifically (e.g. anime which
      # ships subtitled clips).
      enabled: true
    - class: genlab_core.pipeline.stages.validate_videos.ValidateVideos

    # ── Phase 5: Publishing ───────────────────────────────────────
    - inject: phase5_platform_adaptation
    - class: genlab_core.pipeline.stages.push_to_backlog.PushToBacklog
      retries: 2
      retry_delay_seconds: 30
      # If PushToBacklog raises after retries exhausted, abort —
      # downstream FetchInsights/PerformanceLearner have nothing to
      # fetch if we couldn't persist the blueprint (P6, 2026-06-19).
      fail_mode: abort

    # ── Phase 6: Analytics & Learning ─────────────────────────────
    - class: genlab_core.pipeline.stages.fetch_insights.FetchInsights
    - class: genlab_core.pipeline.stages.performance_learner.PerformanceLearner
    - class: genlab_core.pipeline.stages.run_report.RunReport
