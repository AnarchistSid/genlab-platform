family: impact
status: built
sports: [ufc, boxing, kickboxing, mma, wrestling, hockey, rugby, nfl]
moment: contact
effects: [flame_aura, bolts, body_flash, debris, shockwave, drawing_flash, heat_shimmer]
palette:
  aura: [255, 62, 72]        # crimson, measured off the reference -- not amber
  bolt_core: [255, 118, 150] # PINK end to end: a white core has red-excess ~0 and
                             # is invisible to the statistic the gate is written in
  world_sat: 0.22
  ambient_red: 0.018
# Grade TARGETS, not multipliers. The multipliers are per source and are solved
# at render time against these numbers; WWE's 0.30 world_luma was solved for
# WWE's arena and lands nowhere on a brighter cage (UFC's ungraded corner luma
# is 81.7 against this reference's 32.9). "Match the reference's numbers" was
# always the rule -- these ARE the reference's numbers.
grade_targets:
  corner_luma: 32.93
  world_luma: 37.12
  subject_luma: 76.9
  subject_world_ratio: 2.07    # dim the world, light the subject
subject:
  second_person_is_noise: true
  min_person_px: 400
  # A METHOD, never a colour. The seed derivation finds *a* saturated garment;
  # the kit has to say WHOSE. Identity is decided once per window and held for
  # every annotation -- re-deriving per frame walked the aura onto the opponent
  # on 58 of 96 frames.
  selection:
    method: upright_on_last_frame     # the finisher is still standing
    upright_aspect: 1.2
    tie_break: motion_toward_other    # both upright -> the aggressor
    hold_across_annotations: true
drawing_flash:
  # Derived from THIS clip's contact frame at render time. No path may appear
  # here: a stored file is another clip's asset and would ship the wrong
  # fighter's likeness into every reel that uses this kit.
  source: derived_per_clip
  frame: contact
face_protected: true
beat: {bpm_range: [140, 170], events_on: [beat, half_beat], bolts_on: downbeat}
audio: {keep_commentary: true, bed_lufs: -15, commentary_lufs: -23}
source_preference:
  - close/cage-side broadcast cuts over wide hard-cam
  - rope-free chest on the hit frame
  - subject torso >= 180 px in source
rights:
  footage_allowed: true
  posture: official-channel RSS, in-frame attribution, stop rule on any claim
  hostile_holders: [ufc, wwe]
notes: >
  Proven end to end on WWE hard-cam, which is the WORST input for this kit:
  wide framing forced a 3.0x punch-in. UFC/boxing cage-side footage should need
  far less magnification and read better unchanged.

# ── Measured constants (RENDER-01 §1) ────────────────────────────────────────
# Every number here came from measuring a specific artifact. The comment names
# it, so a future change can re-measure rather than re-guess.
measured:
  full_bleed_floor_1080p: 1.7778   # 1920/1080: widest crop that still fills
                                   # 1080x1920. Bit three times before it was
                                   # named. It is a FUNCTION of source height --
                                   # 720p needs 2.667x -- so code derives it.
  torso_box_target: 0.465          # reference VFX edit; UFC official 0.474,
                                   # WWE hard-cam 0.172 (the rejected input)
  torso_floor: 0.30                # below this a clip is not an ACTION input
  aura_band_subject_frac: 0.251    # band width as a share of SUBJECT height,
                                   # from CONTENT-15. Cap by frame-width share:
                                   # this transferred fine at 1.78x and became
                                   # 40% of frame width at 2.50x.
  aura_band_frame_width_cap: 0.114 # reference's own band as a share of frame
  matte_feather_px: 18             # 34 hid a jagged birefnet edge; SAM2's edge
                                   # is clean, so 18 is enough
  matte_area_band: [0.12, 0.55]    # in CROP space. Above 0.55 the tracker has a
                                   # garment, not a person.
  subject_vote_frames: 10          # a rule that flips with a 33ms shift is not
                                   # a rule; majority over the last N frames
  subject_vote_min_margin: 0.80
  subject_body_area_floor: 0.04    # a silhouette smaller than this is residue
  flash_finish_tolerance_frames: 3
  drawing_pose_iou_gate: 0.60      # wrong-fighter floor measured at 0.291;
                                   # self-IoU 1.000, scale-invariant to 0.986
  drawing_max_tries: 3             # then NO drawing: a missing flash beats a
                                   # flash showing a different fight
  tail_live_frames: 12             # the segment ends on the footage
  aura_fade_frames: 6
  quiet_run_max_s: 0.80
  cuts_per_s_band: [0.33, 1.50]    # REEL scope only. A SEGMENT is one shot by
                                   # selection (zero cuts is a criterion).
  bpm_period_note: "150 BPM = exactly 12 frames at 30fps; ask the generator for
    a tempo whose period is a whole number of frames and the grid is integer"

# ── Port 4 effect constants (RENDER-01) ──────────────────────────────────────
# Distinct from `effects:` above, which lists which effects this kit RUNS.
# These are their measured parameters, each carrying the artifact it came from.
# A number without a source is a guess wearing a decimal point.
effect_constants:
  world_luma_target:   {value: 37.1,  source: "reference KiIKPGdvNSE, hit window"}
  subject_luma_target: {value: 76.9,  source: "reference KiIKPGdvNSE, hit window"}
  contrast_ratio:      {value: 2.07,  source: "subject/world on the same frames"}
  world_sat:           {value: 0.22,  source: "CONTENT-15 grade solve"}
  subject_sat:         {value: 1.15,  source: "CONTENT-15 grade solve"}
  ambient_red:         {value: 0.018, source: "cage/ropes survive as red shapes, not black"}
  # DEFAULT ONLY -- vignette is solved per clip alongside world/subject luma.
  # UFC-05 solved 0.30 for its source; WWE v6 ran 0.62. A renderer that cannot
  # override this cannot reproduce either reel but its own.
  vignette_amt:        {value: 0.30,  source: "ACTION-UFC-04 solve; WWE used 0.62"}
  feather_px:          {value: 18,    source: "34 hid a jagged birefnet edge; SAM2 edge is clean"}
  band_w:              {value: 0.251, source: "reference band width / subject height"}
  band_frame_cap:      {value: 0.1135, source: "reference band / frame width — the invariant that survives a shot-size change"}
  band_peak:           {value: 0.085, source: "reference peak position / subject height"}
  peak_frame_cap:      {value: 0.0385, source: "reference peak / frame width"}
  core_luma:           {value: 125,   source: "reference white-hot core"}
  intensity_exponent:  {value: 4.2,   source: "grid search vs the reference's four band numbers"}
  scroll_px_s:         {value: 250.0, source: "CONTENT-12 upward scroll"}
  displace_px:         {value: 34.0,  source: "two-octave turbulence amplitude"}
  aura_gain:           {value: 0.78,  source: "grid search"}
  white_px:            {value: 8.0,   source: "core radius at full white"}
  bloom_mix:           {value: 0.26,  source: "grid search"}
  limb_weight:         {value: 0.7,   source: "torso 1.0 / limbs 0.7 — CONTENT-12"}
  inner_spill_px:      {value: 18.0,  source: "aura bleeding INTO the body"}
  inner_spill_amount:  {value: 0.30,  source: "a glow stopping at the silhouette is a sticker"}
  # 1.95 is what EVERY approved render used: both v10_build.py and w2_build4.py call
  # mega_bolt() without len_per_h, taking its signature default. Its docstring claims
  # 0.834 ("the reference's largest component") and the port first shipped THAT -- the
  # sentence rather than the code -- for bolts 2.34x shorter than anything approved.
  # Whether 0.834 is the better value is an open question for the operator, not a
  # change to make inside a port.
  bolt_len_per_h:      {value: 1.95,  source: "v8_look.mega_bolt default; the value every approved render ran"}
  bolt_core_px:        {value: 14,    source: "reference mean thickness 69 px at scale"}
  bolt_glow_px:        {value: 60,    source: "reference glow extent"}
  bolts_per_strike:    {value: 2,     source: "1-2 per strike; 3 read as a cage"}
  bolt_afterglow:      {value: 0.45,  source: "1 frame after the 2-frame stroke"}
  debris_count:        {value: 150,   source: "CONTENT-12"}
  debris_mat_frac:     {value: 0.45,  source: "share of particles that are grey mat rather than hot orange"}
  debris_life_frames:  {value: [20, 38], source: "15-25f visible after masking behind the subject"}
  flash_halo:          {value: 0.85,  source: "v6_look.body_flash: orange halo screened around the flashing body"}
  flash_frames:        {value: 2,     source: "matte to white"}
  shimmer_frames:      {value: 10,    source: "after the hit"}
  fast_blur_px:
    value: 12.0
    source: px both approved builds pass to motion_blur on the frames before the finish
  fast_px:             {value: 12,    source: "centroid motion that earns trails"}
  trail_opacities:     {value: [0.35, 0.20, 0.10], source: "3 ghosts"}
  bloom_thresh:        {value: 0.85,  source: "highlights only"}
  bloom_hot_frac:      {value: 0.055, source: "damp when the frame is already 5.5% hot"}
  head_halo:           {value: 0.4,   source: "halo resumes below the jaw"}
