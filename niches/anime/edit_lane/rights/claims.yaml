# ---------------------------------------------------------------------------
# Franchise probes, 2026-09-26. Each is a 20 s excerpt of an OFFICIAL clip,
# framed the way the lane frames it, uploaded private. API reading only --
# blocks and territories. Claimant/asset/match type still need the Studio step.
# Every reading below waited for uploadStatus=processed AND three unchanged
# polls: ds_tv read 0 blocked for 405 s while still "uploaded" and only flipped
# to 1 once processed, so an early read is not a reading.

probes:

  - id: PRB-001
    franchise: demon_slayer
    scope: tv_series
    source: "Demon Slayer: Entertainment District Arc — Crunchyroll XoJCOAU_72U"
    upload: vOqtI9ngVQ0
    blocked_count: 1
    territories: [RU]
    verdict: USABLE
    finding: >
      THE FILM AND THE TV SERIES HAVE DIFFERENT POLICIES. The Infinity Castle
      film is blocked globally (CLM-001, Aniplex visual). The TV series draws a
      single-territory block. Russia-only matches the shape of CLM-005 (Sony
      Music Japan, LiSA theme) rather than a visual block -- the Studio step
      should confirm which, because "the franchise is hostile" was wrong as a
      franchise-level statement.

