# Consumed by genlab_core.media.VideoCompositor via VisualConfig
# Shared structural standards — all 5 channels use identical values

niche_id: ai_creators
logo_path: "assets/logos/blackbox_brief.png"
accent_color: "#00D4FF"  # Blackbox Brief cyan

# Structural standards (identical across all channels)
top_bar_height_pct: 0.24
bottom_bar_height_pct: 0.34
hook_font_size: 44
hook_x_offset: 24
logo_height_px: 60
logo_x_offset: 24
bar_color: [0, 0, 0]
hook_color: [255, 255, 255]
landscape_mode: "blurred_pillarbox"
platforms_vertical: ["instagram", "youtube", "tiktok", "threads", "facebook", "twitter"]
platforms_landscape: []

# Frame layout is defined in genlab_core/media/frame_compositor.py (source of truth).
# See frame_compositor.py constants for current pixel positions.


# FFmpeg render settings
ffmpeg:
  preset: medium            # target preset for quality (veryslow|slow|medium|fast|ultrafast)
  fallback_preset: fast   # used if render exceeds timeout
  timeout_seconds: 600    # max seconds for FFmpeg subprocess


# Word-by-word caption animation
#
# 2026-07-22: whisper_sync CANARY on ai_creators only (this file) —
# rest of the 5 niches stay disabled. All 3 checklist items from the
# 2026-06-13 audit shipped:
#   1. text_optimizer restored (inlined at word_animator.py:21-46)
#   2. render_whisper_captions.py:231 passes text_type="caption" (was "hook")
#   3. Regression pin ships at
#      genlab-core/tests/rendering/test_whisper_caption_canvas_bounds.py
#      — 9 parametric cases assert caption bottom_y <= 1920 for texts
#      up to the audit's canonical overflow crash-case.
# Rollback: flip back to `enabled: false` and restart the affected pipeline
# service. Historical audit context preserved in
# [[session-2026-06-13-render-audit-findings]].
animation:
  word_by_word:
    whisper_sync:
      enabled: true  # 2026-07-22 CANARY — ai_creators only
      model_size: "base"
      fallback: "wpm"
      silence_threshold_db: -40
      skip_tts_when_audio: true
      min_confidence: 0.3
      ab_test:
        enabled: false   # flip to true when ready to measure
        wpm_control_pct: 0.30  # 30% of stories get WPM as control group


# Channel branding (used by FrameCompositor for text overlays)
branding:
  channel_name: "BlackboxBrief"
  handle: "@blackbox.brief"
  logo_path: "assets/logos/blackbox_brief.png"
  accent_color: "#00D4FF"


# Intelligent Transformation (PR 1-16 sprint, 2026-07-05)
# Multi-dimensional bandit-driven render choices per publish.
# Activated on prod 2026-07-05. Repo synced to match 2026-07-08 to
# stop the recurring stash-pop-on-deploy dance (task #520 activation
# state now reflected in main). See memory:
# intelligent-transformation-architecture-2026-07-05.
intelligent_transform:
  enabled: true  # per-niche activation; GENLAB_INTELLIGENT_TRANSFORM_ENABLED env also required
  dimensions:
    music_mood:
      enabled: true
      moods: [electronic, ambient_tech, focused, upbeat, cinematic, contemplative, tech_hype]
      source: pixabay
      source_audio_duck_db: -12
      music_bed_db: -6
    caption_style:
      enabled: true
      styles: [word_by_word, hormozi_yellow, karaoke, minimal, meme]
      default_pacing_ms: 750
    hook_framing:
      enabled: true
      framings: [question_open, statistic_shock, contrarian_take, curiosity_gap, jump_cut_visual, story_open, pov_frame, pattern_break]
    intro_animation:
      enabled: true
      # QB-FIX-01 F3d-1 (2026-08-06): 'none' registered as a bandit arm; the
      # orchestrator special-cases it as skip-intro. force_none defaults true
      # so the bandit's pick is overridden and every render skips the intro
      # (audit F3c: 2.5s intro was consuming the first 12% of a 21s reel,
      # entirely inside the swipe-decision window per Section 1.1 row 4).
      # Set force_none: false to A/B test intros again — real assets remain.
      templates: [logo_zoom, logo_tagline_reveal, pattern_break_intro, none]
      asset_dir: assets/motion/intros
      force_none: true
    outro_cta:
      enabled: true
      styles: [follow, comment, save, share, question]
      asset_dir: assets/motion/outros
    pan_zoom:
      enabled: true
      patterns: [ken_burns_slow, punch_in, jump_cut, no_motion, dolly]
    highlight_moment:
      enabled: true
      methods: [llm_pick, audio_peak, motion_peak, first_frame]
      # 2026-07-09 (task #630, evening): bumped 12 → 16.
      # Task #617 bumped 8→12 assuming intro (~3s) + outro (~3s) would
      # close the gap to 15s min. But live-fire showed motion_compositor
      # silently skips intro/outro for many renders — transformed output
      # ends up exactly at window_seconds (12.01s), below the 15s guard,
      # and post_render_transform discards arm_ids_by_dimension. Bumping
      # to 16s makes HighlightMoment ALONE clear the 15s guard — arm
      # attribution flows even when motion_compositor fails silently.
      # Trade-off: the trim is 4s longer than optimal for reaction pace,
      # but arm attribution restoration is the far bigger lever right
      # now (weeks of dormant learning were caused by the 12s config).
      # Real fix (deferred): motion_compositor.py intro/outro pipeline
      # reliability. See post_render_transform.py:216 comment.
      window_seconds: 16
    audio_ducking:
      enabled: true
      levels_db: [-9, -12, -15]
    music_visual_sync:
      enabled: true
      modes: [beat_cut, ambient, none]
    caption_emphasis_color:
      enabled: true
      colors: [yellow, red, cyan, gradient, none]
    caption_pacing:
      enabled: true
      pacing_ms_options: [600, 700, 800, 900]
