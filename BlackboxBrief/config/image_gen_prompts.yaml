      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a person interacting with a sleek digital interface, blurred city skyline through a floor-to-ceiling window behind them"
    style_suffix: "Clean tech editorial style, neutral tones with blue accent lighting, professional authority. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

