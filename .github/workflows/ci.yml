name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-genlab-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: genlab_test
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --package genlab-core
      - name: Run tests
        env:
          DATABASE_URL: postgresql://genlab:test@localhost:5432/genlab_test
          GENLAB_USE_POSTGRES: "true"
        run: |
          uv run --package genlab-core pytest genlab-core/tests/learning/ -q --tb=short
          uv run --package genlab-core pytest genlab-core/tests/writing/ -q --tb=short
          uv run --package genlab-core pytest genlab-core/tests/pipeline/ -q --tb=short

  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: dashboard/frontend
        run: npm ci
      - name: Type check
        working-directory: dashboard/frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: dashboard/frontend
        run: npm run build
