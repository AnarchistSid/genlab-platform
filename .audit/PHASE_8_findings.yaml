        (iii) git-blind in-place writers             (A-0012+A-0020+A-0023 → A-0082)
        (iv) line-exists-doesn't-fire               (A-0026+A-0062+A-0072 → A-0083)
        (v)  hook-configured-but-not-enforced       (A-0072 — sub-case of iv)
  claim: >
    Meta-observation from doing the audit: 5 recurring shapes of bug appeared multiple
    times, several caught only after the second or third instance. Phase 9 methodology
    ledger inherits this taxonomy so it's carried into any future audit. Prevention
    lens: each class has a general-purpose detection heuristic (below).
  blast_radius: >
    Zero (this is observation, not finding-for-fix). Prevention heuristics:
    (i) any durable-state file: also write a `_last_success` marker; alert on
