# Storage backend routing — which engine serves each table.
#
# Valid values: "sharepoint", "postgres".
# Default: "sharepoint" if a table is not listed here.
#
# Sprint 64: PostgreSQL backend is production-ready (verified full CRUD).
# Blocked from full migration by asyncpg + Python 3.14 segfault in test suite.
# Set GENLAB_USE_POSTGRES=true in .env to enable Postgres for production.
# Tests will always use SharePoint mocks (conftest.py removes DATABASE_URL).

tables:
  Stories: sharepoint
  Blueprints: sharepoint
  Templates: sharepoint
  Assets: sharepoint
  Sources: sharepoint
  Publishing_Analytics: sharepoint
  Analytics: sharepoint
  AB_Tests: sharepoint
  Content_Memory: sharepoint
  PendingEngagement: sharepoint
  PendingFeedback: sharepoint
  BanditArms: sharepoint
  Audience_Snapshots: sharepoint
