niche_id: "sports"
display_name: "ClutchWire"
channel_handle: "@theclutchwire"
description: "Sports content pipeline — live scores, highlights, clutch moments"

brand_voice:
  tone: "urgent, electric, insider, punchy"
  forbidden_words: ["allegedly", "reportedly", "perhaps", "might", "could be"]
  hook_style: "emotional_reaction"
  emoji_style: "strategic"

target_audience:
  primary: "Sports fans aged 18-34"
  secondary: "NBA, NFL, Premier League, UFC enthusiasts, highlights watchers"
  interests: ["NBA", "NFL", "Premier League", "UFC", "clutch moments", "sports highlights"]
  platforms_primary: ["instagram", "youtube", "tiktok"]
  platforms_secondary: ["x", "facebook", "threads"]

accent_color: "#FF2040"

feature_flags:
  use_live_publishing: true
  platforms_enabled:
    - youtube
    - instagram
    - facebook
    - x_twitter
    - threads
  tiktok:
    enabled: false
    audit_approved: false
    daily_post_limit: 12
    posting_windows_utc: ["06:00", "12:00", "16:00"]
  threads:
    enabled: true
    daily_post_limit: 4

video_sourcing:
  strategy: trending_youtube
  niche_category: sports
  max_age_hours: 48
  top_n_per_run: 15
  # Fix #5 of the autonomy roadmap (2026-06-13). Pre-fix sports
  # conversion was 884 stories → 50 published in 60d (5.7%, vs gaming
  # 43.4%). Sports has three ingestion stages (YouTube + ScoreBat +
  # Reddit) plus the shared content_pool, so the upstream supply was
  # ~4× any other niche. Raising min_view_velocity from 200 → 400
  # halves the YouTube candidates that pass the upstream filter while
  # keeping all the real-trending content. Combined with the Reddit
  # per_sub_limit cut in sources.yaml, this should bring sports'
  # 60-day story count from ~884 down to ~250 with same published
  # output (~50) → conversion 20%.
  min_view_velocity: 400
  use_google_trends: true
  allow_keyword_search: true
  video_gate: require
  fallback_to_text_render: false
  composite_quality_gate:
    velocity_threshold: 400
    # Bumped 0.25 → 0.32 — same rationale as min_view_velocity above.
    # The strong-signal items still clear (sports YouTube max view count
    # in 60d = 13,126 plays — way above any reasonable threshold) while
    # the long-tail wisecrack/edutainment clips that drove the 32-blueprint
    # reject pile (noted in sources.yaml content_filter comments) get
    # pre-culled at the composite stage instead of human-review.
    min_composite_score: 0.32

pipeline:
  stages:
    # Phase 0: Urgency classification
    - class: genlab_core.pipeline.stages.express_lane.ExpressLane

    # Phase 1: Ingestion
    - class: genlab_core.media.trending_video_fetcher.FetchTrendingVideos
      retries: 1
      retry_delay_seconds: 30
    - class: genlab_core.pipeline.stages.fetch_scorebat.FetchScoreBatHighlights
      retries: 1
      retry_delay_seconds: 15
    - class: genlab_core.pipeline.stages.fetch_reddit_clips.FetchRedditClips
      retries: 1
      retry_delay_seconds: 15
    - class: cw_strategies.content_research.SportContentResearchStrategy
      retries: 1
      retry_delay_seconds: 30
    - class: cw_strategies.scoring.SportScoringStrategy
    # Early dedup: drop stories whose URL/video_id already has an active
    # blueprint BEFORE we spend 5+ min downloading + rendering them.
    - class: genlab_core.pipeline.stages.pre_download_dedup.PreDownloadDedup
    - class: genlab_core.media.download_top_videos.DownloadTopVideos
      retries: 1
      retry_delay_seconds: 30
    - class: genlab_core.pipeline.stages.video_gate.VideoGate

    # Phase 2: Content generation
    - class: cw_strategies.writing.SportWritingStrategy
      retries: 1
      retry_delay_seconds: 60
    - class: cw_strategies.hooks.SportHookStrategy

    # Phase 3: Quality gates
    # Phase 4b: Affiliate matching
    - class: genlab_core.monetization.affiliate_matcher.AffiliateMatch

    - class: genlab_core.pipeline.stages.qc_gates.QCGates
    - class: genlab_core.pipeline.stages.virality_scoring.ViralityScoring

    # Phase 4: Rendering
    - class: cw_strategies.visual_render.SportVisualRenderStrategy
    - class: genlab_core.pipeline.stages.render_text_overlays.RenderTextOverlays
      parallel_group: post_render
    - class: genlab_core.pipeline.stages.generate_audio.GenerateAudio
      parallel_group: post_render
    - class: genlab_core.pipeline.stages.render_whisper_captions.RenderWhisperCaptions
      # Re-enabled 2026-06-05 after PR #55 wired the engine (the stage was
      # disabled while the two config-loading bugs blocked it; both fixed
      # now). Captions render WPM-timed and preserve source audio.
      enabled: true
    - class: genlab_core.pipeline.stages.validate_videos.ValidateVideos

    # Phase 5: Publishing
    - class: cw_strategies.platform_adaptation.SportPlatformAdaptationStrategy
    - class: genlab_core.pipeline.stages.push_to_backlog.PushToBacklog
      retries: 2
      retry_delay_seconds: 30

    # Phase 6: Analytics & Learning
    - class: genlab_core.pipeline.stages.fetch_insights.FetchInsights
    - class: genlab_core.pipeline.stages.performance_learner.PerformanceLearner
    - class: genlab_core.pipeline.stages.run_report.RunReport
  max_items_per_run: 10
  min_score_threshold: 0.20
  dedup_window_days: 7  # Sports has 435 stories — tighter window to prevent starvation
  # Sports has multiple distinct clips per game ("Curry 3-pointer", "LeBron
  # dunk", "Mahomes TD pass" — all from the same game might use the team
  # name in the title). 3-day title window allows different moment-clips
  # from the same game/team without re-blueprinting the same actual video.
  title_dedup_days: 3
