# Maximum posts published per platform per niche per UTC calendar day.
# DailyCapEnforcer filters by niche_id, so this is per-niche.
# Rule: 1 reel per channel per day (CLAUDE.md) + 1 retry headroom.
# Sprint 67: Reduced from 5 to 2 to enforce 1-per-day discipline.
daily_post_cap:
  instagram: 2
  youtube: 2
  facebook: 2
  tiktok: 1
  twitter: 2
  threads: 2

cap_timezone: "UTC"
