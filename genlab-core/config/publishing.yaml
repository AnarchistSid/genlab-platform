# Blackbox Brief (ai_creators) publishing configuration — all 6 platforms
# Canonical location: genlab-core/config/publishing.yaml

niche_id: ai_creators

platforms:
  instagram:
    enabled: true
    account_id: ""  # Set via BLACKBOXBRIEF_META_IG_USER_ID env var
    schedule_slots:
      - "12:00"
  youtube:
    enabled: true
    channel_id: ""  # Set via BLACKBOXBRIEF_YOUTUBE_CHANNEL_ID env var
    schedule_slots:
      - "12:00"
  facebook:
    enabled: true
    page_id: ""  # Set via BLACKBOXBRIEF_META_FB_PAGE_ID env var
    schedule_slots:
      - "12:00"
  x_twitter:
    # Disabled 2026-06-06: see ClutchWire/config/publishing.yaml — no creds,
    # 100% SKIPPED, negligible engagement everywhere. (Missed in PR #65 — that
    # PR's edit to this symlink target was lost during a rebase.)
    enabled: false
    account_id: null
    schedule_slots:
      - "12:00"
  threads:
    # Disabled 2026-06-06: see ClutchWire/config/publishing.yaml — 100%
    # container-creation failures since tokens expired; engagement was
    # near-zero for ai_creators. (Missed in PR #65 — same rebase loss.)
    enabled: false
    account_id: null
    schedule_slots:
      - "12:00"
  tiktok:
    enabled: false
    account_id: null

daily_post_cap: 1
publish_window_utc: "06:30"
retry_window_utc: "10:00"
