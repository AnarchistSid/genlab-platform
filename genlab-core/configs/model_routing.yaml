# configs/model_routing.yaml
# Multi-provider model routing by pipeline task type.
# Uses genlab_core.llm.router for dispatch (Anthropic, OpenAI, Google).
#
# Tier pricing (Q1 2026):
#   CREATIVE (Haiku): $1.00/$5.00 per M tokens — hooks, narration, engagement
#   BULK (GPT-4o-mini): $0.15/$0.60 per M tokens — scoring, classification
#   VIDEO (Gemini Flash): $0.15/$0.60 per M tokens + $0.005/60s video
#   NANO (GPT-4.1-nano): $0.10/$0.40 per M tokens — trivial extraction

default_model: "claude-haiku-4-5-20251001"

task_routing:
  # CREATIVE tier — audience-facing, quality-critical
  # BB (ai_creators) writing upgraded to Sonnet: Haiku defaults to flat
  # "X just Y" hooks despite prompt engineering. Sonnet follows creative
  # constraints much better. Cost delta: ~$0.04/day ($1.20/month).
  write_ai_creators_content: "claude-sonnet-4-6"
  generate_hooks: "claude-haiku-4-5-20251001"
  hook_generation: "claude-haiku-4-5-20251001"
  score_hook_quality: "claude-haiku-4-5-20251001"
  write_post_content: "claude-haiku-4-5-20251001"
  narration_script: "claude-haiku-4-5-20251001"
  engagement_reply: "claude-haiku-4-5-20251001"

  # BULK tier — internal processing (GPT-4o-mini, 85% cheaper)
  generate_script: "gpt-4o-mini"
  generate_captions: "gpt-4o-mini"
  adapt_for_platforms: "gpt-4o-mini"
  affiliate_matching: "gpt-4o-mini"
  content_scoring: "gpt-4o-mini"
  source_relevance: "gpt-4o-mini"
  enrich_metadata: "gpt-4o-mini"
  summarise_article: "gpt-4o-mini"

  # NANO tier — trivial extraction (GPT-4.1-nano, cheapest)
  extract_game_name: "gpt-4.1-nano"
  classify_content_type: "gpt-4.1-nano"

  # VIDEO tier — Gemini Flash for video input
  video_analysis: "gemini-2.5-flash"

budget_fallbacks:
  expensive_to_mid: "gpt-4o-mini"
  mid_to_cheapest: "gpt-4.1-nano"
