- id: A-0025
  phase: 2
  host: vps
  title: "Hardcoded prod DB password 'genlab_***' in shell scripts (pg_backup.sh + verify_policy_block_l1.sh) — coordinate rotation with Phase 5"
  category: security
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "grep -nE ''PGPASSWORD|postgresql://'' /opt/genlab/scripts/pg_backup.sh"'
      host: vps
      output: |
        19:DB_URL="${DATABASE_URL:-postgresql://genlab:genlab_***@localhost:5432/genlab}"
        26:PGPASSWORD="$DB_PASS" pg_dump -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" "$DB_NAME" | gzip > "$BACKUP_FILE"
    - command: 'ssh genlab-prod "grep -cE ''PGPASSWORD=g***'' /opt/genlab/scripts/verify_policy_block_l1.sh"'
      host: vps
      output: |
        3
    - command: 'ls -la /Users/anarchistsid/GenLab/.audit/snapshots/verify_policy_block_l1.sh; grep -c REDACTED /Users/anarchistsid/GenLab/.audit/snapshots/verify_policy_block_l1.sh'
      host: mac
      output: |
        -rw-r--r--  1 anarchistsid  staff  1183 29 Jul 16:35 /Users/anarchistsid/GenLab/.audit/snapshots/verify_policy_block_l1.sh
        3
  claim: >
    /opt/genlab/scripts/pg_backup.sh line 19 has a hardcoded DSN fallback with the prod DB
    password 'genlab_***' in plaintext. /opt/genlab/scripts/verify_policy_block_l1.sh has
    3 occurrences of PGPASSWORD=genlab_***. Both scripts live in the tracked /opt/genlab/
    tree — either currently in git (pg_backup.sh, verified with git ls-files) or scheduled
    for commit-or-delete (verify_policy_block_l1.sh, uncommitted VPS-only — snapshot in
    .audit/snapshots/ redacted, not pushed).
  blast_radius: >
    Anyone with read access to the VPS filesystem or the git repo has the prod DB
    password. The default in pg_backup.sh line 19 is designed as a "works if DATABASE_URL
    is unset" fallback — but if DATABASE_URL IS set correctly (which it is, per the .env
    inventory), the fallback never executes. So it's a dead fallback carrying a live
    secret. verify_policy_block_l1.sh has no such fallback logic — always hardcoded.
    Rotation must happen before deletion (else next backup fails); Phase 5 owns the
    rotation coordination.  I introduced a same-session exposure into .audit/snapshots/
    by grabbing the file without pre-redacting — mitigated by redaction + gitignore, but
    logged as execution error #6 for the methodology ledger.
  effort: M
  proposed_action: fix
  supersedes: []

- id: A-0026
  phase: 2
  host: vps
  title: "pg_backup.sh 14-day retention prune not firing — 20 files, oldest 15 days old (supersedes A-0014 with correct script name)"
  category: waste
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "sed -n ''3p;29p'' /opt/genlab/scripts/pg_backup.sh"'
      host: vps
      output: |
        # Retains last 14 days of gzipped SQL dumps.
        find "$BACKUP_DIR" -name "genlab_*.sql.gz" -mtime +14 -delete
    - command: 'ssh genlab-prod "systemctl cat genlab-pg-backup.service --no-pager | grep ExecStart"'
      host: vps
      output: |
        ExecStart=/bin/bash /opt/genlab/scripts/pg_backup.sh
    - command: 'ssh genlab-prod "ls /opt/genlab/.backups/genlab_*.sql.gz | wc -l; ls /opt/genlab/.backups/genlab_*.sql.gz | head -1; ls /opt/genlab/.backups/genlab_*.sql.gz | tail -1"'
      host: vps
      output: |
        20
        /opt/genlab/.backups/genlab_20260714_0630.sql.gz
        /opt/genlab/.backups/genlab_20260729_0630.sql.gz
  claim: >
    /opt/genlab/scripts/pg_backup.sh is the script the genlab-pg-backup.timer actually
    runs (not backup_db.sh, which was A-0014's mistaken subject). Its retention logic
    (`find "$BACKUP_DIR" -name "genlab_*.sql.gz" -mtime +14 -delete`) is wired but
    evidently not executing — 20 files present, oldest from 2026-07-14 (15 days ago),
    should have been pruned by today's run.
  blast_radius: >
    Small absolute: 20 files × ~17 MB = 340 MB on a 38 GB disk. But this is the same
    class-of-bug shape as A-0026 was originally A-0014: the script *claims* retention
    ("Retains last 14 days" comment, and a `find -delete` line), but reality doesn't
    match. Two hypotheses for why: (a) find -delete needs write permission on the dir,
    and the genlab user is the owner but SELinux/AppArmor could deny; (b) the timer's
    working directory differs from expectations so BACKUP_DIR resolves elsewhere on some
    runs; (c) the script errors before line 29 on some runs (previous pg_dump failure)
    leaving pruning skipped. Phase 4's runtime why-not-firing gets the definitive answer.
  effort: S
  proposed_action: investigate
  supersedes: [A-0014]

