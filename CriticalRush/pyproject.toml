[project]
name = "criticalrush"
version = "0.1.0"
description = "Unified niche content runner — gaming pipeline"
requires-python = ">=3.12"
dependencies = [
    "genlab-core[engagement]>=0.1.0",
    "xgboost>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32.0",
    # 2026-06-08: bumped from stable (2026.3.17) to the latest nightly to
    # pick up SABR-only-streaming workarounds + GVS PO Token handling.
    # Stable was failing 100% of YouTube downloads with:
    #     "ios client https formats require a GVS PO Token"
    #     "Some android client https formats have been skipped... SABR-only"
    # The dev channel ships SABR fixes before stable. If a future deploy
    # needs to roll back, the working-but-broken stable was 2026.3.17.
    "yt-dlp>=2026.6.6.234447.dev0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "tenacity>=8.2",
    "numpy>=1.24",
    "scipy>=1.11",
    "opencv-python-headless>=4.8",
    "Pillow>=12.1.1",
    "librosa>=0.10",
]

[project.optional-dependencies]
media = [
    "google-api-python-client>=2.100",
    "imagehash>=4.3",
    "faster-whisper>=1.0",
]

[tool.uv.sources]
genlab-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["niches", "core", "tools"]
