# AI Story Background Generation — Prompt Templates
#
# Topic-aware prompt templates for generating contextual hero images.
# Each story is matched to a topic via infer_story_tags() from
# compose_blueprints.py, then the corresponding scene templates
# are used to build the OpenAI gpt-image-1 prompt.
#
# Two scene_templates per topic (wide shot + close-up):
#   - attempt=0 picks scene_templates[0]
#   - attempt=1 picks scene_templates[1] (fallback if first fails quality)
#
# {entity_context} placeholder: filled with entity-specific hint when
# a KNOWN_COMPANIES entity is detected in the title, otherwise empty string.
#
# Imported by: execution/utils/image_gen_client.py

# ═══════════════════════════════════════════════════════════════
# Default fallback — used when no topic tag matches
# ═══════════════════════════════════════════════════════════════
default:
  scene_templates:
    - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a futuristic AI server room with rows of glowing blue LED racks, shallow depth of field, smoke wisps catching the light"
    - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}an abstract neural network visualization with glowing nodes and connections against a deep navy background, macro photography style"
  style_suffix: "Photorealistic, high-end magazine quality, dramatic cinematic lighting, 4K detail. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

# ═══════════════════════════════════════════════════════════════
# Per-topic templates — keyed on tags from infer_story_tags()
# ═══════════════════════════════════════════════════════════════
topics:
