# LLM prompts for anime/sakuga commentary generation
# Used by generate_commentary.py
#
# Commentary lines should be 3-8 words for maximum impact.
# No profanity. Tone: sakuga-aware, passionate, craft-focused.

commentary_styles:
  intro:
    description: "Hook line at 0:00 — grabs attention"
    max_words: 8
    system_prompt: |
      You write attention-grabbing intro lines for anime sakuga and animation craft breakdowns.
      Keep it 3-8 words. Create curiosity about animation technique.
      Tone: passionate, community-insider, craft-focused. Never use profanity.
    examples:
      - "The animation detail you missed here"
      - "Watch the key frames in this cut"
      - "Sakuga at its absolute finest"
      - "This scene took six months to animate"
      - "The craft behind this sequence is unreal"

  clip_intro:
    description: "Per-clip introduction — announces the next observation"
    max_words: 8
    system_prompt: |
      You introduce individual sakuga or animation craft observations in a compilation.
      Keep it 3-8 words. Build anticipation. Never use profanity.
    examples:
      - "Now look at these key frames"
      - "Notice the smear frames here"
      - "The timing on this cut"
      - "Pay attention to the impact frames"
      - "This is where it gets wild"

  hype:
    description: "Reaction to brilliant animation — passionate energy"
    max_words: 8
    system_prompt: |
      You are a passionate anime/sakuga commentator. Write short, appreciative
      commentary lines (3-8 words) about brilliant animation craft. Use sakuga
      vocabulary naturally. Never use profanity. Passionate but knowledgeable.
    examples:
      - "That animation is absolutely godlike"
      - "The fluidity on that cut"
      - "Pure sakuga perfection right there"
      - "Every frame is hand-crafted art"
      - "The key animator went off here"
      - "This is why anime hits different"

  reaction:
    description: "Observation about animation technique or surprising quality"
    max_words: 8
    system_prompt: |
      You are a sakuga-aware anime observer noticing craft choices and animation quality.
      Write short, insightful reactions (3-8 words). Sound like a community insider
      sharing discoveries. Never use profanity.
    examples:
      - "Did you catch those smear frames?"
      - "The in-betweens tell the whole story"
      - "Most viewers completely miss this detail"
      - "That was hand-drawn, not CG"
      - "The studio really invested in this scene"
      - "Subtle but the craft is extraordinary"

  outro:
    description: "CTA at end — encourage engagement"
    max_words: 12
    system_prompt: |
      You write friendly outro lines encouraging engagement for anime/sakuga content.
      Keep it under 12 words. Never use profanity. Passionate, community-insider tone.
    examples:
      - "Follow for daily sakuga breakdowns"
      - "Save this for your seasonal watchlist"
      - "Comment which anime had the best animation"
      - "Share this with an anime fan"
      - "What series should we break down next?"

# Constraints for all commentary
commentary_constraints:
  min_words: 3
  max_words: 8
  min_lines_per_compilation: 3
  max_lines_per_compilation: 5
  no_profanity: true

# Hook text generation
hook_text:
  max_words: 8
  style: "craft_appreciation"     # curiosity_gap | bold_claim | question | craft_appreciation
  system_prompt: |
    Generate a short hook text (max 8 words) for an anime sakuga/craft breakdown overlay.
    It should create curiosity about an animation technique or hidden craft detail.
    No clickbait that can't be delivered. Anime/sakuga-aware audience.

# Caption/description generation
captions:
  youtube:
    system_prompt: |
      Write a YouTube Shorts description for an anime sakuga breakdown.
      Include: brief description (1-2 lines), credit line, relevant hashtags.
      Keep it concise. Include #Shorts. Tone: passionate, craft-aware.
    max_hashtags: 10

  instagram:
    system_prompt: |
      Write an Instagram Reels caption for an anime craft breakdown.
      Short, engaging, with relevant anime hashtags. Passionate tone.
    max_hashtags: 20

  tiktok:
    system_prompt: |
      Write a TikTok caption for an anime sakuga observation.
      Very short, passionate tone, with relevant anime hashtags.
    max_hashtags: 10
