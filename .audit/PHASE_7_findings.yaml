- id: A-0072
  phase: 7
  host: mac
  title: "A-0055 CORRECTED — gitleaks IS in .pre-commit-config.yaml (v8.24.3), but the 2026-07-22 commit introduced 3× PGPASSWORD=genlab_*** anyway. Hook exists but doesn't fire (same class as A-0026/A-0062)"
  category: security
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'grep -B1 -A3 gitleaks .pre-commit-config.yaml'
      host: mac
      output: |
        - repo: https://github.com/gitleaks/gitleaks
          rev: v8.24.3
          hooks:
            - id: gitleaks
    - command: 'git log --all --oneline -S gitleaks -- .pre-commit-config.yaml | head -3'
      host: mac
      output: |
        abfadd3b fix: complete public-readiness remediation (34 issues)
    - command: 'git log --all --oneline -S genlab_*** | head -3'
      host: mac
      output: |
        abfadd3b fix: complete public-readiness remediation (34 issues)
        0cae735a feat(ops): verification timer for 4 unverified 2026-07-22 fixes
        ea7dd8c7 docs(plans): land 61 historical sprint plans + reports
  claim: >
    gitleaks v8.24.3 is present in `.pre-commit-config.yaml`, added in commit
    `abfadd3b fix: complete public-readiness remediation`. The commit that introduced
    the 3× `PGPASSWORD=genlab_***` lines in `verify_policy_block_l1.sh` is `0cae735a
    feat(ops): verification timer for 4 unverified 2026-07-22 fixes` — which happened
    AFTER gitleaks was in the pre-commit config. Yet the commit succeeded. Either
    (a) `pre-commit install` was never run on the operator machine that made
    `0cae735a`, (b) the commit used `--no-verify`, or (c) gitleaks was scoped narrowly
    enough to miss the pattern (unlikely — `PGPASSWORD=` is textbook). CI-side enforcement
    (workflow-level gitleaks run on push) not verified this session.
  blast_radius: >
    Class-of-bug: **hook configured but not enforced**. Same shape as A-0026/A-0062
    (`find -mtime -delete` line exists but doesn't fire) and A-0060 (dashboard auth
    exists but no RBAC). The security posture the config appears to establish is
    illusory if the enforcement layer (git commit hook, CI workflow) doesn't actually
    block. Fix path: (a) add `pre-commit install` to operator onboarding + CI-side
    check that `pre-commit run --all-files` passes on push; (b) audit `.github/workflows/`
    to confirm gitleaks runs there too — pre-commit hooks are opt-in per developer, CI
    is mandatory. Corrects A-0055's diagnosis ("no hook exists"); the finding upgrades
    from "install a hook" to "enforce the hook that exists."
  effort: M
  proposed_action: fix
  supersedes: [A-0055]

- id: A-0073
  phase: 7
