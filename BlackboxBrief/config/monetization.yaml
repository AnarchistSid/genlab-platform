newsletter:
  platform: "beehiiv"
  publication_name: "Blackbox Brief"
  signup_url: "https://blackboxbrief.beehiiv.com/subscribe"
  cta_templates:
    - "Get the full breakdown in our free newsletter: {signup_url}"
    - "Want the tools and workflows? Subscribe to Blackbox Brief: {signup_url}"
    - "Daily AI breakdowns in your inbox: {signup_url}"
  include_in:
    - "youtube_description"
    - "twitter_thread_final"

link_in_bio:
  service: "beacons"
  url: "https://beacons.ai/blackboxbrief"
  items:
    - label: "Free Newsletter"
      url: "https://blackboxbrief.beehiiv.com/subscribe"
    - label: "AI Prompt Pack ($9)"
      url: "https://blackboxbrief.gumroad.com/l/ai-prompts"
  ig_cta: "Link in bio for {tool_name} and more AI tools"
  fallback_ig_cta: "Link in bio for free AI tools"

# Platform-specific injection rules
injection_rules:
  youtube:
    location: "description_end"
    format: "\n\n{cta_text}: {link}\n\n{newsletter_cta}"
    max_links: 2
  instagram:
    location: "caption_end"
    format: "\n\n{link_in_bio_cta}"
    max_links: 0  # No clickable links in IG captions
  twitter:
    location: "first_reply"
    format: "{cta_text}: {link}"
    max_links: 1
  facebook:
    location: "caption_end"
    format: "\n\n{cta_text}: {link}"
    max_links: 1
