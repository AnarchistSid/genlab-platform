# Engagement poller configuration — all niches × platforms
# Used by scripts/run_engagement_poller.py --niche all
#
# YouTube + Twitter: polled via run_engagement_poller.py
# Facebook + Instagram: handled via Meta webhooks (webhook_receiver.py)
# Threads: polled when access tokens are provisioned

pollers:
  ai_creators:
    youtube:
      channel_id: ""  # Set via BLACKBOXBRIEF_YOUTUBE_CHANNEL_ID env var
    twitter:
      user_id: ""  # Set via BLACKBOXBRIEF_X_USER_ID env var
    threads:
      user_id: ""  # Set when Threads access token is provisioned

  gaming:
    youtube:
      channel_id: ""  # Set via CRITICALRUSH_YOUTUBE_CHANNEL_ID env var
    twitter:
      user_id: ""  # Set via CRITICALRUSH_X_USER_ID env var
    threads:
      user_id: ""  # Set when Threads access token is provisioned

  sports:
    youtube:
      channel_id: ""  # Set via CLUTCHWIRE_YOUTUBE_CHANNEL_ID env var
    twitter:
      user_id: ""  # placeholder until X developer app provisioned
    threads:
      user_id: ""  # placeholder

  movies:
    youtube:
      channel_id: ""  # Set via SPLICEREEL_YOUTUBE_CHANNEL_ID env var
    twitter:
      user_id: ""  # placeholder until X developer app provisioned
    threads:
      user_id: ""  # placeholder

  anime:
    youtube:
      channel_id: ""  # Set via FRAMEDRIFT_YOUTUBE_CHANNEL_ID env var
    twitter:
      user_id: ""  # placeholder until X developer app provisioned
    threads:
      user_id: ""  # placeholder
