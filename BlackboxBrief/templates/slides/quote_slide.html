<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<style>
{% include 'base.css' %}

/* Quote slide — centered statement with large quotation marks.
 * Uses hero image background like all other slides.
 * Medium overlay to let some image show through behind the quote.
 */
.quote-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(10, 10, 15, 0.55) 0%,
    rgba(10, 10, 15, 0.72) 30%,
    rgba(10, 10, 15, 0.88) 60%,
    rgba(10, 10, 15, 0.96) 100%
  );
  z-index: 1;
}

.quote-layout {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100%;
  padding: 140px 80px 120px 80px;
  text-align: center;
}

.quote-mark {
  font-size: 160px;
  font-weight: 900;
  line-height: 0.6;
  color: rgba(var(--accent-rgb), 0.25);
  margin-bottom: 24px;
  font-family: Georgia, 'Times New Roman', serif;
}

.quote-text {
  font-size: 48px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text-primary);
  max-width: 85%;
  margin-bottom: 32px;
}

.quote-body {
  font-size: 36px;
  font-weight: 400;
  line-height: 1.5;
  color: rgba(240, 240, 240, 0.85);
  max-width: 85%;
}

.quote-source {
  margin-top: 28px;
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 0.03em;
}
</style>
</head>
<body>

<div class="slide">

  {# -- Hero image background -- #}
  {% if hero_image_url %}
  <div class="hero-bg" style="background-image: url('{{ hero_image_url }}');"></div>
  <div class="quote-overlay"></div>
  {% else %}
  <div class="glow-accent" style="top: 20%; left: -80px; opacity: 0.05;"></div>
  <div class="glow-accent" style="bottom: 15%; right: -100px; width: 300px; height: 300px; opacity: 0.04;"></div>
  {% endif %}

  <div class="content-layer">

    {# -- Top bar -- #}
    <div class="top-bar">
      <div></div>
      <div class="slide-indicator">{{ slide_number }}/{{ slide_total }}</div>
    </div>

    {# -- Quote block -- #}
    <div class="quote-layout">
      <div class="quote-mark">&ldquo;</div>
      <div class="quote-text">{{ slide_title }}</div>
      {% if slide_body %}
      <p class="quote-body">{{ slide_body }}</p>
      {% endif %}
    </div>

    {# -- Bottom bar -- #}
    <div class="bottom-bar">
      <span class="brand-handle">{{ brand_handle }}</span>
    </div>

  </div>

</div>

</body>
</html>
