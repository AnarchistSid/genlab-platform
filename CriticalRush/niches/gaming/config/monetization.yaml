# consumed by code — add them when there is real gaming affiliate inventory
# to describe rather than inventing placeholders now.

# Re-enabled alongside the other four niches. The 2026-08-06 disable
# (4dd2ebb6) was explicitly "pending disclosure-position rebuild"; that
# rebuild shipped as e790334c (2026-08-12, FTC disclosure at caption head —
# first 100 chars), enforced by tests/monetization/
# test_cta_disclosure_head_position.py (85 tests green at flip time).
cta_injection_enabled: true
