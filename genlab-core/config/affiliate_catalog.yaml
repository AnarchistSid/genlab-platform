# Affiliate Product Catalog — GenLab Revenue Engine
# Each niche has curated products with multi-network affiliate URLs.
# The AffiliateMatch pipeline stage matches content keywords to products
# and selects the network with the highest commission.
#
# To add a product: add an entry under the niche's products list.
# To update an affiliate URL: change the url under the relevant network.
# placeholder URLs below — replace with real affiliate links.

settings:
  max_affiliate_posts_per_day: 3    # out of 5 daily posts, max 3 get affiliate links
  default_network_priority:
    - earnkaro
    - cuelinks
    - vcommission
    - amazon
  disclosure_text:
    instagram: "#affiliate"
    youtube: "This description contains affiliate links — we may earn a small commission at no extra cost to you."
    facebook: "#affiliate"
    twitter: ""
    threads: ""

