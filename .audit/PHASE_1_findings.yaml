- id: A-0013
  phase: 1
  host: vps
  title: "genlab user's $HOME is the repo root (/opt/genlab) — every home-writing tool pollutes the deploy dir"
  category: ops
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "getent passwd genlab"'
      host: vps
      output: |
        genlab:x:996:986::/opt/genlab:/usr/sbin/nologin
    - command: 'ssh genlab-prod "sudo -u genlab -H bash -c \"echo \\\$HOME\""'
      host: vps
      output: |
        /opt/genlab
    - command: 'ssh genlab-prod "ls -la /opt/genlab/.npm /opt/genlab/.local /opt/genlab/.cache /opt/genlab/.genlab 2>&1 | head -8"'
      host: vps
      output: |
        drwxrwxr-x  4 genlab genlab 4096 Jun 26 11:55 /opt/genlab/.npm/
        drwxrwxr-x  4 genlab genlab 4096 (…)          /opt/genlab/.local/
        drwxr-xr-x  8 genlab genlab 4096 Jun  1 09:37 /opt/genlab/.cache/
        drwxr-xr-x  ?                                 /opt/genlab/.genlab/
  claim: >
    The `genlab` service account is configured with `/opt/genlab` as its home directory.
    Every tool that assumes $HOME is user territory (npm, pip's cache, ssh keys,
    application state files) writes into what is simultaneously the repository root.
    Observed clutter: .npm/, .local/, .cache/, .genlab/, .youtube_cookies.txt,
    .threads_tokens.json, .conformal_router_state.json, etc.
  blast_radius: >
    Not a functional failure — the tools work correctly. But it creates a permanent
    pollution surface that makes drift audits harder (every audit has to distinguish
    "repo state" from "tool cache" from "prod runtime state"). It also creates minor
    security concerns: SSH keys or npm auth tokens written to $HOME land in the repo dir,
    increasing accidental-commit risk. Standard fix: give the service account a separate
    home (/var/lib/genlab or similar) and reference the repo via `WorkingDirectory=` only.
    Cost: one-time migration of dot-files, systemd unit updates, verify no code hardcodes
    /opt/genlab/.something.
  effort: L
  proposed_action: defer
  supersedes: []

- id: A-0014
  phase: 1
  host: vps
  title: "DB backup retention broken — script documents 'kept last 7', actual has 20 .sql.gz files (156.9 MiB)"
  category: waste
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "grep -iE \"retention|days|find.*mtime|cleanup\" /opt/genlab/scripts/backup_db.sh"'
      host: vps
      output: |
        echo "[backup] Retention: kept last 7 backups"
    - command: 'ssh genlab-prod "find /opt/genlab/.backups -maxdepth 1 -name \"*.sql.gz\" | wc -l; find /opt/genlab/.backups -maxdepth 1 -name \"*.sql.gz\" -printf \"%s\n\" | awk \"{s+=\\$1} END{printf \\\"%.1f MiB\\n\\\", s/1024/1024}\""'
      host: vps
      output: |
        20
        156.9 MiB
    - command: 'ssh genlab-prod "ls -la /opt/genlab/.backups/*.sql.gz | head -3 && echo ... && ls -la /opt/genlab/.backups/*.sql.gz | tail -3"'
      host: vps
      output: |
        -rw-r--r--  1 genlab genlab 16719891 Jul 14 06:30 genlab_20260714_0630.sql.gz
        -rw-r--r--  1 genlab genlab 16811914 Jul 14 15:38 genlab_20260714_1538.sql.gz
        -rw-r--r--  1 genlab genlab 16811773 Jul 14 15:40 genlab_20260714_1540.sql.gz
        ...
        -rw-r--r--  1 genlab genlab  4964180 Jul 27 06:30 genlab_20260727_0630.sql.gz
        -rw-r--r--  1 genlab genlab  4634260 Jul 28 06:30 genlab_20260728_0630.sql.gz
        -rw-r--r--  1 genlab genlab  4727896 Jul 29 06:30 genlab_20260729_0630.sql.gz
  claim: >
    /opt/genlab/scripts/backup_db.sh echoes "Retention: kept last 7 backups" at end of
    each run, but there is no `find -mtime -delete` or equivalent in the script; the
    retention message is a lie. As of 2026-07-29 there are 20 .sql.gz files spanning
    15 days. The oldest is from 2026-07-14 (there are 3 backups from that day —
    likely one scheduled + two manual test runs).
  blast_radius: >
    Small in absolute terms: 156 MiB on a 38 GB disk. But two class-of-bug concerns:
    (a) same shape ("script echoes retention message, does not actually prune") likely
    applies to the visuals/ backup writer — 3.5 GB versus 156 MiB (finding A-0015);
    (b) if a rollout ever produces a DB backup format change, the oldest still-retained
    file becomes a compatibility trap the restore-test service won't catch.
  effort: S
  proposed_action: fix
  supersedes: []

- id: A-0015
  phase: 1
  host: vps
  title: ".backups/visuals/ occupies 3.5 GB (14 days retained); no restore consumer verified — only DB-backup restore test exists"
  category: waste
  severity: S2
  confidence: medium
  tags: [STATIC_ONLY]
  evidence:
    - command: 'ssh genlab-prod "du -sh /opt/genlab/.backups/visuals; find /opt/genlab/.backups/visuals -maxdepth 1 -type d | head -5"'
      host: vps
      output: |
        3.5G	/opt/genlab/.backups/visuals
        /opt/genlab/.backups/visuals
        /opt/genlab/.backups/visuals/2026-07-15
        /opt/genlab/.backups/visuals/2026-07-16
        /opt/genlab/.backups/visuals/2026-07-17
        /opt/genlab/.backups/visuals/2026-07-18
    - command: 'ssh genlab-prod "systemctl cat genlab-backup-test.service --no-pager 2>&1 | head -20"'
      host: vps
      output: |
        # (Unit description: 'weekly backup-restore dry-run validation')
        # ExecStart runs the DB restore test on the most-recent .sql.gz — does not
        # verify visual assets in .backups/visuals/
    - command: 'ssh genlab-prod "systemctl cat genlab-visual-backup.service --no-pager 2>&1 | grep -E \"ExecStart|Description\""'
      host: vps
      output: |
        Description=GenLab visual asset backup — daily rendered .mp4 snapshot
        ExecStart=/opt/genlab/scripts/backup_visuals.sh
  claim: >
    A daily timer writes rendered .mp4s (mostly under 15 MB each) into
    /opt/genlab/.backups/visuals/YYYY-MM-DD/... . 14 days accumulate to 3.5 GB, 30% of
    the current free-disk budget. The DB backup-restore-test service does NOT exercise
    the visual backups. Whether anything ever restores from them (operator ad-hoc? no
    documented workflow observed) is unverified — STATIC_ONLY.
  blast_radius: >
    If visual backups are never restored, this is 3.5 GB of pure waste on a 12-GB-free
    disk. If they *are* restored (e.g., after a botched render, operator pulls yesterday's
    good .mp4 from .backups/visuals/), deleting them is a real regression path. The
    right answer is not "delete" — it's "identify the workflow, then set retention that
    matches it." Phase 4 can grep the pipeline code for `.backups/visuals/` reads;
    absence of reads promotes this to S2/high-confidence and enables reduction.
    Split per §0.3 v1.1: the disk-pressure fact is verified (S2); the no-consumer
    claim is STATIC_ONLY and capped at S3 by itself — carried as a joint S2/medium here
    because the pressure fact is the load-bearing one.
  effort: M
  proposed_action: investigate
  supersedes: [A-0009]

