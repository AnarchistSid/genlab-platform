    template_ids: []
    engagement_weight: 0.86

  # ═══════════════════════════════════════════════════════════
  # CONSEQUENCE / STAKES — best for breaking news, urgency
  # ═══════════════════════════════════════════════════════════
  - id: MID_WHY_MATTERS
    text: "And this is why it matters..."
