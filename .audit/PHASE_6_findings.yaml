- id: A-0064
  phase: 6
  host: vps
  title: "Redis has no memory ceiling (maxmemory=0B, policy=noeviction) — writes fail on OOM. On shared 4 GB VPS this is a class-of-bug risk"
  category: performance
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "docker exec genlab-redis redis-cli info memory | grep -E ''used_memory_human|maxmemory''"'
      host: vps
      output: |
        used_memory_human:1.93M
        maxmemory_human:0B
        maxmemory_policy:noeviction
    - command: 'ssh genlab-prod "docker exec genlab-redis redis-cli info stats | grep -E ''keyspace_hits|keyspace_misses|evicted_keys''"'
      host: vps
      output: |
        evicted_keys:0
        keyspace_hits:48822
        keyspace_misses:9354
  claim: >
    Redis is configured with no memory ceiling (`maxmemory=0B` means unlimited) and
    `noeviction` policy (writes will FAIL when Redis exhausts VM memory). On a 4 GB
    VPS shared with `aspirehub` project (A-0067), a runaway (dramatiq queue backup,
    aggressive engagement poll) can grow Redis to whatever RAM is available then start
    failing writes silently. Current usage 1.93 MB (fine), hit rate 83.9% (good), no
    evictions ever (because no ceiling).
  blast_radius: >
    Silent failure when Redis fills. Since GenLab uses Redis for the dramatiq job queue
    (per systemd unit inventory), a Redis OOM stops task processing without a clean
    error message. Fix: `maxmemory 256mb` + `maxmemory-policy allkeys-lru` in
    docker-compose.yml. Cost: 30 seconds config change, one restart.
  effort: S
  proposed_action: fix
  supersedes: []

- id: A-0065
  phase: 6
  host: vps
  title: "Anthropic credit monitor is REACTIVE (scans journal after exhaustion) — matches CLAUDE.md rule #16 anti-pattern; should be proactive balance poll"
  category: ops
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "systemctl status genlab-anthropic-credit-monitor.timer --no-pager | head -5"'
      host: vps
      output: |
        ● genlab-anthropic-credit-monitor.timer - GenLab Anthropic Credit Monitor Timer — scan journalctl for credit-low signal every 15 min
             Loaded: loaded (/etc/systemd/system/genlab-anthropic-credit-monitor.timer; enabled; preset: enabled)
             Active: active (waiting) since Wed 2026-07-15 18:10:29 IST; 2 weeks 0 days ago
            Trigger: Wed 2026-07-29 21:15:00 IST; 8min left
           Triggers: ● genlab-anthropic-credit-monitor.service
    - command: 'ssh genlab-prod "grep -n ''balance\\|credit'' /opt/genlab/genlab-core/src/genlab_core/monitoring/anthropic_credit_monitor.py | head -5"'
      host: vps
      output: |
        1:"""Detect Anthropic credit-balance exhaustion and surface as a CRITICAL
        9:     "message":"Your credit balance is too low to access the Anthropic
        12:The key was valid; only the credit balance was exhausted. Pipelines
        19:The next time the credit balance falls low, the operator should learn
  claim: >
    Timer description ("scan journalctl for credit-low signal every 15 min") and code
    comments confirm the monitor is REACTIVE — it detects "Your credit balance is too
    low" errors AFTER they appear in journal, not by polling Anthropic's balance API
    proactively. Detection latency: ~15 min (timer interval) once the error message
    hits the journal. Matches CLAUDE.md rule #16 anti-pattern ("Never treat env var
    timestamp as evidence of token healthy — always live-probe the API").
  blast_radius: >
    A-0034 (BB 32/8/0 outage) would be resolvable in 15 min if credit exhaustion was
    the cause — but only AFTER the failure. Proactive balance-poll (query Anthropic's
    `/v1/organizations/me/usage` or equivalent) would surface imminent exhaustion 24-48h
    ahead, letting the operator top up before pipelines go dark. Fix path: add a
    proactive check to the same monitor unit; keep the reactive branch as safety net.
    Complements OPERATOR_ACTIONS by making the "did credit run out?" question answerable
    without journal grep (which A-0050 shows is unreliable).
  effort: M
  proposed_action: fix
  supersedes: []

