- id: A-0004
  phase: 0
  host: vps
  title: "Two dangling systemd unit references + orphaned .pre-2026-07-05 unit files"
  category: ops
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "systemctl list-units --all --plain --no-legend genlab-* | awk \"\\\$2==\\\"not-found\\\"{print \\\$1}\""'
      host: vps
      output: |
        genlab-pipeline-ai-creators.service
        genlab-postgres-ready.target
    - command: 'ssh genlab-prod "grep -rln \"genlab-pipeline-ai-creators\\|genlab-postgres-ready\" /etc/systemd/system/"'
      host: vps
      output: |
        /etc/systemd/system/genlab-verify-whisper-canary.service
        /etc/systemd/system/genlab-auto-approver.timer
        /etc/systemd/system/genlab-auto-approver.service
        /etc/systemd/system/genlab-auto-approver.service.pre-2026-07-05
        /etc/systemd/system/genlab-auto-approver.timer.pre-2026-07-05
  claim: >
    Two systemd unit names are referenced by active units but do not exist on disk:
    (a) `genlab-pipeline-ai-creators.service` — the AI-creators pipeline was renamed at some point
    to `genlab-pipeline-ai.service`, but `genlab-verify-whisper-canary.service` still references
    the old name. (b) `genlab-postgres-ready.target` — referenced by the live auto-approver .timer
    and .service, plus their `.pre-2026-07-05` sibling backup files which are 3.5 weeks old and
    should have been cleaned up. The dangling `After=` dependencies degrade to no-ops silently.
  blast_radius: >
    Silent degradation: `After=genlab-postgres-ready.target` becomes a no-op, so the auto-approver
    can start before Postgres is fully ready on boot — occasional startup errors that look like
    transient Postgres unavailability. `genlab-pipeline-ai-creators` in the verify unit means the
    verification never actually waits for the ai pipeline. Naming-drift class-of-bug the project
    has documented before (session-2026-07-09 memory).
  effort: S
  proposed_action: fix
  supersedes: []

- id: A-0005
  phase: 0
  host: both
  title: "FFmpeg version divergence: mac 8.1 (2026) vs vps 6.1.1-3ubuntu5 (2023) — video pipeline reproducibility risk"
  category: drift
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ffmpeg -version | head -1'
      host: mac
      output: |
        ffmpeg version 8.1 Copyright (c) 2000-2026 the FFmpeg developers
    - command: 'ssh genlab-prod "ffmpeg -version | head -1"'
      host: vps
      output: |
        ffmpeg version 6.1.1-3ubuntu5 Copyright (c) 2000-2023 the FFmpeg developers
  claim: >
    Mac dev runs FFmpeg 8.1 (2026); VPS prod runs 6.1.1 (Ubuntu 24.04 stock, 2023). Two full major
    versions apart. Any local reproduction of a rendering issue on Mac uses a different libavcodec
    build than what actually ran in prod.
  blast_radius: >
    Real risk given CLAUDE.md's strict video requirements (bt709 color space, libx264/CRF20/preset=fast
    across all 5 platforms, 1080×1920 exact). Subtle codec behavior (deblocking, aq-mode defaults,
    color-primary handling) has changed between 6.1 and 8.1. When operator says "renders look OK on
    my machine" that testimony is not equivalent to "renders look OK in prod". Fix could be:
    downgrade Mac to `brew install ffmpeg@6`, or pin ffmpeg-static on VPS to a specific version
    Mac can also install.
  effort: M
  proposed_action: consolidate
  supersedes: []

- id: A-0006
  phase: 0
  host: both
  title: "Python version divergence: mac 3.14.3 vs vps 3.12.3"
  category: drift
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'python3 -V'
      host: mac
      output: |
        Python 3.14.3
    - command: 'ssh genlab-prod "python3 -V"'
      host: vps
      output: |
        Python 3.12.3
  claim: >
    Mac dev runs Python 3.14 (bleeding-edge); VPS prod runs Python 3.12 (Ubuntu 24.04 stable). Two
    minor versions apart, and CLAUDE.md declares "Python 3.12+" so prod is at the floor. Between
    3.12 and 3.14 there are typing changes (PEP 692, PEP 695 generics), a new interpreter (PEP 703
    experimental free-threading), asyncio behavior tweaks, and dict ordering guarantees are unchanged
    but iteration behavior around task groups shifted.
  blast_radius: >
    Test-passing-on-Mac does not imply test-passing-in-prod. Any use of 3.13+ syntax on Mac silently
    passes locally but breaks at prod runtime. Mypy version + strictness matters too (Phase 7).
    Cheapest fix: install python3.12 on Mac via pyenv/uv, pin `.python-version` at repo root, ensure
    uv respects it.
  effort: S
  proposed_action: consolidate
  supersedes: []

- id: A-0007
  phase: 0
  host: both
  title: "Postgres version divergence: mac 14.19 vs vps 18.3 — local dev DB unable to validate prod SQL/DDL"
  category: drift
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'psql --version'
      host: mac
      output: |
        psql (PostgreSQL) 14.19 (Homebrew)
    - command: 'ssh genlab-prod "psql --version"'
      host: vps
      output: |
        psql (PostgreSQL) 18.3 (Ubuntu 18.3-1.pgdg24.04+1)
  claim: >
    Local dev Postgres is 14.19 (Homebrew); prod is 18.3 (`pgdg24.04+1`). Four major versions apart.
    Postgres 15 added MERGE + SQL/JSON path expressions; 16 added logical-replication improvements;
    17 added incremental backups; 18 (2025 release) added asynchronous I/O, virtual generated
    columns, larger index prefetch. Multiple DDL and query-plan behaviors differ.
  blast_radius: >
    Any Alembic migration or hand-crafted SQL that lints/passes on Mac 14.19 might behave differently
    or fail outright on 18.3 — and vice versa. Mac dev cannot be a reliable local reproduction
    environment for the prod DB. Combined with the fact that Mac `psql -d genlab` couldn't connect
    to any local `genlab` DB anyway (my probe hit port 5433 with no such DB), the Mac Postgres is
    effectively unused and just misleading. Options: run prod-parity Postgres locally in Docker;
    or accept dev has no local DB and always test against a staging DB.
  effort: M
  proposed_action: consolidate
  supersedes: []

- id: A-0008
  phase: 0
  host: vps
  title: "VPS .git needs GC: 25 packs, 148 MB — packing to 1-2 packs likely reclaims 60-100 MB"
  category: waste
  severity: S3
  confidence: high
  tags: []
  evidence:
    - command: 'git count-objects -vH'
      host: mac
      output: |
        count: 8757
        size: 50.01 MiB
        in-pack: 16636
        packs: 2
        size-pack: 31.85 MiB
    - command: 'ssh genlab-prod "cd /opt/genlab && git count-objects -vH"'
      host: vps
      output: |
        count: 2075
        size: 11.20 MiB
        in-pack: 39802
        packs: 25
        size-pack: 133.84 MiB
        prune-packable: 7
  claim: >
    VPS repo has 25 packs vs Mac's 2. Fewer, larger packs almost always mean smaller total disk
    (better delta chain sharing) and faster operations. VPS `.git/` is 148 MB — the biggest
    single-directory contributor to prod repo storage that isn't code, venv, or backups.
  blast_radius: >
    Low. `git gc --aggressive` (or plain `git gc`) is safe, does not touch working tree, and can
    be run while services are running. Reclaims disk that's currently 25% of the free space budget's
    equivalent on `/`. Not urgent but cheap. Do not use during a deploy window.
  effort: S
  proposed_action: fix
  supersedes: []

