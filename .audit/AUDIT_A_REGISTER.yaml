- id: A-0032b
  title: "RLS not deny-by-default when app.niche_id is unset — cross-niche read as genlab_app returns all 5 niches (357+376+251+340+856 rows). Runbook Step 5b surfaced this as expected"
  phase_source: 9A-Wave-0
  severity: S1
  confidence: high
  category: security
  register_disposition: FIX
  register_verification_gate: "cross-niche `SELECT niche_id, COUNT(*) FROM blueprints GROUP BY niche_id` as genlab_app returns 0 rows WITHOUT SET LOCAL; and returns only the set niche's rows WITH `SET LOCAL app.niche_id = 'X'`"
  register_owner: dev (this session, Wave 2)
  register_sequencing_before: []
  register_note: |
    A-0032 split into two halves at Wave-0 per rotation Step 5b result.
    Half-1 (superuser bypass) CLOSED by DSN swap in runbook.
    Half-2 (isolation-fires) OPEN: RLS policies exist (24 of them) but they don't deny
    when the session variable is unset — the predicate probably reads `current_setting(
    'app.niche_id', true)` and evaluates NULL as "unfiltered". Two-part fix:
    (a) rewrite each policy so unset → 0 rows (`USING (niche_id = current_setting(
        'app.niche_id', true) AND current_setting('app.niche_id', true) IS NOT NULL)`
        or equivalent — depends on how policies are currently structured);
    (b) audit app code paths for missing `SET LOCAL app.niche_id` before DB access.
    This is the SaaS-blocking fix Audit A A-0032/A-0054 pointed at.
