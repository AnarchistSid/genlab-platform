version: "3"
services:
  short-video-maker:
    # Pinned (U-19): no floating :latest-tiny — reproducible, supply-chain-safe.
    # Bump deliberately as a maintenance step. Latest tiny tag as of 2026-05.
    image: gyoridavid/short-video-maker:1.3.4-tiny
    environment:
      - LOG_LEVEL=info
      - PEXELS_API_KEY=${PEXELS_API_KEY}
    ports:
      - "3123:3123"
    volumes:
      - ./videos:/app/data/videos
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2.0
