name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - run: uv tool run ruff@0.15.14 check .
      # U-18: also enforce formatting here (ci.yml already does) so both
      # workflows' lint gates are consistent.
      - run: uv tool run ruff@0.15.14 format --check .

  test-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: genlab_test
          POSTGRES_DB: genlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --package genlab-core pytest genlab-core/tests/ -k "not integration" --tb=short -q

  test-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --package genlab-dashboard pytest dashboard/tests/ --tb=short -q

  test-channels:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [clutchwire, splicereel, framedrift, blackbox-brief, criticalrush]
        include:
          - package: clutchwire
            test_path: ClutchWire/tests/
          - package: splicereel
            test_path: SpliceReel/tests/
          - package: framedrift
            test_path: FrameDrift/tests/
          - package: blackbox-brief
            test_path: BlackboxBrief/tests/
          - package: criticalrush
            test_path: CriticalRush/tests/
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Channel render tests build FFmpeg command lines (subprocess is mocked,
      # but get_ffmpeg_binary() resolves a real path) — install the binary so
      # command construction doesn't raise "FFmpeg not found".
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen
      - run: uv run --package ${{ matrix.package }} pytest ${{ matrix.test_path }} --tb=short -q

  # U-18 / R-04: gate the dashboard frontend build. The Dockerfile builds it at
  # deploy time, so a broken build previously surfaced only then. `npm ci &&
  # npm run build` (tsc -b && vite build) catches type/build errors in CI.
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
