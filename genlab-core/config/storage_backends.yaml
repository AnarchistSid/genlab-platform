# Per-table backend routing. Change a table from "sharepoint" to "postgres"
# to migrate it. Both backends can run simultaneously during migration.
#
# See: genlab_core.storage.factory for the routing logic.

default_backend: postgres

table_backends:
  blueprints: postgres
  stories: postgres
  assets: postgres
  templates: postgres
  sources: postgres
  publishing_analytics: postgres
  analytics: postgres
  content_memory: postgres
  bandit_arms: postgres
  pending_engagement: postgres
  pending_feedback: postgres

postgres:
  host: localhost
  port: 5432
  database: genlab
  user: genlab
  password_env: POSTGRES_PASSWORD
  min_connections: 2
  max_connections: 10
