- id: A-0001
  phase: 0
  host: vps
  title: "Four systemd services in FAILED state on prod (2 pipelines + post-deploy-verify + strategist)"
  category: ops
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "systemctl list-units --state=failed --plain --no-legend genlab-*"'
      host: vps
      output: |
        genlab-pipeline-ai.service        loaded failed failed GenLab AI Creators Pipeline (BlackboxBrief)
        genlab-pipeline-movies.service    loaded failed failed GenLab Movies Pipeline (SpliceReel)
        genlab-post-deploy-verify.service loaded failed failed GenLab Post-Deploy Verify — sanity-check prod after deploy/restart
        genlab-strategist.service         loaded failed failed GenLab Strategist — weekly LLM-based meta-cognition per niche
    - command: 'ssh genlab-prod "systemctl status genlab-pipeline-ai.service --no-pager -l | head -8"'
      host: vps
      output: |
        × genlab-pipeline-ai.service - GenLab AI Creators Pipeline (BlackboxBrief)
             Active: failed (Result: exit-code) since Wed 2026-07-29 08:02:41 IST; 7h ago
        TriggeredBy: ● genlab-pipeline-ai.timer
            Process: 2943244 ExecStartPre=/opt/genlab/deploy/scripts/ensure_yt_dlp_environment.sh (code=exited, status=0/SUCCESS)
            Process: 2943261 ExecStart=/bin/bash /opt/genlab/BlackboxBrief/runbooks/cron_wrapper.sh (code=exited, status=2)
            Main PID: 2943261 (code=exited, status=2)
  claim: >
    As of 2026-07-29, four genlab-* systemd services are in `failed` state on the production VPS,
    with their .timer siblings still `active waiting` — meaning each will fire again and fail again
    on schedule. Two are pipeline runners for BlackboxBrief (ai_creators) and SpliceReel (movies);
    one is the post-deploy verification runner (failing for 2 days); one is the weekly strategist
    LLM meta-cognition runner (failing for 3 days).
  blast_radius: >
    BlackboxBrief and SpliceReel pipelines are not currently ingesting/writing/rendering — the two
    channels are frozen at whatever backlog state existed as of 2026-07-29 morning. post-deploy-verify
    failing silently means real regressions post-deploy are not surfaced. Strategist failing means
    the weekly meta-cognition loop that feeds the auto-approver calibration ratchet (per CLAUDE.md
    AUTO #2 section) is idle — matches rule #19 (calibration writes stall the ratchet indefinitely).
    Acting rashly (mass-restart) risks compounding: if the fix is a config change, restart just
    reproduces the failure and consumes journal disk.
  effort: M
  proposed_action: investigate
  supersedes: []

- id: A-0002
  phase: 0
  host: vps
  title: "CriticalRush auto-publish rollout_pct raised 0.0 → 1.0 on VPS but never committed to git"
  category: drift
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "cd /opt/genlab && git diff CriticalRush/niches/gaming/config/publishing.yaml | tail -8"'
      host: vps
      output: |
        @@ -121,4 +121,4 @@ auto_publish:
           enabled: false
           min_confidence: 0.85
           max_approvals_per_pass: 3
        -  rollout_pct: 0.0
        +  rollout_pct: 1.0
    - command: 'ssh genlab-prod "cd /opt/genlab && git log -1 --format=%H && git status --porcelain CriticalRush/niches/gaming/config/publishing.yaml"'
      host: vps
      output: |
        34140a82183a5d9b9a1648a8b5460697014ddab8
         M CriticalRush/niches/gaming/config/publishing.yaml
  claim: >
    The CriticalRush (gaming) niche's auto_publish.rollout_pct has been increased from 0.0 to 1.0
    (0% → 100% rollout) as a live edit on the VPS filesystem, and this change is uncommitted.
    A .lock sidecar exists (`publishing.yaml.lock`) confirming the file has been written to. The
    change is real prod state that any clean re-deploy or `git checkout -- .` would lose.
  blast_radius: >
    If this change was intentional but unwritten (operator forgot to commit), a redeploy silently
    reverts gaming to 0% auto-publish — worst-of-both because it's non-obvious. If this change was
    NOT intentional (accidental filesystem edit), 100% rollout of auto-approval on gaming is happening
    without operator awareness — and per CLAUDE.md rule #22, gaming's real operator-agreement was
    only 53.4% back in July, well below AUTO #2's 90% gate. The rule-#22 revert lesson explicitly
    used gaming as its cautionary example.
  effort: S
  proposed_action: investigate
  supersedes: []

