[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genlab-core"
version = "1.0.0"
description = "Shared infrastructure for all Gen Lab content agents"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "anthropic>=0.45",
    "openai>=1.0",
    "requests>=2.32",
]

[project.optional-dependencies]
tts = ["elevenlabs>=1.0", "openai>=1.0", "edge-tts>=6.0", "gtts>=2.0"]
tts-elevenlabs = ["elevenlabs>=1.0"]
tts-openai = ["openai>=1.0"]
tts-edge = ["edge-tts>=6.0"]
tts-gtts = ["gtts>=2.0"]
http = ["httpx>=0.27"]
publishing = ["httpx>=0.27"]
engagement = [
    "dramatiq[redis]>=2.0",
    "redis>=5.0",
    "detoxify>=0.5.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
]
bandit = ["numpy>=1.26"]
scoring = ["scikit-learn>=1.4"]
smart-crop = ["opencv-python-headless>=4.8"]
whisper = ["faster-whisper>=1.0"]
cost = ["litellm>=1.0"]
dev = ["import-linter>=2.0", "hypothesis>=6.100.0", "litellm>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/genlab_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end pipeline smoke tests (run with: pytest -m integration)",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pytest>=9.0.2",
]
