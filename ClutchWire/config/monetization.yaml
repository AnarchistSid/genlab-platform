# ClutchWire monetization config

# QB-FIX-01 F1 (2026-08-06): disabled pending disclosure-position rebuild.
# When true, push_to_backlog copies affiliate_* fields to the blueprint and
# calls cta_engine.inject_cta(). When false, both are skipped. Default off.
# NARR/MONETIZATION (2026-08-20): re-enabled. The disable at 4dd2ebb6
# (2026-08-06) was explicitly "pending disclosure-position rebuild";
# that rebuild shipped as e790334c (2026-08-12, FTC disclosure at caption
# head — first 100 chars) and its enforcement is covered by
# tests/monetization/test_cta_disclosure_head_position.py (85 tests green
# at flip time: prepends when absent from the head, no-ops on existing
# #ad/#affiliate/sponsored/paid-partnership, idempotent, and rejects
# markers beyond 100 chars). The blocking condition is satisfied.
cta_injection_enabled: true

affiliate_programs:
  - name: "DraftKings"
    category: sports_betting
    enabled: false
    sports: [nba, nfl, mlb]
    link_template: "https://draftkings.com?ref={affiliate_id}"
  - name: "FanDuel"
    category: sports_betting
    enabled: false
    sports: [nba, nfl, mlb]
  - name: "Nike"
    category: sports_apparel
    enabled: false
    link_template: "https://nike.com?ref={affiliate_id}"
  - name: "ESPN+"
    category: streaming
    enabled: false
    link_template: "https://plus.espn.com?ref={affiliate_id}"
  - name: "DAZN"
    category: streaming
    enabled: false

newsletter_enabled: false
newsletter_cta: "Get ClutchWire highlights in your inbox"

link_in_bio_items:
  - label: "Latest highlights"
    url: ""
    enabled: false
  - label: "Newsletter signup"
    url: ""
    enabled: false

revenue_tracking:
  enabled: false
  utm_source: "clutchwire"
  utm_medium: "social"
