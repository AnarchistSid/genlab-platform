# Error Budgets and SLOs — Shared defaults for all niches
# Override per-niche by placing an error_budgets.yaml in the channel's config/ dir.

version: "1.0"

pipeline_run:
  success_rate: 0.98
  duration_p95: 2400        # seconds (40 min)
  cost_daily: 5.00          # USD per channel
  cache_hit_rate: 0.60

quality_gates:
  claim_coverage: 1.00
  constraint_compliance: 1.00
  risk_mitigation: 1.00

alerts:
  critical:
    - run_failed: true
    - weekly_cost_exceeded: 40.00
    - qc_pass_rate_below: 0.80
  warning:
    - source_down_days: 2
    - cache_hit_rate_below: 0.40
    - duration_exceeded: 3600
