# Storage backend routing — which engine serves each table.
#
# Valid values: "sharepoint", "postgres".
# Default: "sharepoint" if a table is not listed here.
#
# Sprint 64: Migrated from SharePoint to PostgreSQL.
# All tables now served by local PostgreSQL with RLS.
# SharePoint remains as backup — flip individual tables back to "sharepoint"
# if issues arise.

tables:
  Stories: postgres
  Blueprints: postgres
  Templates: postgres
  Assets: postgres
  Sources: postgres
  Publishing_Analytics: postgres
  Analytics: postgres
  AB_Tests: postgres
  Content_Memory: postgres
  PendingEngagement: postgres
  PendingFeedback: postgres
  BanditArms: postgres
  Audience_Snapshots: postgres
