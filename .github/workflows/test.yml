name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 2026-06-29: cancel superseded runs so fix-push-wait cycles don't pile
# jobs on the single-concurrency self-hosted runner. Per-workflow + per-ref
# grouping means main and a PR branch don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R-04 (2026-06-11): the duplicate ``lint`` job that used to live here
# was a strict subset of ``ci.yml``'s lint (ruff check + format) and
# fired on every PR, doubling up the gate. Consolidated into ci.yml,
# which additionally enforces the .importlinter layer contract (R-69).
# Keep ``test-core``, ``test-dashboard``, ``test-channels``, and
# ``test-frontend`` here — those are this workflow's unique gates.
jobs:
  test-core:
    runs-on: [self-hosted, genlab-prod]
    # 2026-06-18: 20-min job cap. test-core runs 4200+ tests across
    # a 3-version matrix; baseline ~2 minutes. 20min = ~10× headroom
    # for runner slowness, prevents indefinite hangs on a Postgres
    # connection waiting that the service-container failed.
    timeout-minutes: 20
    # R-04 + U-17: matrix across all CLAUDE.md-supported Python versions.
    # The workspace floor is ``requires-python>=3.12``; CI used to only
    # exercise 3.13 — a 3.12 syntax regression (PEP-695 type aliases,
    # ``except*``, etc.) could ship undetected. Added 3.14 (2026-06-17)
    # so the bleeding edge gets validated before any operator-side
    # ``python_requires`` bump or Hetzner box upgrade. The 3.14 leg also
    # closes the R-64 research question "does Detoxify segfault on 3.14
    # the same way as 3.13" — the ``_SKIP_DETOXIFY`` guard in
    # ``conftest.py`` already covers 3.13+, so 3.14 inherits the skip.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genlab
          POSTGRES_PASSWORD: genlab_test
          POSTGRES_DB: genlab_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # 2026-06-29: pre-step disk hygiene for the test-core matrix. The
      # self-hosted runner starts at ~90-93% disk usage; the previous
      # matrix entry's leftover ``.venv`` (2.3 GB) plus a saturated uv
      # cache (~4 GB) leaves <500 MB free before ``uv sync`` allocates
      # the new venv. ``uv cache prune --ci`` drops pre-built wheels
      # (keeps source dists). Also wipe the prior matrix entry's venv
      # so ``uv sync`` doesn't try to mutate a Python 3.13 tree under a
      # Python 3.12 interpreter. Mirrored on the post-pytest "Free disk
      # for next matrix entry" step below so the last entry leaves the
      # runner clean for the next workflow run too.
      - name: Free disk before matrix entry
        run: |
          rm -rf .venv genlab-core/.venv 2>/dev/null || true
          rm -rf .pytest_cache genlab-core/.pytest_cache 2>/dev/null || true
          uv cache prune --ci 2>&1 | tail -5 || true
          df -h / | tail -1
      - run: uv sync --frozen
      # HF cache + offline pytest — see ci.yml's ``test`` job for the
      # full rationale; this is the same pattern applied to ``test-core``
      # because the engagement-side test surface here also loads the
      # Detoxify toxicity gate.
      # 2026-06-29: pin HF_HOME and TORCH_HOME to absolute paths under
      # RUNNER_TOOL_CACHE so the self-hosted runner restores into a
      # stable location across jobs. The previous ``~/.cache/huggingface``
      # resolved differently on self-hosted vs hosted runners (the runner
      # cd's into actions-runner/ before tilde expansion in some contexts,
      # so the cache restored to /home/gh-runner/actions-runner/.cache
      # instead of /home/gh-runner/.cache, and pytest looked at the
      # latter — leading to "couldn't connect + couldn't find cached
      # files" toxicity-gate failures).
      - name: Cache HuggingFace + torch hubs (Detoxify model weights)
        id: hf-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.tool_cache }}/.hf-cache
            ${{ runner.tool_cache }}/.torch-cache
          # Bumped to v2 because the path now includes torch.hub
          # checkpoints (Detoxify weights, not just the HF tokenizer).
          key: hf-cache-v2-${{ runner.os }}-detoxify-original-small
      - name: Pre-warm HF cache on miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HOME: ${{ runner.tool_cache }}/.hf-cache
          TORCH_HOME: ${{ runner.tool_cache }}/.torch-cache
        run: |
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          uv run --package genlab-core python -c "
          from detoxify import Detoxify
          Detoxify('original-small')
          "
      # 2026-06-29: TMPDIR override needed on self-hosted runner. The default
      # /tmp/genlab_audio/ directory on the prod VPS is owned by the genlab
      # publishing user; gh-runner has no write access. Pinning TMPDIR to
      # the runner workspace tmp keeps tests out of prod-owned paths.
      - run: |
          export TMPDIR="${RUNNER_TEMP:-$HOME/tmp_ci}"
          mkdir -p "$TMPDIR"
          uv run --package genlab-core pytest genlab-core/tests/ -k "not integration" --tb=short -q --timeout=120
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: ${{ runner.tool_cache }}/.hf-cache
          TORCH_HOME: ${{ runner.tool_cache }}/.torch-cache
      # 2026-06-29: free disk between matrix entries. The self-hosted runner
      # has ~3-4 GB free at the start of a Test & Lint run. Each matrix entry
      # (3.12, 3.13, 3.14) builds a fresh ~2.3 GB ``.venv`` and writes wheels
      # into the shared uv cache (~4 GB at saturation). Without this step the
      # 2nd and 3rd matrix entries hit ``OSError: [Errno 28] No space left on
      # device`` mid-pytest (observed 2026-06-29: 3.13 passed, 3.12 + 3.14
      # both failed with hundreds of __pycache__ write errors). ``if: always()``
      # so the cleanup still runs when pytest fails — otherwise a failed
      # 3.12 entry leaves no headroom for the 3.14 entry to even start.
      - name: Free disk for next matrix entry
        if: always()
        run: |
          rm -rf .venv genlab-core/.venv 2>/dev/null || true
          rm -rf .pytest_cache genlab-core/.pytest_cache 2>/dev/null || true
          find . -type d -name __pycache__ -prune -exec rm -rf {} + 2>/dev/null || true
          uv cache prune --ci 2>&1 | tail -5 || true
          df -h / | tail -1

  test-dashboard:
    runs-on: [self-hosted, genlab-prod]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      # HF cache + offline pytest — see test-core for the full rationale
      # (2026-06-29: absolute paths under runner.tool_cache + HF_HOME +
      # TORCH_HOME pinned so the runner restores into a stable location
      # across jobs).
      - name: Cache HuggingFace + torch hubs (Detoxify model weights)
        id: hf-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.tool_cache }}/.hf-cache
            ${{ runner.tool_cache }}/.torch-cache
          key: hf-cache-v2-${{ runner.os }}-detoxify-original-small
      - name: Pre-warm HF cache on miss
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HOME: ${{ runner.tool_cache }}/.hf-cache
          TORCH_HOME: ${{ runner.tool_cache }}/.torch-cache
        run: |
          mkdir -p "$HF_HOME" "$TORCH_HOME"
          uv run --package genlab-core python -c "
          from detoxify import Detoxify
          Detoxify('original-small')
          "
      # 2026-06-29: TMPDIR override needed on self-hosted runner (see
      # test-core for full rationale).
      - run: |
          export TMPDIR="${RUNNER_TEMP:-$HOME/tmp_ci}"
          mkdir -p "$TMPDIR"
          uv run --package genlab-dashboard pytest dashboard/tests/ --tb=short -q
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HOME: ${{ runner.tool_cache }}/.hf-cache
          TORCH_HOME: ${{ runner.tool_cache }}/.torch-cache

  test-channels:
    runs-on: [self-hosted, genlab-prod]
    # 2026-06-18: hard 15-minute cap. The chronic
    # ``test-channels (clutchwire|blackbox-brief|criticalrush)`` flake
    # observed 6+ times in one day hangs FOREVER without this — GitHub
    # Actions' default cap is 6 hours per job, which is operationally
    # useless. 15min is ~3× the green-run baseline (~5min): enough
    # slack for a slow runner, tight enough to fail-fast when a test
    # actually deadlocks (network call without a mock, blocking
    # ``input()``, etc.). The matrix's ``fail-fast: false`` is kept so
    # one stuck shard doesn't kill the others mid-run.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [clutchwire, splicereel, framedrift, blackbox-brief, criticalrush]
        include:
          - package: clutchwire
            test_path: ClutchWire/tests/
          - package: splicereel
            test_path: SpliceReel/tests/
          - package: framedrift
            test_path: FrameDrift/tests/
          - package: blackbox-brief
            test_path: BlackboxBrief/tests/
          - package: criticalrush
            test_path: CriticalRush/tests/
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Channel render tests build FFmpeg command lines (subprocess is mocked,
      # but get_ffmpeg_binary() resolves a real path).
      # 2026-06-29: self-hosted runner has FFmpeg pre-installed for the prod
      # publishing pipeline; gh-runner has no sudo, so the previous
      # ``sudo apt-get install`` step is dropped.
      - name: Verify FFmpeg available (pre-installed on self-hosted runner)
        run: ffmpeg -version | head -1
      - run: uv sync --frozen
      # ``--timeout=120`` (pytest-timeout) — per-test ceiling. Belt-
      # and-suspenders with the job-level ``timeout-minutes: 15``:
      # job-cap catches setup hangs (uv sync, apt install);
      # per-test cap catches a single test stuck on a real network
      # call. Both required because GitHub's per-test signal is
      # cleaner than the job-kill SIGKILL.
      - run: uv run --package ${{ matrix.package }} pytest ${{ matrix.test_path }} --tb=short -q --timeout=120

  # U-18 / R-72 / R-04: gate the dashboard frontend. The build (tsc -b && vite
  # build) catches type/build errors; the vitest suite (108 tests) was never run
  # in CI before, so frontend regressions shipped silently. (eslint — 57 known
  # errors — is a separate triage task, not gated here yet.)
  test-frontend:
    runs-on: [self-hosted, genlab-prod]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci
        working-directory: dashboard/frontend
      # R-72: eslint gate. Errors fail CI; advisory rules are configured as
      # warnings (see eslint.config.js) so they're surfaced without blocking.
      - run: npm run lint
        working-directory: dashboard/frontend
      - run: npm run build
        working-directory: dashboard/frontend
      - run: npm run test
        working-directory: dashboard/frontend

  # U-21: informational mypy gate. genlab-core configures [tool.mypy] in
  # pyproject.toml but no CI step ever ran it, so type-check signal was
  # invisible — 226 errors across 83 files lurked unnoticed (audit
  # 2026-06-17). This job runs mypy on the full genlab-core source tree
  # and posts the output to the GitHub Actions job summary, but
  # ``continue-on-error: true`` means a failure does NOT block the PR.
  #
  # The intent is **visibility without velocity loss** — operators see
  # type debt accumulate on each PR and can ratchet down by either
  # fixing errors or tightening the mypy config when ready. Once the
  # error count is low enough, flip ``continue-on-error`` to ``false``
  # (or remove it) to turn this into a hard gate.
  mypy-check:
    runs-on: [self-hosted, genlab-prod]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: mypy genlab-core
        id: mypy
        continue-on-error: true
        run: |
          set -o pipefail
          uvx mypy --config-file genlab-core/pyproject.toml \
            genlab-core/src/genlab_core/ \
            | tee mypy-report.txt
      - name: Summarize to job summary
        if: always()
        run: |
          {
            echo "## mypy report (informational)"
            echo
            echo "Tail of report (last 60 lines):"
            echo
            echo '```'
            tail -60 mypy-report.txt 2>/dev/null || echo "(no report generated)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # 2026-06-29: artifact upload removed. The GitHub Actions artifact
      # storage quota for this account is exhausted (``Failed to
      # CreateArtifact: Artifact storage quota has been hit``), so every
      # upload was failing and turning the whole job red even though
      # ``continue-on-error`` was set at both job + step level above —
      # the artifact upload step did not inherit that flag and its
      # ``Failed to CreateArtifact`` exit code is what GH used for the
      # job conclusion. The tail-60 in the summary above is sufficient
      # operator visibility for an informational/non-gating type-check
      # job; flip to a hard gate (and reinstate uploads) once the
      # storage quota is paid down or expires (recalculated every 6-12h
      # per GH's billing docs).
