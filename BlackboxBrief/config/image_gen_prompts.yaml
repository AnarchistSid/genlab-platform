      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a candid portrait of a middle-aged person looking at a laptop screen in a warm home office, soft natural window light illuminating their thoughtful expression, bokeh background"
      - "Editorial photograph with absolutely no text, letters, logos, or watermarks: {entity_context}a pair of weathered hands typing on a modern laptop keyboard, a blurred AI chat interface visible on the screen, intimate close-up with warm tones"
    style_suffix: "Warm human tones, natural light, documentary photography style, authentic and empathetic mood. ABSOLUTELY NO TEXT, LETTERS, WORDS, LOGOS, OR WATERMARKS OF ANY KIND."

  pop_culture:
