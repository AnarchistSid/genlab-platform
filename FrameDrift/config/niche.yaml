niche_id: "anime"
display_name: "FrameDrift"
channel_handle: "@theframedrift"
description: "Anime content pipeline — seasonal releases, manga adaptations, studio announcements, fan culture"

brand_voice:
  tone: "insider curator, warm, otaku-literate, community-driven"
  forbidden_words: ["cheap", "affordable", "buy now", "limited supply"]
  hook_style: "trend_observation"
  emoji_style: "selective"

target_audience:
  primary: "Anime fans 16-30, seasonal watchers + manga readers"
  secondary: "Anime-curious mainstream audience discovering new series"
  interests: ["anime", "manga", "seasonal anime", "studio announcements", "fan art", "cosplay"]
  platforms_primary: ["instagram", "youtube", "tiktok"]
  platforms_secondary: ["x", "threads", "facebook"]

accent_color: "#7B3FE4"

brand_sensitivity:
  protected_brands:
    - Studio Ghibli
    - MAPPA
    - ufotable
    - Toei Animation
    - Shueisha
    - Kadokawa
    - Aniplex
    - Bones
  pexels_query_rule: "Use generic descriptors only (anime, cosplay, manga)"

feature_flags:
  use_live_publishing: true
  platforms_enabled:
    - youtube
    - instagram
    - facebook
    - x_twitter
    - threads
  tiktok:
    enabled: false
    audit_approved: false
    daily_post_limit: 12
    posting_windows_utc: ["06:00", "12:00", "16:00"]
  threads:
    enabled: true
    daily_post_limit: 4

freshness:
  decay_half_life_hours: 24.0
  # 2026-06-15 audit T#63: bumped from 72h (3d) to 720h (30d). Viral
  # anime moments — fight scenes, voice-actor reveals, studio drops —
  # resurface for weeks via TikTok/IG/YT compilation channels; the 3d
  # gate was rejecting them at push_to_backlog. The declining_threshold
  # below (96h) still controls scoring decay separately, so older
  # stories will land lower in the queue without being hard-blocked.
  max_story_age_hours: 720  # 30 days
  trend_cycle_modes:
    emerging_window_hours: 24
    peak_window_hours: 72
    declining_threshold_hours: 96

video_sourcing:
  strategy: trending_youtube
  niche_category: anime
  max_age_hours: 48
  top_n_per_run: 15
  min_view_velocity: 100
  use_google_trends: true
  allow_keyword_search: true
  video_gate: require
  fallback_to_text_render: false
  composite_quality_gate:
    velocity_threshold: 80
    min_composite_score: 0.15

# P4 (2026-06-20): opt in to the shared pipeline backbone.
pipeline_template: backbone

pipeline:
  inject:
    phase1_fetchers_extra:
      - class: genlab_core.pipeline.stages.fetch_anime_promos.FetchAnimePromos
        retries: 1
        retry_delay_seconds: 15

    phase1_content_research:
      - class: fd_strategies.content_research.AnimeContentResearchStrategy
        retries: 1
        retry_delay_seconds: 30
    phase1_scoring:
      - class: fd_strategies.scoring.AnimeScoringStrategy

    phase1_relevance_gate: []

    phase2_writing:
      - class: fd_strategies.writing.AnimeWritingStrategy
        retries: 1
        retry_delay_seconds: 60
    phase2_hooks:
      - class: fd_strategies.hooks.AnimeHookStrategy

    phase4_visual_render:
      - class: fd_strategies.visual_render.AnimeVisualRenderStrategy
        fail_mode: abort

    phase5_platform_adaptation:
      - class: fd_strategies.platform_adaptation.AnimePlatformAdaptationStrategy

  max_items_per_run: 10
  min_score_threshold: 0.20
  dedup_window_days: 7
  # Anime trending content cycles weekly (same shows trend across days
  # as new episodes drop). A 7-day title-similarity dedup window blocks
  # nearly every fetched candidate because the SHOW NAME repeats even
  # when the clip is genuinely different. 2-day window allows new
  # episodes/scenes of an ongoing show; URL/video_id dedup still
  # prevents true duplicates. See [[session-2026-06-12-deep-dive-findings]]
  # § B.9 — anime 0-blueprint days 2026-06-13 traced back here.
  title_dedup_days: 2
