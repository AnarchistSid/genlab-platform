        /dev/sda1        38G   24G   12G  67% /
  claim: >
    A .backups/ directory in the repo root on VPS holds 3.7 GB. Its consumer, retention policy, and
    whether anything actually restores from it have not been verified this phase (static-only —
    tagged STATIC_ONLY per §0.3, capping at S2).
  blast_radius: >
    If .backups/ IS a live prod backup consumed by a restore workflow, deleting it is a data-loss
