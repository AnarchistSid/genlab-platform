- id: A-0040
  phase: 3
  host: vps
  title: "Alembic head n1i2j3k4l5m6 in DB, but VPS 'alembic heads' errors on missing script_location — migration hygiene unverifiable"
  category: ops
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod ''set -a; . /opt/genlab/.env; set +a; psql "$DATABASE_URL" -tAc "SELECT version_num FROM alembic_version"'''
      host: vps
      output: |
        n1i2j3k4l5m6
    - command: 'ssh genlab-prod ''cd /opt/genlab && uv run alembic heads 2>&1 | tail -3'''
      host: vps
      output: |
        FAILED: No 'script_location' key found in configuration.
  claim: >
    DB records `n1i2j3k4l5m6` as the current Alembic revision. The alembic CLI on
    VPS errors on invocation from /opt/genlab: "No 'script_location' key found in
    configuration." The alembic.ini is either missing, misconfigured, or expected
    at a different working directory. Cannot verify DB head vs migration script
    parity from the VPS side. Mac has no local genlab DB (A-0007) so Mac-side
    verification is impossible per spec.
  blast_radius: >
    Unverifiable migration hygiene means: (a) no confirmation that DB is at the
    latest migration head, (b) no way to check for unapplied migrations, (c) no
    detection if a migration was edited-after-application (a data-lossy pattern).
    Fix: locate/create alembic.ini on VPS in the invocation cwd. Test: `cd /opt/genlab &&
    uv run alembic current` should return `n1i2j3k4l5m6 (head)` — head status
    proves both files-on-disk and DB agree.
  effort: S
  proposed_action: fix
  supersedes: []

