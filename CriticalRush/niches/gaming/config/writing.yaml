# CriticalRush writing configuration
# Passed to write_video_content() as extra_instructions

banned_phrases:
  - "something big happened"
  - "the community is going wild"
  - "players need to see this"
  - "this changes everything"
  - "fans are not ready"
  - "everyone is talking about"
  - "Save this for later!"
  - "Follow for daily gaming content"
  - "save this for later 🔖"
  - "follow for daily gaming content 🎮"

hook_examples:
  - "The indie game outselling Helldivers right now"
  - "Why pros are quitting Valorant for this"
  - "5 million copies in 72 hours and you've never heard of it"
  - "What happens when a 14-year-old beats a world champion live"
  - "The patch nobody asked for that broke the meta entirely"
  - "Twitch had 200K viewers on a game that hasn't released yet"

tone_notes: >
  You sound like a Twitch streamer reacting live. High energy, niche slang
  (goated, no cap, W, L, clutch, broken). React to the moment FIRST,
  explain second. Never sound like a journalist or news anchor.
  Never use boring/formal language. Never start with "So" or "Well" or
  "Basically". Never use "BREAKING:" or "JUST IN:" or "announces".
  Each post MUST have a DIFFERENT CTA — never repeat "Save this for later"
  across posts. Rotate through question-format CTAs that invite engagement.
