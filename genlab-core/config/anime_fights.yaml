# EPISODE NUMBERS — status after ANIME-PEAK-05 §1.
#
# Resolved against AniList per-episode titles: 1 of 13.
#
#   tanjiro_vs_rui   ep 19  "Episode 19 - Hinokami"  (alias match, high)
#
# The other twelve are `episode_unresolved`. The reason is structural, not a
# bug: ANIME EPISODE TITLES ARE THEMATIC, NOT DESCRIPTIVE. "Hinokami",
# "Right and Wrong", "Cruelty" — none of them say which fight is inside. The
# alias path works only where a fight is famous enough that its nickname IS
# the episode title. Jikan, the second authority, returned HTTP 504 on every
# request during this pass.
#
# The useful corollary: an episode number only matters for a FULL-EPISODE
# source. Fights sourced from clip channels — Zoro, Luffy, Gojo, Deku,
# Tanjiro vs Akaza all came from Crunchyroll clips — need no episode number
# at all, because the clip IS the fight and names itself. Only the two
# full-episode sources depend on it:
#
#   sukuna_vs_mahoraga   Ani-One  "#41"      unverified
#   mob_vs_toichiro      Muse Asia "S2E12"   unverified, and suspect
#
# So the blocker is two fights, not thirteen, and hand-verification of two is
# cheap. Do not mark regions for those two until they are verified.

