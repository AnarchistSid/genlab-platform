      - "Scenes that once required $10K in equipment, can now be made on a phone"

  - id: "TRANSFORM_USED_TO"
    pattern: "What used to take {old_requirements} can now {now_possible}"
    category: "transformed_reality"
    trigger_elements: ["old_requirements", "now_possible"]
    engagement_score: 0.85
    max_words: 14
    examples:
      - "What used to take a 20-person team can now be done by one person with AI"
      - "What used to take 6 months of training can now be learned in a weekend"

  - id: "TRANSFORM_TOPIC"
    pattern: "{topic} is being completely transformed by AI"
    category: "transformed_reality"
    trigger_elements: ["topic"]
    engagement_score: 0.84
    max_words: 9
    examples:
      - "Filmmaking is being completely transformed by AI"
      - "Music production is being completely transformed by AI"

  - id: "TRANSFORM_PRODUCT"
    pattern: "{product} just made {topic} accessible to everyone"
    category: "transformed_reality"
    trigger_elements: ["product", "topic"]
    engagement_score: 0.85
    max_words: 10
    examples:
      - "Sora just made filmmaking accessible to everyone"
      - "Claude just made coding accessible to everyone"

  # ── INTRIGUE / PROBLEM ─────────────────────────────────────
  # Hooks that surface overlooked issues or accelerating trends.
  # Use for: think pieces, industry shifts, emerging concerns.

  - id: "INTRIGUE_DETACHED"
    pattern: "{topic} are starting to feel completely detached from reality"
    category: "intrigue"
    trigger_elements: ["topic"]
    engagement_score: 0.85
    max_words: 11
    examples:
      - "AI images are starting to feel completely detached from reality"
      - "AI benchmarks are starting to feel completely detached from reality"

  - id: "INTRIGUE_NOBODY"
    pattern: "Nobody is talking about {surprising_fact}"
    category: "intrigue"
    trigger_elements: ["surprising_fact"]
    engagement_score: 0.84
    max_words: 10
    examples:
      - "Nobody is talking about how fast AI coding has gotten"
      - "Nobody is talking about the real cost of AI training"

  - id: "INTRIGUE_FASTER"
    pattern: "{topic} is happening faster than anyone expected"
    category: "intrigue"
    trigger_elements: ["topic"]
    engagement_score: 0.84
    max_words: 9
    examples:
      - "AI video generation is happening faster than anyone expected"
      - "The AI job displacement is happening faster than anyone expected"

  - id: "INTRIGUE_COMPANY"
    pattern: "{company} just proved that {surprising_fact}"
    category: "intrigue"
    trigger_elements: ["company", "surprising_fact"]
    engagement_score: 0.85
    max_words: 11
    examples:
      - "OpenAI just proved that AI can reason about physics"
      - "Google just proved that small models can beat large ones"

# ── Category priority (for formula matching) ─────────────
# Higher = tried first when multiple categories match
category_priority:
  emotional_reaction: 8     # Highest: conversational engagement drivers
  alert_contrast: 7         # Strong: surprise + emoji-led attention
  showcase: 6
  storytelling: 6            # Narrative hooks for creator content
  transformed_reality: 5    # Before/after contrast
  intrigue: 5                # Overlooked issues, accelerating trends
  breaking: 4                # Demoted: formal news style (avoid)
  milestone: 3
  reaction: 3
  comparison: 3
  curiosity: 2
  controversy: 2
  tutorial: 2
  prediction: 1
  universal: 0

# ── Scoring weights ──────────────────────────────────────
scoring_weights:
  # Core factors (weighted, sum to 1.0)
  formula_base: 0.40       # Base engagement score from formula
  element_coverage: 0.25   # How many placeholders were filled
  specificity: 0.20        # Named entities > generic topics
  brevity: 0.15            # Shorter hooks score higher

  # Competitive boosts (additive bonuses, capped at 1.0 total)
  emoji_boost: 0.18        # Emoji-driven hooks perform best (increased from 0.15)
  caps_urgency_boost: 0.05 # Reduced: ALL CAPS reads as formal/news-like (was 0.12)
  numbers_boost: 0.10      # Contains any digit (specificity = credibility)
  length_boost: 0.08       # Under 60 chars (mobile readability)
  urgency_boost: 0.10      # FOMO language (now, just, breaking, quietly)
  question_boost: 0.05     # Ends with ? (engagement trigger)
  dollar_boost: 0.08       # Contains $ (financial stakes = attention)
  contrarian_boost: 0.12   # Contrarian language (wrong, actually, truth, nobody)
  conversational_boost: 0.15  # First-person / lowercase emotional language
