# Alerting threshold definitions for Gen Lab pipeline observability.
#
# These thresholds are consumed by monitoring / health-check code to
# determine when to fire alerts.  Values are intentionally conservative
# for the current 5-channel setup and should be tightened as the system
# stabilises.

thresholds:
  # Maximum acceptable p95 pipeline duration (seconds).
  # Pipelines consistently above this indicate a performance regression.
  #
  # 2026-08-13: raised 600 -> 1800 after live audit found EVERY run
  # exceeds 600s (ai_creators 20min, movies 23min, sports 26min,
  # anime 14min). Root cause is 4GB VPS reality:
  #   * VisualRenderStrategy 5-18 min (FFmpeg encoding on limited CPU)
  #   * FetchRedditClips 5 min (sequential Reddit API + probes)
  # Together those are 60-80% of each pipeline's runtime.
  #
  # 600s was aspirational for a beefier machine that never landed.
  # 1800s (30 min) matches current-VPS reality with headroom to
  # detect genuine regressions (e.g., an LLM call blocking 5 min
  # would push past 30 min). Real optimization work (parallel
  # Reddit fetch, encoder tuning) deserves its own session — this
  # config change just stops chronic false alarms from drowning
  # real perf signals.
  pipeline_duration_p95_seconds: 1800

  # Maximum 24-hour error rate (percent of pipeline runs that fail).
  error_rate_24h_pct: 10

  # Disk usage percent at which the warning alert fires (health_monitor
  # check_disk). The critical alert fires +10 points above this — so 80
  # → warn, 90 → critical with the default. Wired 2026-06-08 (audit M-1).
  disk_usage_pct: 80

  # Swap thresholds for health_monitor.check_swap. The critical (imminent
  # OOM on the 4 GB box) fires above ``swap_critical_pct`` of total swap;
  # the soft warning fires above ``swap_warning_mb`` of absolute usage.
  swap_warning_mb: 500
  swap_critical_pct: 0.9

  # Minimum engagement replies processed in a 1-hour window.
  # Alert if no replies are processed (indicates poller or worker down).
  engagement_reply_rate_1h: 0

affiliate:
  zero_match_runs_alert: 3     # alert if 3+ consecutive runs have 0 matches
  min_match_rate_pct: 5        # alert if match rate drops below 5%
  placeholder_url_alert: true  # alert on example.com URLs in catalog
  link_health_failures: 5      # alert if 5+ URLs are broken

publishing:
  # Alert if any niche fails to publish for N consecutive scheduled windows
  consecutive_missed_publishes: 2
  # Alert if platform success rate drops below this (30-day rolling window)
  min_success_rate_pct: 60
  # Alert if credential failure (SKIPPED) count exceeds this per day
  max_credential_skips_per_day: 10
  # Alert if YouTube quota usage exceeds this percentage
  youtube_quota_usage_pct: 80
  # Alert if CDN upload failures exceed this count per day
  max_cdn_failures_per_day: 3
  # Alert if PUBLISH_FAILED blueprints exceed this count
  max_publish_failed_blueprints: 5
  # Alert if gatekeeper blocks all blueprints for a niche N times in a row
  gatekeeper_blocked_consecutive: 3
