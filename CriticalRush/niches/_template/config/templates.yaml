# FrameDrift content templates — trend-cycle-aware hook routing

hooks:
  formulas:
    - "{title} just hit different this episode"
    - "The animation in {title} is on another level"
    - "{title} deserves a spot on your list"
  forbidden_styles:
    - "BREAKING:"
    - "JUST IN:"
    - "REPORT:"
    - "EXCLUSIVE:"
    - "announces"
    - "reveals"
    - "weighs in on"
    - "speaks out"
    - "reacts to"
    - "according to"
    - "sources say"
    - "report suggests"
    - "releases, march"
    - "release schedule"
    - "weekly releases"
    - "here's why"
    - "doesn't need to"
    - "the case for"

  story_categories:
    anime_premiere:
      formulas:
        - "The {title} premiere just dropped and it's PEAK"
        - "Need to binge {title} immediately"
        - "{title} just aired and it's PEAK"
        - "{title} episode {episode} just raised the bar"
      weight: 1.3
    voice_actor_trigger:
      formulas:
        - "{voice_actor} just made {title} the most hyped anime of the season"
        - "One announcement and now everyone's watching {title}. Classic {voice_actor} effect"
        - "{voice_actor} in {title} just became the role of the season"
      weight: 1.4
    manga_release:
      formulas:
        - "{title}'s latest chapter just dropped and the fandom is split"
        - "The {season} anime lineup is stacked. Here's what's actually worth watching"
        - "{studio} cooked for {title}. No notes"
      weight: 1.1
    studio_collab:
      formulas:
        - "The {studio1} x {studio2} collab is everything we needed and more"
        - "Nobody predicted {studio1} and {studio2} teaming up. The anime gods delivered"
      weight: 1.2
    trend_emerging:
      formulas:
        - "The {trend_name} trend is quietly taking over anime. Watch this space"
        - "Early watchers already caught {trend_name}. Are you catching on?"
        - "This is how the {trend_name} wave starts. You heard it here first"
      weight: 1.0
    default:
      formulas:
        - "{title} just hit different this episode"
        - "The animation in {title} is on another level"
        - "{title} deserves way more attention"
      weight: 1.0

captions:
  max_length: 2200
  target_length: 300
  cta_library:
    - "Would you add this to your list?"
    - "Drop your top 3 anime this season"
    - "Save this for your watchlist"
    - "Rate this anime 1-10 in the comments"
    - "What are you thinking? Drop your take below"
  hashtag_pool:
    - "#FrameDrift"
    - "#Anime"
    - "#AnimeWeek"
    - "#AnimeFans"
    - "#AnimeRecommendations"
    - "#Manga"
    - "#MangaCommunity"
    - "#Otaku"
    - "#AnimeCosplay"
    - "#SeasonalAnime"
    - "#AnimeArt"
    - "#AnimeCommunity"
  hashtags_per_post: 4

youtube:
  title_max_length: 40
  title_must_be_question: true

platforms:
  instagram:
    reel_duration_target_seconds: 25
    caption_ends_with_cta: true
    hashtag_count: 4
    no_external_urls_in_caption: true
    structure: "hook + 2-3 lines of trend observation + question CTA + 4 hashtags"
  youtube:
    title_format: "question"
    title_max_chars: 40
    description_includes_subscribe_cta: true
    structure: "hook (= title words) + 1 setup line + no hashtags"
  x_twitter:
    link_in_reply_not_tweet: true
    max_tweet_chars: 280
    hashtag_count: 2
    structure: "hook + 1 line, no links in main post"
  facebook:
    caption_length_target: 300
    include_engagement_question: true
    hashtag_count: 3
    structure: "hook + 2-3 lines + engagement question + 3 hashtags"
  tiktok:
    max_caption_length: 2200
    hashtag_count: 2
    structure: "hook + 1 punchy line + 2 hashtags"
  threads:
    max_caption_length: 500
    hashtag_count: 2
    structure: "hook + 2 lines + 2 hashtags"
