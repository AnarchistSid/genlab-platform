# Postiz — social media scheduling (shadow eval)
# DISABLED: Stopped in Sprint 45B pending active integration.
# All containers stopped to eliminate restart-loop noise.
# To re-enable: docker compose up -d
# Logs:  docker compose logs -f postiz

services:
  # ── Postiz stack ─────────────────────────────────────────────
  postiz-postgres:
    image: postgres:16-alpine
    container_name: genlab-postiz-postgres
    environment:
      POSTGRES_DB: postiz
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: postiz_local_dev
    volumes:
      - postiz-pgdata:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz"]
      interval: 5s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7-alpine
    container_name: genlab-postiz-redis
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    container_name: genlab-postiz
    ports:
      - "5100:5000"
    env_file:
      - ../../docker/.env.docker
    environment:
      DATABASE_URL: postgresql://postiz:postiz_local_dev@postiz-postgres:5432/postiz
      REDIS_URL: redis://postiz-redis:6379
      JWT_SECRET: genlab-postiz-dev-secret-change-me
      MAIN_URL: https://postiz.aspirehub.ai
      FRONTEND_URL: https://postiz.aspirehub.ai
      NEXT_PUBLIC_BACKEND_URL: https://postiz.aspirehub.ai/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      # ── Social provider OAuth credentials (from .env.docker) ──
      X_API_KEY: ${X_API_KEY}
      X_API_SECRET: ${X_API_SECRET}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-2203397347132949}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-1416127452837173}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_started
    networks:
      - postiz-network
      - temporal-network
    restart: unless-stopped

  # ── Temporal stack (required by Postiz) ──────────────────────
  temporal-postgres:
    image: postgres:16-alpine
    container_name: genlab-temporal-postgres
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal_local_dev
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: genlab-temporal-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes:
      - temporal-esdata:/usr/share/elasticsearch/data
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: genlab-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal_local_dev
      - POSTGRES_SEEDS=temporal-postgres
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - DEFAULT_NAMESPACE=default
    depends_on:
      temporal-postgres:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    networks:
      - temporal-network
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    container_name: genlab-temporal-ui
    ports:
      - "8089:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      - temporal
    networks:
      - temporal-network

networks:
  postiz-network:
  temporal-network:

volumes:
  postiz-pgdata:
  postiz-config:
  postiz-uploads:
  temporal-pgdata:
  temporal-esdata:
