# ═══════════════════════════════════════════════════════════════
# Content-type → category mapping (human-friendly routing)
#
# Used by select_mid_hook(content_type="breaking_news") to pick
# the right category without needing a template_id.
#
# Maps content descriptors to the primary category that should be
# selected. The selection logic also picks based on duration:
#   15-25s: optional (engagement_weight threshold raised to 0.90)
#   26-40s: recommended (normal threshold)
#   41-60s: mandatory (engagement_weight threshold lowered to 0.75)
# ═══════════════════════════════════════════════════════════════
content_type_map:
  # Breaking / urgent news → consequence + stakes
  breaking_news: consequence
  urgent: consequence
  breaking: consequence

  # Tutorial / demo → teaser + suspense
  tutorial: teaser
  demo: teaser
  how_to: teaser

  # Comparison → reveal + surprise
  comparison: reveal
  vs: reveal

  # Industry analysis → question + engagement
  industry_analysis: question
  analysis: question
  opinion: question

  # Big numbers → statistics + proof
  big_numbers: statistics
  data: statistics
  research: statistics

  # General news → consequence (lower urgency)
  news: consequence
  report: consequence

  # Debate / controversy → reveal
  debate: reveal
  controversy: reveal

# ═══════════════════════════════════════════════════════════════
# Template → category mapping (automated pipeline routing)
# ═══════════════════════════════════════════════════════════════
template_category_map:
  TPL_BRK1: consequence
  TPL_REE1: consequence
  TPL_REE2: teaser
  TPL_TUT1: teaser
  TPL_DEB1: reveal
  TPL_CON1: reveal
  TPL_VIS1: question
  TPL_HUM1: question
  TPL_WRU1: consequence
  TPL_POL1: question
  TPL_UGC1: teaser
  TPL_UGR1: teaser

# Duration urgency tiers — controls whether mid-hook is injected
# and adjusts selection threshold.
#
#   Tier       Duration    Behavior
#   ─────────  ──────────  ────────────────────────────────
#   optional   15-25s      Only inject if weight ≥ 0.90
#   recommended 26-40s     Normal injection (weight ≥ 0.80)
#   mandatory  41-60s      Always inject (weight ≥ 0.75)
#   skip       <15s        Never inject (too short)
#   skip       >60s        Content after 60s already drops; not our format
duration_urgency:
  skip_below_seconds: 15
  optional:
    min_seconds: 15
    max_seconds: 25
    min_weight: 0.90          # Only high-confidence hooks for short content
  recommended:
    min_seconds: 26
    max_seconds: 40
    min_weight: 0.80          # Normal threshold
  mandatory:
    min_seconds: 41
    max_seconds: 60
    min_weight: 0.75          # Lower bar — any decent hook helps at this length

# Fallback when template_id and content_type are unknown
default_category: universal
