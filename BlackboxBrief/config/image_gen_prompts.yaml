# ═══════════════════════════════════════════════════════════════
# Topic priority — when a story matches multiple tags, highest
# priority wins. Visual topics produce the most distinctive images.
# Mirrors topic_weights.yaml ordering.
# ═══════════════════════════════════════════════════════════════
topic_priority:
  - creative
  - pop_culture
  - money
  - human_impact
  - robots
  - products
  - safety
  - tools
  - debate
  - industry

# ═══════════════════════════════════════════════════════════════
# Quality validation + generation limits
# ═══════════════════════════════════════════════════════════════
validation:
  min_file_size_bytes: 51200    # 50KB — real gpt-image-1 PNGs are 300-800KB
  max_candidates: 2             # Generate at most 2 before giving up
  cost_per_image_usd: 0.02     # gpt-image-1 low quality

# ═══════════════════════════════════════════════════════════════
# Cache settings
# ═══════════════════════════════════════════════════════════════
cache:
  ttl_days: 7                   # Generated images don't expire like news
  subdir: "image_gen"           # Stored in .tmp/cache/image_gen/

# ═══════════════════════════════════════════════════════════════
# Feature toggles + daily budget
# ═══════════════════════════════════════════════════════════════
# Curation-first mode: prefer sourced creator/company media over generated art.
# Keep this OFF for aggregation workflows unless explicitly running fallback tests.
enable_ai_backgrounds: false
max_ai_images_per_day: 50         # Hard cap on API calls per calendar day ($1/day at $0.02/image)
daily_budget_usd: 1.00            # Soft warning threshold — logs warning when exceeded

# ═══════════════════════════════════════════════════════════════
# Candidate scoring weights (select_best_ai_image)
# ═══════════════════════════════════════════════════════════════
scoring:
  weights:
    file_size: 0.4                # Larger file = more detail (300-800KB typical for gpt-image-1)
    aspect_ratio: 0.3             # Closeness to target aspect ratio (1080:1350 = 0.8)
    prompt_specificity: 0.3       # Topic+entity match quality from build_contextual_prompt
  min_acceptable_score: 0.3       # Reject candidates scoring below this threshold
  file_size_optimal_kb: 500       # Score = min(1.0, actual_kb / optimal_kb)
