      - "\U0001F6A8 Meta quietly open-sourced their best model, and nobody noticed"

  # ── STORYTELLING SETUP ─────────────────────────────────────
  # Narrative-driven hooks that pull viewers into a story.
  # Use for: creator spotlights, viral content, person-centric stories.

  - id: "STORY_BLOWING_UP"
    pattern: "The story of {topic} has been blowing up across the internet"
    category: "storytelling"
    trigger_elements: ["topic"]
    engagement_score: 0.88
    max_words: 12
    examples:
      - "The story of this AI artist has been blowing up across the internet"
      - "The story of Sora's first movie has been blowing up across the internet"

  - id: "STORY_CREATOR_USED"
    pattern: "This {role} used {tool} to {achievement}"
    category: "storytelling"
    trigger_elements: ["role", "tool", "achievement"]
    engagement_score: 0.87
    max_words: 12
    examples:
