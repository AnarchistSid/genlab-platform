# SpliceReel publishing configuration — all 6 platforms

niche_id: movies

platforms:
  instagram:
    enabled: true
    account_id: ""  # Set via SPLICEREEL_META_IG_USER_ID env var
    schedule_slots:
      - "12:00"
    content_types: [reels, carousels, stories]
    aspect_ratios:
      reels: "9:16"
      carousels: "1:1"
      stories: "9:16"
  youtube:
    enabled: true
    channel_id: "UCdqiuSQOiSp-t3IFzhbcvzQ"
    content_types: [shorts]
    aspect_ratio: "9:16"
    title_format: question
    max_title_length: 40
  x:
    # Disabled 2026-06-05: see ClutchWire/config/publishing.yaml — no creds,
    # 100% SKIPPED, negligible engagement everywhere.
    enabled: false
    account_id: null  # TODO: Create X developer app for SpliceReel
    content_types: [video_tweet, image_tweet]
    aspect_ratio: "9:16"
    link_placement: first_reply   # CRITICAL: no links in main tweet
  facebook:
    enabled: true
    page_id: "185096185262126"
    content_types: [reels, video_posts]
    aspect_ratio: "9:16"
  tiktok:
    enabled: false
    account_id: null
    content_types: [video]
    aspect_ratio: "9:16"
    note: >-
      Pending TikTok developer app approval.
      Set enabled: true and add TIKTOK_ACCESS_TOKEN to .env when approved.
  threads:
    # Disabled 2026-06-05: see ClutchWire/config/publishing.yaml — 100%
    # container-creation failures since tokens expired; engagement was
    # single-digit anyway for movies.
    enabled: false
    account_id: null  # TODO: Generate Threads token for @splicereel
    content_types: [video_post, text_post]
    aspect_ratio: "1:1"
