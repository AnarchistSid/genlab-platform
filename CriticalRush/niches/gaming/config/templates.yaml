# CriticalRush content templates

hooks:
  # Hook formulas — {game}, {detail}, {player}, {streamer} filled by _substitute_placeholders
  # Style: emotional, community-insider, never formal news language.
  formulas:
    - "{game} dropped something wild"
    - "wait... {game} really did this??"
    - "this {game} play is unreal"
    - "{player} went absolutely OFF in {game}"
    - "the {game} meta shifted hard"
    - "{streamer} can't believe what happened"
    - "they actually added THIS to {game}"
    - "{game} devs heard the community for once"
    - "this {game} clip has me speechless"
    - "peak {game} content right here"
    - "{game} ranked is built different rn"
    - "nobody expected THIS from {game}"
    - "this {game} update changes ranked forever"
    - "{player} pulled off the impossible in {game}"
    - "{game} hit different after this"
    - "the {game} community is eating rn"
    - "competitive {game} got interesting"
    - "{streamer} broke {game} in the funniest way"
    - "this {game} moment will be replayed forever"
    - "honestly {game} cooked with this one"
  story_categories:
    clutch_play:
      formulas:
        - "this {game} play is unreal"
        - "{player} went absolutely OFF in {game}"
        - "{player} pulled off the impossible in {game}"
        - "this {game} moment will be replayed forever"
    update_drop:
      formulas:
        - "{game} dropped something wild"
        - "they actually added THIS to {game}"
        - "{game} devs heard the community for once"
        - "this {game} update changes ranked forever"
    streamer_moment:
      formulas:
        - "{streamer} can't believe what happened"
        - "{streamer} broke {game} in the funniest way"
        - "peak {game} content right here"
    meta_shift:
      formulas:
        - "the {game} meta shifted hard"
        - "competitive {game} got interesting"
        - "{game} ranked is built different rn"
    default:
      formulas:
        - "wait... {game} really did this??"
        - "honestly {game} cooked with this one"
        - "{game} hit different after this"
        - "the {game} community is eating rn"

  # Never use these styles — too formal, too news-like
  forbidden_styles:
    - "BREAKING:"
    - "JUST IN:"
    - "REPORT:"
    - "EXCLUSIVE:"
    - "announces"
    - "reveals"
    - "weighs in on"
    - "speaks out"
    - "reacts to"
    - "according to"
    - "sources say"
    - "report suggests"
    - "here's why"
    - "doesn't need to"
    - "the case for"
    - "buying guide"

captions:
  max_length: 2200           # Instagram character limit
  target_length: 300         # Sweet spot for engagement
  cta_library:
    - "drop a 🎮 if you're playing this"
    - "tag someone who mains this"
    - "who else caught this live?"
    - "comment your hot take below 👇"
    - "agree or disagree?"
    - "name a better play 🎮"
    - "rate this 1-10"
    - "thoughts? 💀"
  hashtag_pool:
    - "#gaming"
    - "#gamer"
    - "#games"
    - "#videogames"
    - "#gamingcommunity"
    - "#pcgaming"
    - "#consolegaming"
    - "#esports"
    - "#twitchstreamer"
    - "#gaminglife"
  hashtags_per_post: 4

youtube:
  title_max_length: 40
  title_must_be_question: true
  title_formulas:
    - "Is {game} Actually Worth It?"
    - "Did {game} Just Change Everything?"
    - "What Happened to {game}?"
    - "Why Is Everyone Playing {game}?"
    - "Can {game} Beat the Competition?"

platforms:
  instagram:
    reel_duration_target_seconds: 25
    caption_ends_with_cta: true
    hashtag_count: 4
    no_external_urls_in_caption: true
  youtube:
    title_format: "question"
    title_max_chars: 40
    description_includes_subscribe_cta: true
  x_twitter:
    link_in_reply_not_tweet: true
    max_tweet_chars: 280
    hashtag_count: 2
  facebook:
    caption_length_target: 300
    include_engagement_question: true
