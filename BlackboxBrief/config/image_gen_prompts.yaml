  microsoft: "an Azure-blue cloud computing environment with floating data, "
  apple: "an Apple-style product on a glossy white surface with soft reflections, "
  chatgpt: "a phone screen showing a conversational AI interface with a warm glow, "
  gemini: "a multicolored crystalline AI interface with prismatic light, "
  claude: "an abstract warm amber neural pattern on a dark background, "
  sora: "a cinematic film frame being generated from pixels, "
  midjourney: "a canvas where digital brushstrokes transform into photorealistic art, "
  dall-e: "an easel where abstract shapes morph into detailed images, "
  dalle: "an easel where abstract shapes morph into detailed images, "
