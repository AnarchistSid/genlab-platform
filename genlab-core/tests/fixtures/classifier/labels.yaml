source: live production fetches — clips downloaded by the niche fetchers into .tmp/runs/*/clips on prod,
  trimmed to 5s. Not retention, not synthetic.
labelling: by CONTENT TYPE from the candidate title and niche, deliberately NOT from the classifier's
  own signals — labelling from the signals would make the gate measure the classifier against itself.
labelled_by: Claude (assistant), not the operator. Treat as provisional.
still_items: 'generated the way the pipeline renders a footage-free blueprint: a held frame from a real
  candidate with a slow push. KNOWN FIXTURE FLAW: they carry no audio track, so speech_ratio is trivially
  0.00 and the STILL row of the confusion matrix is easier than production. A real footage-free item has
  TTS narration. Fix before trusting the STILL column.'
