  # ══════════════════════════════════════════════════════════
  # CONVERSATIONAL / @evolving.ai STYLE HOOKS
  # ══════════════════════════════════════════════════════════
  # Emotional, first-person, emoji-driven hooks for creator
  # content channels. These replace formal "BREAKING:" style
  # with conversational reaction hooks that drive engagement
  # through empathy, surprise, and storytelling.
  #
  # New placeholders (filled by extract_conversational_elements):
  #   {story_summary}        — 3-6 word summary of what happened
  #   {creator_achievement}  — what the creator/tool accomplished
  #   {visual_description}   — what was visually impressive
  #   {surprising_fact}      — the unexpected detail
  #   {old_requirements}     — what it used to require
  #   {now_possible}         — what's now easy/accessible
  #   {role}                 — person type (artist, filmmaker, developer)
  #   {tool}                 — specific AI tool used
  #   {achievement}          — what they accomplished

  # ── EMOTIONAL REACTION ─────────────────────────────────────
  # First-person emotional response. Highest engagement category.
  # Use for: impressive results, heartwarming stories, creative work.

  - id: "EMOTE_NEEDED"
    pattern: "I needed this \U0001F62D {story_summary}"
    category: "emotional_reaction"
    trigger_elements: ["story_summary"]
    engagement_score: 0.92
    max_words: 10
    examples:
      - "I needed this \U0001F62D OpenAI just made coding accessible to everyone"
      - "I needed this \U0001F62D AI can now generate music from humming"

  - id: "EMOTE_AMAZING"
    pattern: "This turned out amazing \U0001F60D {creator_achievement}"
    category: "emotional_reaction"
    trigger_elements: ["creator_achievement"]
    engagement_score: 0.91
    max_words: 10
    examples:
      - "This turned out amazing \U0001F60D a full short film made entirely with AI"
      - "This turned out amazing \U0001F60D Sora generating photorealistic nature scenes"

  - id: "EMOTE_CREATIVITY"
    pattern: "This gets a 10/10 for creativity \U0001F525 {visual_description}"
    category: "emotional_reaction"
    trigger_elements: ["visual_description"]
    engagement_score: 0.90
    max_words: 12
    examples:
      - "This gets a 10/10 for creativity \U0001F525 AI-generated architecture that looks real"
      - "This gets a 10/10 for creativity \U0001F525 turning sketches into photorealistic portraits"

  - id: "EMOTE_OBSESSED"
    pattern: "I'm obsessed with this \U0001F92F {story_summary}"
    category: "emotional_reaction"
    trigger_elements: ["story_summary"]
    engagement_score: 0.90
    max_words: 10
    examples:
      - "I'm obsessed with this \U0001F92F AI video generation just leveled up"
      - "I'm obsessed with this \U0001F92F real-time AI music composition"

  - id: "EMOTE_WILD"
    pattern: "This is wild \U0001F525 {surprising_fact}"
    category: "emotional_reaction"
    trigger_elements: ["surprising_fact"]
    engagement_score: 0.89
    max_words: 10
    examples:
      - "This is wild \U0001F525 AI generated a full movie trailer in 30 seconds"
      - "This is wild \U0001F525 this model understands physics better than most humans"

  - id: "EMOTE_CANT_STOP"
    pattern: "I can't stop watching this \U0001F60D {visual_description}"
    category: "emotional_reaction"
    trigger_elements: ["visual_description"]
    engagement_score: 0.88
    max_words: 10
    examples:
      - "I can't stop watching this \U0001F60D AI-animated Studio Ghibli scenes"
      - "I can't stop watching this \U0001F60D photorealistic AI portraits coming alive"

  - id: "EMOTE_PRODUCT_WILD"
    pattern: "This is wild \U0001F525 {product} just {claim}"
    category: "emotional_reaction"
    trigger_elements: ["product", "claim"]
    engagement_score: 0.89
    max_words: 10
    examples:
      - "This is wild \U0001F525 Sora just generated a full movie scene"
      - "This is wild \U0001F525 Claude just wrote an entire app from scratch"

  # ── ALERT / CONTRAST ───────────────────────────────────────
  # Emoji-led alerts that subvert expectations. Second highest category.
  # Use for: surprising reveals, illusion content, unexpected truths.

  - id: "ALERT_NEVER_EXISTED"
    pattern: "\U0001F6A8 {claim}, but it never existed"
    category: "alert_contrast"
    trigger_elements: ["claim"]
    engagement_score: 0.90
    max_words: 12
    examples:
      - "\U0001F6A8 This photo looks completely real, but it never existed"
      - "\U0001F6A8 This building won architecture awards, but it never existed"

  - id: "ALERT_CONSEQUENCE"
    pattern: "\U0001F6A8 {story_summary}, and {surprising_fact}"
    category: "alert_contrast"
    trigger_elements: ["story_summary", "surprising_fact"]
    engagement_score: 0.89
    max_words: 14
    examples:
      - "\U0001F6A8 AI video is getting scarily realistic, and Hollywood is panicking"
      - "\U0001F6A8 This AI model just passed the bar exam, and lawyers aren't laughing"

  - id: "ALERT_HERES_WHY"
    pattern: "\u26A0\uFE0F {surprising_fact} — and here's why"
