- id: A-0051
  phase: 5
  host: vps
  title: "/opt/genlab/.env mode 644 world-readable on VPS — any shell user reads live prod credentials"
  category: security
  severity: S1
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "ls -la /opt/genlab/.env"'
      host: vps
      output: |
        -rw-r--r-- 1 genlab genlab 16558 Jul 23 22:38 /opt/genlab/.env
  claim: >
    The live prod .env file on VPS is mode 644 (world-readable). Any user with any shell
    on the VPS — including future support access, compromised low-privilege services,
    debugging shells — reads all 208 credential values including DATABASE_URL,
    ANTHROPIC_API_KEY, per-niche Meta EAA tokens, etc.
  blast_radius: >
    In the current single-operator deploy this is theoretical (only genlab + root shell
    exist), but the exposure surface widens with every added user. Combined with
    A-0053 (genlab_*** still-live-rotation-not-done) and A-0055 (post-BFG re-introduction
    of secrets), the credential-hygiene surface is the largest single risk in the audit.
    Fix: chmod 600 /opt/genlab/.env; verify all consumers still authenticate (they should,
    since genlab is the owning user and root can read anything anyway).
  effort: S
  proposed_action: fix
  supersedes: []

- id: A-0052
  phase: 5
  host: vps
  title: "7 of 14 .env.bak.* files (2026-07-23+) are 644 world-readable — permission drift started 2026-07-23"
  category: security
  severity: S2
  confidence: high
  tags: []
  evidence:
    - command: 'ssh genlab-prod "ls -la /opt/genlab/.env.bak* | awk ''{print \$1, \$9}''"'
      host: vps
      output: |
        -rw------- .env.bak.1784640444
        -rw------- .env.bak.20260622-165154
        -rw------- .env.bak.20260622-180609
        -rw------- .env.bak.20260717
        -rw------- .env.bak.20260718_125959
        -rw------- .env.bak.20260718_131614_anticipation_flags
        -rw------- .env.bak.20260718_132557_thompson_prop
        -rw-r--r-- .env.bak.20260723_154728_slo_disable
        -rw-r--r-- .env.bak.20260723_155549_threads_sync
        -rw-r--r-- .env.bak-shadow-1784823647
        -rw-r--r-- .env.bak-autonomy-flags-1784825710
        -rw-r--r-- .env.bak-autonomy-round2-1784826525
        -rw-r--r-- .env.bak.stochastic-widen-2026-07-23
  claim: >
    All .env.bak.* files created on or after 2026-07-23 have mode 644 (world-readable);
    all older ones are 600. The permission drift is real — someone/something switched
    from `chmod 600` to letting the umask default apply (022 → 644) on 2026-07-23. 7
    world-readable backup files hold snapshots of prod credentials at that time.
  blast_radius: >
    Every .bak file contains a full snapshot of .env at creation time — so a rotated
    credential is still exposed via any backup taken before rotation. Coordinated with
    A-0016 (13 total .env.bak.* files on both hosts) and A-0053 (rotation not done): if
    rotation eventually happens, all 7 world-readable + 7 chmod-600 backups still hold
    the un-rotated credential. Fix path: chmod 600 all backups now; institute a policy
    that .env writers use umask 077 or explicit chmod 600 post-write.
  effort: S
  proposed_action: fix
  supersedes: []

