- id: A-0020
  phase: 1
  host: vps
  title: "genlab-core/config/cuelinks_campaigns.yaml is regenerated on VPS weekly; git-tracked file still says 'AUTO-GENERATED — do not hand-edit' — VPS-only state slipping through git blind spot"
  category: correctness
  severity: S3
  confidence: high
  tags: []
  evidence:
    - command: 'head -1 genlab-core/config/cuelinks_campaigns.yaml'
      host: mac
      output: |
        # AUTO-GENERATED — do not hand-edit.
    - command: 'ssh genlab-prod "cd /opt/genlab && git status --porcelain genlab-core/config/cuelinks_campaigns.yaml && wc -l genlab-core/config/cuelinks_campaigns.yaml"'
      host: vps
      output: |
         M genlab-core/config/cuelinks_campaigns.yaml
        903 genlab-core/config/cuelinks_campaigns.yaml
    - command: 'systemctl list-units --plain --no-legend "genlab-cuelinks-campaign-refresh.timer"'
      host: vps
      output: |
        genlab-cuelinks-campaign-refresh.timer                            loaded active   waiting GenLab Cuelinks campaign shortlist refresh (weekly)
  claim: >
    The file starts with "AUTO-GENERATED — do not hand-edit." A weekly systemd timer on
    the VPS (genlab-cuelinks-campaign-refresh.timer) rewrites the file in place, growing
    it from 19 lines (Mac copy) to 903 lines (VPS copy). Nothing commits the regenerated
    version back to git.
  blast_radius: >
    Any operator or agent reading the git-tracked file sees the 19-line skeleton and
    misses the actual 903-line current state used by the campaign matcher. This is the
    same class-of-bug shape as A-0002/A-0012 (VPS-local truth diverges from git) but for
    a *machine-written* file rather than an operator-written config. Fix options:
    (a) don't track the file, put a sample/schema in git and generate at boot on any host;
    (b) commit-back on regeneration via a bot; (c) accept git-only-schema + document the
    "true content lives on VPS" caveat prominently. Choose based on what secrets/state
    the file holds — if none, (a) is cheapest.
  effort: M
  proposed_action: investigate
  supersedes: []
