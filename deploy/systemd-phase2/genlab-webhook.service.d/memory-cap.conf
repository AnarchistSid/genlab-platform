# 2026-07-17: hard memory cap for OOM safety on 4 GB Hetzner VPS.
#
# Observed steady-state RSS: ~49 MB (uvicorn + FastAPI, no in-flight
# webhook payloads). Meta webhook payloads are small (~1-5 KB each);
# no batching. Cap at 200 MB gives 4× headroom.
#
# See genlab-dashboard.service.d/memory-cap.conf for full rationale.

[Service]
MemoryMax=200M
