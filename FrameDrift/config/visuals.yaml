# Consumed by genlab_core.media.VideoCompositor via VisualConfig
# Shared structural standards — all 5 channels use identical values

niche_id: anime
logo_path: "assets/logos/FrameDrift-Logo.png"
accent_color: "#7B3FE4"  # FrameDrift violet

# Structural standards (identical across all channels)
top_bar_height_pct: 0.24
bottom_bar_height_pct: 0.34
hook_font_size: 44
hook_x_offset: 24
logo_height_px: 60
logo_x_offset: 24
bar_color: [0, 0, 0]
hook_color: [255, 255, 255]
landscape_mode: "blurred_pillarbox"
platforms_vertical: ["instagram", "youtube", "tiktok", "threads", "facebook", "twitter"]
platforms_landscape: []

# Frame layout is defined in genlab_core/media/frame_compositor.py (source of truth).
# See frame_compositor.py constants for current pixel positions.


# FFmpeg render settings
ffmpeg:
  preset: medium            # target preset for quality (veryslow|slow|medium|fast|ultrafast)
  fallback_preset: fast   # used if render exceeds timeout
  timeout_seconds: 600    # max seconds for FFmpeg subprocess

# Word-by-word caption animation
# Disabled 2026-06-13 across all 5 channels until the text_optimizer regression
# is properly fixed. The module that did adaptive font sizing was silently
# dropped during the 2026-04-04 monorepo conversion, so word_animator.py's
# fallback fontsize=160 has been overlaying huge text on the actual video
# clip for 2.3 months. See [[session-2026-06-13-render-audit-findings]].
animation:
  word_by_word:
    whisper_sync:
      enabled: false
      model_size: "base"
      fallback: "wpm"
      silence_threshold_db: -40
      skip_tts_when_audio: true
      min_confidence: 0.3
      ab_test:
        enabled: false   # flip to true when ready to measure
        wpm_control_pct: 0.30  # 30% of stories get WPM as control group


# Channel branding (used by FrameCompositor for text overlays)
branding:
  channel_name: "FrameDrift"
  handle: "@theframedrift"
  logo_path: "assets/logos/FrameDrift-Logo.png"
  accent_color: "#7B3FE4"


# Intelligent Transformation (PR 1-16 sprint, 2026-07-05)
# Multi-dimensional bandit-driven render choices per publish.
# Schema-only until GENLAB_INTELLIGENT_TRANSFORM_ENABLED=1 + enabled: true below.
# See memory: intelligent-transformation-architecture-2026-07-05
# Note: FrameDrift audience prefers source audio per prior analysis
# (content-policy-deep-dive-2026-07-05); conservative audio_ducking
# defaults preserve more of the original clip.
intelligent_transform:
  # 2026-07-17: flipped false → true. All 4 other niches already have
  # this enabled and are accumulating transformation-arm reward data.
  # Anime was left dormant which meant the 255-arm transformation
  # bandit had zero observations from FrameDrift, degrading cross-
  # niche transfer signal quality. Env `GENLAB_INTELLIGENT_TRANSFORM_ENABLED`
  # must also be true; if the env flag is off this file's value is
  # a no-op (schema-only), matching the deploy discipline used when
  # gaming shipped in 2026-07-05.
  enabled: true  # per-niche activation; GENLAB_INTELLIGENT_TRANSFORM_ENABLED env also required
  dimensions:
    music_mood:
      enabled: true
      moods: [dramatic, orchestral, emotional, epic_battle, whimsical, ethereal]
      source: pixabay
      source_audio_duck_db: -9   # anime: less aggressive ducking, source audio matters more
      music_bed_db: -9           # music bed quieter than default
    caption_style:
      enabled: true
      styles: [word_by_word, hormozi_yellow, karaoke, minimal, meme]
      default_pacing_ms: 750
    hook_framing:
      enabled: true
      framings: [question_open, statistic_shock, contrarian_take, curiosity_gap, jump_cut_visual, story_open, pov_frame, pattern_break]
    intro_animation:
      enabled: true
      # QB-FIX-01 F3d-1 (2026-08-06): force_none defaults true — orchestrator
      # overrides bandit pick and skips intro. FrameDrift has no intro assets
      # today (F3c) so this is defense-in-depth; if assets are ever added the
      # default stays skip-intro until an operator flips force_none: false.
      templates: [logo_zoom, logo_tagline_reveal, pattern_break_intro, none]
      asset_dir: assets/motion/intros
      force_none: true
    outro_cta:
      enabled: true
      styles: [follow, comment, save, share, question]
      asset_dir: assets/motion/outros
    pan_zoom:
      enabled: true
      patterns: [ken_burns_slow, punch_in, jump_cut, no_motion, dolly]
    highlight_moment:
      enabled: true
      methods: [llm_pick, audio_peak, motion_peak, first_frame]
      # 2026-07-14 audit: was 8s (default). Same trap the other 4
      # niches hit — 8s window + ~3s intro + ~3s outro concat = 14s
      # transformed output, JUST BELOW the 15s SPEC.min_duration
      # guard at post_render_transform.py:241. Every anime
      # transformation attempt fell through to base composite with
      # arm_ids_by_dimension={} → 55 anime transformation arms stuck
      # at α=β=1 n_plays=0 for weeks.
      # Bumped to 16s to match gaming/sports/movies/ai_creators —
      # 16 + 3 + 3 = 22s, safely above the 15s floor. Anime bandit
      # arms will start accumulating plays from next fire.
      window_seconds: 16
    audio_ducking:
      enabled: true
      levels_db: [-6, -9, -12]  # anime: conservative range (less aggressive than other niches)
    music_visual_sync:
      enabled: true
      modes: [beat_cut, ambient, none]
    caption_emphasis_color:
      enabled: true
      colors: [yellow, red, cyan, gradient, none]
    caption_pacing:
      enabled: true
      pacing_ms_options: [600, 700, 800, 900]
