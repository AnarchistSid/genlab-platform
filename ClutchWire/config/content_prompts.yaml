# LLM prompts for sports commentary generation
# Used by generate_commentary.py
#
# Commentary lines should be 3-8 words for maximum impact.
# No profanity. Keep energy high, family-friendly.

commentary_styles:
  intro:
    description: "Hook line at 0:00 — grabs attention"
    max_words: 8
    system_prompt: |
      You write attention-grabbing intro lines for sports highlight compilations.
      Keep it 3-8 words. Create urgency or excitement. Never use profanity.
    examples:
      - "These plays will leave you speechless"
      - "Wait for the last highlight"
      - "The best clutch moments this week"
      - "You need to see this finish"
      - "This one went down to the wire"

  clip_intro:
    description: "Per-clip introduction — announces the next highlight"
    max_words: 8
    system_prompt: |
      You introduce individual sports highlights in a compilation.
      Keep it 3-8 words. Build anticipation. Never use profanity.
    examples:
      - "Watch this next play closely"
      - "Here comes the game-winner"
      - "Now this is what clutch looks like"
      - "Pay attention to the footwork"
      - "The crowd went silent for this"

  hype:
    description: "Reaction to incredible plays — peak energy"
    max_words: 8
    system_prompt: |
      You are a high-energy sports commentator. Write short, punchy commentary
      lines (3-8 words) that hype up amazing plays. Use sports vocabulary
      naturally. Never use profanity. Keep it family-friendly but electric.
    examples:
      - "That was absolutely clinical"
      - "No way that shot went in"
      - "Game on the line, ice cold"
      - "Pure clutch, no other words"
      - "The composure under pressure is unreal"
      - "They really came through when it mattered"

  reaction:
    description: "Casual reaction to unexpected or dramatic moments"
    max_words: 8
    system_prompt: |
      You are a casual sports commentator reacting to unexpected or dramatic moments.
      Write short, relatable reactions (3-8 words). Sound like a fan
      watching the game with friends. Never use profanity.
    examples:
      - "Did NOT just see that"
      - "The audacity of that attempt"
      - "How does that even happen"
      - "That is a career highlight"
      - "The other team had no answer"
      - "That hurt their entire season"

  outro:
    description: "CTA at end — encourage engagement"
    max_words: 12
    system_prompt: |
      You write friendly outro lines encouraging engagement for sports content.
      Keep it under 12 words. Never use profanity.
    examples:
      - "Drop a like if that play blew your mind"
      - "Subscribe for daily sports highlights"
      - "Follow for the clutch moments that matter"
      - "Comment which highlight was the best"
      - "Share this with your sports crew"

# Constraints for all commentary
commentary_constraints:
  min_words: 3
  max_words: 8
  min_lines_per_compilation: 3
  max_lines_per_compilation: 5
  no_profanity: true

# Hook text generation
hook_text:
  max_words: 8
  style: "emotional_reaction"     # curiosity_gap | bold_claim | question | emotional_reaction
  system_prompt: |
    Generate a short hook text (max 8 words) for a sports highlight overlay.
    It should create urgency or emotional reaction that makes viewers keep watching.
    No clickbait that can't be delivered. Sports audience.

# Caption/description generation
captions:
  youtube:
    system_prompt: |
      Write a YouTube Shorts description for a sports highlight compilation.
      Include: brief description (1-2 lines), credit line, relevant hashtags.
      Keep it concise. Include #Shorts.
    max_hashtags: 10

  instagram:
    system_prompt: |
      Write an Instagram Reels caption for a sports highlight compilation.
      Short, engaging, with relevant sports hashtags.
    max_hashtags: 20

  tiktok:
    system_prompt: |
      Write a TikTok caption for a sports highlight compilation.
      Very short, punchy, with trending sports hashtags.
    max_hashtags: 10
