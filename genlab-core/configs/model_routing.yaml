# configs/model_routing.yaml
# Model routing by pipeline task type.
# All models must be Anthropic Claude — pipeline stages call anthropic.Anthropic() directly.
# Tiered strategy: Sonnet for quality-critical, Haiku for volume/utility.

default_model: "claude-haiku-4-5-20251001"

task_routing:
  # Quality-critical (hooks, captions, post copy)
  generate_hooks: "claude-sonnet-4-6"
  score_hook_quality: "claude-sonnet-4-6"
  write_post_content: "claude-sonnet-4-6"

  # Volume work (content writing, adaptation)
  generate_script: "claude-haiku-4-5-20251001"
  write_gaming_content: "claude-haiku-4-5-20251001"
  write_sports_content: "claude-haiku-4-5-20251001"
  write_movie_content: "claude-haiku-4-5-20251001"
  write_anime_content: "claude-haiku-4-5-20251001"
  generate_captions: "claude-haiku-4-5-20251001"
  adapt_for_platforms: "claude-haiku-4-5-20251001"

  # Utility
  extract_game_name: "claude-haiku-4-5-20251001"
  classify_content_type: "claude-haiku-4-5-20251001"
  enrich_metadata: "claude-haiku-4-5-20251001"
  summarise_article: "claude-haiku-4-5-20251001"

budget_fallbacks:
  expensive_to_mid: "claude-haiku-4-5-20251001"
  mid_to_cheapest: "claude-haiku-4-5-20251001"
